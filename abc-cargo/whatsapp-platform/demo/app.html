			/* --------------------------------- helpers for the newer screens */

			/** The last thing the customer said, whichever way it was recorded. */
			function lastInboundAt(c) {
				if (c.lastInboundAt) return c.lastInboundAt;
				const last = [...c.messages].reverse().find((m) => m.dir === "in");
				return last ? last.at : null;
			}

			/** The customer has spoken since we last did. */
			function isUnanswered(c) {
				if (c.status === "resolved") return false;
				const msgs = [...c.messages].reverse();
				const lastIn = msgs.find((m) => m.dir === "in");
				if (!lastIn) return false;
				const lastOut = msgs.find((m) => m.dir === "out");
				return !lastOut || Date.parse(lastOut.at) < Date.parse(lastIn.at);
			}

			function customerFor(conversation) {
				return customerById(conversation.customerId);
			}

			/*
			 * The lifecycle stage is derived by the platform from what the customer
			 * has actually done, not stored on a record somebody has to remember to
			 * update. This gathers the facts and hands them to ENGINE.lifecycleFor.
			 */
			function lifecycleOf(customer) {
				const theirConversation = state.conversations.find(
					(c) => c.customerId === customer.id,
				);
				return ENGINE.lifecycleFor(
					{
						leads: state.leads
							.filter((l) => l.customerId === customer.id)
							.map((l) => ({ stage: l.stage, updatedAt: l.updatedAt })),
						quotations: state.quotations
							.filter((q) => q.customerId === customer.id)
							.map((q) => ({ status: q.status, updatedAt: q.updatedAt })),
						bookings: state.bookings
							.filter((b) => b.customerId === customer.id)
							.map((b) => ({ milestone: b.milestone, createdAt: b.createdAt })),
						lastInboundAt: theirConversation
							? lastInboundAt(theirConversation)
							: null,
					},
					now(),
				);
			}

			/* ----------------------------------------------------- view: dashboard */

			/*
			 * Everything on this screen that says "open", "closes in" or "today"
			 * comes from ENGINE.officeState and ENGINE.regionalDay, which is the
			 * same code the real dashboard route runs. The three regions are read
			 * in their own hours, which is why they do not agree.
			 */
			function viewDashboard() {
				const me = "Hakkeem M";
				const greet = ENGINE.greeting({
					displayName: me,
					now: now(),
					timezone: currentRegion().timezone,
				});

				const strip = REGIONS.map((r) => {
					const o = ENGINE.officeState(r, now());
					const day = ENGINE.regionalDay(now(), r.timezone);
					const convs = state.conversations.filter((c) => c.regionId === r.id);
					const unanswered = convs.filter((c) => isUnanswered(c));
					const todayIn = convs.reduce(
						(n, c) =>
							n +
							c.messages.filter(
								(m) => m.dir === "in" && m.at >= day.from && m.at < day.to,
							).length,
						0,
					);
					const openTickets = state.tickets.filter(
						(t) =>
							t.regionId === r.id &&
							(t.status === "open" || t.status === "pending"),
					);
					const breaching = openTickets.filter(
						(t) =>
							(!t.firstResponseAt && isBreached(t.firstResponseDueAt, now())) ||
							isBreached(t.resolutionDueAt, now()),
					);
					return `<section class="card">
						<h2>${esc(r.label)} <span class="mono muted" style="font-size:11.5px">${esc(r.displayNumber)}</span></h2>
						<div style="display:flex;align-items:center;gap:8px;margin:2px 0 10px">
							<span class="pill ${o.open ? "pill-open" : "pill-closed"}">${o.open ? "Open" : "Closed"}</span>
							<span class="mono" style="font-size:13px">${esc(o.localTime)}</span>
							<span class="muted" style="font-size:12px">${esc(o.nextChange ?? "")} in ${esc(ENGINE.describeMinutes(o.changesInMinutes))}</span>
						</div>
						<div class="stats" style="grid-template-columns:repeat(2,1fr)">
							<div class="stat"><div class="n">${unanswered.length}</div><div class="l">Waiting on us</div><div class="h">${convs.length} open in total</div></div>
							<div class="stat"><div class="n">${todayIn}</div><div class="l">Inbound today</div><div class="h">${esc(r.timezone)} day</div></div>
							<div class="stat"><div class="n">${openTickets.length}</div><div class="l">Open tickets</div><div class="h">${breaching.length} past target</div></div>
							<div class="stat"><div class="n">${state.presence[r.id] ? 1 : 0}</div><div class="l">Agents online</div><div class="h">${state.presence[r.id] ? "cover" : "nobody on"}</div></div>
						</div>
					</section>`;
				}).join("");

				const attention = state.conversations
					.filter((c) => isUnanswered(c))
					.map((c) => ({
						c,
						mins: Math.floor(
							(now().getTime() - Date.parse(lastInboundAt(c))) / 60000,
						),
					}))
					.sort((a, b) => b.mins - a.mins)
					.slice(0, 8);

				return `<div style="display:grid;gap:14px">
					<section class="card">
						<h2>${esc(greet)}</h2>
						<p class="muted" style="margin:2px 0 0">
							Greeted in ${esc(currentRegion().label)} hours. A dashboard answers
							what needs doing now; the reports answer how we did. An agent sees
							this screen and not those.
						</p>
					</section>
					<div class="grid2" style="grid-template-columns:repeat(3,1fr)">${strip}</div>
					<section class="card">
						<h2>Needs somebody now</h2>
						${
							attention.length === 0
								? `<p class="muted">Nobody is waiting.</p>`
								: `<div class="tablewrap"><table>
							<thead><tr><th>Customer</th><th>Number</th><th>Waiting</th><th></th></tr></thead>
							<tbody>${attention
								.map(
									({ c, mins }) => `<tr>
								<td>${esc(customerFor(c)?.displayName ?? c.waId)}</td>
								<td><span class="dot dot-${esc(c.regionId)}" style="display:inline-block;margin-right:6px"></span>${esc(findRegionById(REGIONS, c.regionId)?.label ?? c.regionId)}</td>
								<td class="mono">${esc(ENGINE.describeMinutes(mins))}</td>
								<td><button type="button" class="ghost" data-open-conv="${esc(c.id)}">Open</button></td>
							</tr>`,
								)
								.join("")}</tbody></table></div>`
						}
					</section>
				</div>`;
			}

			/* ----------------------------------------------------------- view: bot */

			/*
			 * The preview runs ENGINE.previewFlow, which calls the same runTurn a
			 * live message goes through. It is not a second walk of the step graph:
			 * if it were, it would drift, and a flow would behave one way here and
			 * another in front of a customer.
			 */
			function viewBot() {
				const region = currentRegion();
				const starter = ENGINE.buildStarterFlow({
					id: region.id,
					label: region.label,
				});
				const flow = {
					id: "demo",
					regionId: region.id,
					name: starter.name,
					version: 1,
					status: "published",
					entryStepId: starter.entryStepId,
					steps: starter.steps,
				};
				const check = ENGINE.validateFlow(flow);
				const errors = check.problems.filter((p) => p.severity === "error");
				const warnings = check.problems.filter((p) => p.severity === "warning");

				const script = state.botScript ?? DEFAULT_BOT_SCRIPT;
				const messages = script
					.split("\n")
					.map((line) => line.trim())
					.filter(Boolean)
					.map((text) => ({
						text,
						facts: {
							contactName: "Rashid",
							references: ENGINE.extractTrackingNumbers(text),
							booking: /088210/.test(text.replace(/[^0-9]/g, ""))
								? { ref: "ABC-UAE-088210", milestone: "In transit" }
								: null,
						},
					}));

				let result = null;
				try {
					result = ENGINE.previewFlow({ flow, messages });
				} catch (error) {
					result = null;
				}

				const turns = (result?.turns ?? [])
					.map(
						(
							t,
						) => `<div style="border-top:1px solid var(--rule-soft);padding:10px 0">
						<div class="mono" style="font-size:12px;color:var(--ink-3)">customer</div>
						<div style="margin:2px 0 8px">${esc(t.customer)}</div>
						${t.replies
							.map(
								(r) =>
									`<div class="bubble out" style="margin:4px 0"><div class="text">${esc(r)}</div></div>`,
							)
							.join("")}
						${
							t.effects.length
								? `<div class="muted" style="font-size:12px;margin-top:6px">also: ${esc(
										t.effects
											.map((e) =>
												e.kind === "handover"
													? `hand to an agent (${e.reason})`
													: e.kind === "open_ticket"
														? `open a ${e.type} ticket`
														: "open a lead",
											)
											.join(", "),
									)}</div>`
								: ""
						}
						<details style="margin-top:6px">
							<summary class="muted" style="font-size:12px;cursor:pointer">why</summary>
							<div class="mono" style="font-size:11.5px;color:var(--ink-3);padding-top:4px">
								${t.trace.map((x) => esc(`${x.stepId} · ${x.kind} · ${x.note}`)).join("<br>")}
							</div>
						</details>
					</div>`,
					)
					.join("");

				/*
				 * Wireframe 1f draws a block palette and a canvas. The platform's
				 * step kinds are shown in that vocabulary so the two can be read
				 * against each other, and where they do not correspond it says so
				 * rather than inventing a block.
				 */
				/*
				 * Three sessions sitting at the same waiting step, silent for
				 * different lengths of time. The decisions are the platform's
				 * — ENGINE.checkFallback — not the screen's, so the middle row
				 * stops counting when the region closes.
				 */
				const waitingStep = flow.steps.find(
					(st) => st.kind === "ask" || st.kind === "menu",
				);
				/*
				 * The explanation is DERIVED from the decision rather than
				 * written beside it. A static note contradicted the live answer
				 * the moment the clock moved after hours: the row read "past
				 * it, goes to the desk" while the decision correctly read
				 * "wait 10m", because out of hours no business minutes had
				 * elapsed. A caption that can disagree with the thing it
				 * captions is worse than no caption.
				 */
				const FALLBACK_NOTES = {
					waiting: "still inside the threshold",
					silent_too_long:
						"past it — goes to the regional desk with the answers so far",
					tier1_held_too_long: "Tier 1 has held it too long; Tier 2 takes it",
					not_waiting: "not a step a customer is answering",
					already_ended: "already handed over or finished",
					session_expired:
						"older than the service window; expired, not escalated",
					customer_replied: "the customer came back",
				};
				const fallbackScenarios = [
					{ label: "4 minutes ago", minutes: 4 },
					{ label: "20 minutes ago", minutes: 20 },
					{ label: "3 hours ago", minutes: 180 },
				].map((sc) => {
					const since = new Date(
						now().getTime() - sc.minutes * 60000,
					).toISOString();
					const session = {
						flowId: flow.id,
						flowVersion: flow.version,
						stepId: waitingStep ? waitingStep.id : null,
						slots: { reference: "ABC-UAE-088210" },
						invalidReplies: 0,
						turns: 2,
						startedAt: since,
						updatedAt: since,
						endedAt: null,
						endedReason: null,
					};
					const decision = ENGINE.checkFallback({
						session,
						step: waitingStep ?? null,
						region,
						windowExpiresAt: new Date(
							now().getTime() + 6 * 3600000,
						).toISOString(),
						now: now(),
					});
					return {
						label: sc.label,
						since,
						decision,
						note: FALLBACK_NOTES[decision.reason] ?? decision.reason,
					};
				});

				/* The clone, if a destination has been picked. */
				const cloneTarget = state.cloneTarget
					? REGIONS.find((r) => r.id === state.cloneTarget)
					: null;
				const cloneOutcome = cloneTarget
					? ENGINE.cloneFlowToRegion(flow, region, cloneTarget)
					: null;

				const BLOCK_NAMES = {
					message: "Send message",
					ask: "Ask question",
					menu: "Menu / buttons",
					classify: "Condition · intent",
					lookup: "API call · CRM/ERP",
					create: "Create record",
					handover: "Handover to agent",
					end: "End",
				};
				const blocks = flow.steps
					.map((step) => {
						const detail =
							step.kind === "menu"
								? `${step.options.length} options`
								: step.kind === "ask"
									? `→ ${step.slot}`
									: step.kind === "lookup"
										? "shipment status"
										: step.kind === "create"
											? step.create
											: "";
						// A waiting step is the only kind a fallback applies to.
						const fallback =
							step.kind === "ask" || step.kind === "menu"
								? `fallback ${step.fallbackMinutes ?? ENGINE.DEFAULT_FALLBACK_MINUTES}m`
								: "";
						return `<div style="display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--rule-soft)">
							<span class="pill" style="min-width:140px">${esc(BLOCK_NAMES[step.kind] || step.kind)}</span>
							<span class="mono" style="font-size:11.5px;color:var(--ink-3)">${esc(step.id)}</span>
							<span class="muted" style="font-size:11.5px">${esc(detail)}</span>
							${fallback ? `<span class="mono muted" style="font-size:11px;margin-left:auto">${esc(fallback)}</span>` : ""}
						</div>`;
					})
					.join("");

				return `<div style="display:grid;gap:14px">
					<section class="card">
						<h2>${esc(region.label)} bot flow</h2>
						<p class="muted" style="margin:2px 0 10px">
							A starting point, <strong>not</strong> ABC Cargo's live Freshchat flow
							for this number — those three have not been exported yet. The
							machinery below is what will run them.
						</p>
						<div style="display:flex;gap:8px;flex-wrap:wrap">
							<span class="pill ${errors.length ? "pill-closed" : "pill-open"}">
								${errors.length ? `${errors.length} error${errors.length === 1 ? "" : "s"} — would be refused` : "Publishable"}
							</span>
							<span class="pill">${flow.steps.length} steps</span>
							${warnings.length ? `<span class="pill">${warnings.length} warning${warnings.length === 1 ? "" : "s"}</span>` : ""}
						</div>
					</section>

					<section class="card">
						<h2>Blocks in this flow</h2>
						${blocks}
						<p class="muted" style="font-size:12px;margin-top:10px">
							The wireframe's palette also has <strong>Assign to group</strong>,
							a <strong>fallback after 10 minutes</strong> to a second tier, and
							a <strong>clone flow to another region</strong> action. The
							fallback and the clone are built — both are below.
							<strong>Assign to group is not:</strong> the runtime hands over to
							a queue but does not choose which group inside it, because who
							gets what is a routing rule ABC Cargo has not written down yet,
							and a button that picks arbitrarily is worse than no button.
						</p>
						<p class="muted" style="font-size:12px;margin-top:6px">
							A waiting step shows its fallback below. Where a step sets none,
							the platform default of
							${ENGINE.DEFAULT_FALLBACK_MINUTES} minutes applies — the
							wireframe's figure.
						</p>
					</section>

					<section class="card">
						<h2>Fallback and escalation <small>wireframe 1f, "fallback after 10m"</small></h2>
						<p class="muted" style="margin:2px 0 10px">
							A customer who stops replying used to sit at the question until
							the session expired a day later and nobody looked at it. Now a
							waiting step gives up after a set number of minutes and hands
							the conversation to a person, carrying the answers already
							collected so the agent does not re-ask them.
						</p>
						<div class="tablewrap"><table>
							<thead><tr><th>Silent since</th><th>Business minutes</th><th>Decision</th><th>Then</th></tr></thead>
							<tbody>
								${fallbackScenarios
									.map(
										(s) => `<tr>
									<td>${esc(s.label)}<div class="mono muted" style="font-size:11px">${esc(localDateTime(s.since, region.id))}</div></td>
									<td class="mono">${s.decision.silentMinutes}</td>
									<td>${
										s.decision.escalate
											? `<span class="pill pill-warn">escalate · ${esc(s.decision.tier)}</span>`
											: `<span class="pill pill-open">wait ${s.decision.remainingMinutes}m</span>`
									}</td>
									<td class="muted" style="font-size:12px">${esc(s.note)}</td>
								</tr>`,
									)
									.join("")}
							</tbody>
						</table></div>
						<p class="muted" style="font-size:12px;margin-top:10px">
							<strong>The timer runs in business minutes, not wall-clock.</strong>
							A question asked five minutes before closing does not escalate
							into an empty office at midnight; the clock pauses and resumes
							when ${esc(region.label)} opens. Use
							<strong>Jump to after hours</strong> in the top bar to watch the
							middle row stop counting.
						</p>
						<p class="muted" style="font-size:12px;margin-top:6px">
							A rescued conversation ends as a <strong>handover</strong>, not an
							expiry, so it counts as escalated rather than abandoned on the
							Reports screen. That moves numbers between buckets on purpose:
							the bot no longer gets credit for losing somebody quietly.
							Tier 2 is reached only after Tier 1 has held it
							${ENGINE.TIER2_AFTER_MINUTES} business minutes, and there is no
							tier 3 to invent.
						</p>
					</section>

					<section class="card">
						<h2>Clone this flow to another region</h2>
						<p class="muted" style="margin:2px 0 10px">
							The wireframe offers this as one button. It cannot be one, and
							the table says why: the clone arrives as a <strong>draft</strong>
							with everything that stops being true in the destination listed
							for a person to read.
						</p>
						<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
							${REGIONS.filter((r) => r.id !== region.id)
								.map(
									(r) =>
										`<button type="button" class="ghost" data-clone="${esc(r.id)}" aria-pressed="${state.cloneTarget === r.id}">
											to ${esc(r.label)}
										</button>`,
								)
								.join("")}
						</div>
						${
							cloneOutcome === null
								? `<p class="muted">Pick a destination to see what cloning would flag.</p>`
								: cloneOutcome.ok === false
									? `<p class="muted" style="color:var(--brand-ink)">Refused: ${esc(cloneOutcome.error)}</p>`
									: `<div class="tablewrap"><table>
											<thead><tr><th>Step</th><th>What</th><th>Detail</th></tr></thead>
											<tbody>
												${
													cloneOutcome.warnings.length
														? cloneOutcome.warnings
																.map(
																	(w) => `<tr>
															<td class="mono">${esc(w.stepId ?? "flow")}</td>
															<td><span class="pill ${w.code.startsWith("queue") ? "pill-critical" : "pill-warn"}">${esc(w.code.replace(/_/g, " "))}</span></td>
															<td class="muted" style="font-size:12px">${esc(w.message)}</td>
														</tr>`,
																)
																.join("")
														: `<tr><td colspan="3" class="muted">Nothing flagged — unusual, and worth re-reading anyway.</td></tr>`
												}
											</tbody>
										</table></div>
										<p class="muted" style="font-size:12px;margin-top:10px">
											Clone would be saved as
											<span class="mono">${esc(cloneOutcome.flow.id)}</span>,
											version ${cloneOutcome.flow.version},
											status <strong>${esc(cloneOutcome.flow.status)}</strong>,
											and ${cloneOutcome.validation.ok ? "passes" : "fails"} the
											publish checks.
											${ENGINE.cloneNeedsReview(cloneOutcome) ? "<strong>Needs a human before it goes live.</strong>" : ""}
										</p>
										<p class="muted" style="font-size:12px;margin-top:6px">
											The one in red is the one that matters. A handover queue
											naming the source region is remapped, because a cloned
											flow that still points at the Dubai desk puts
											${esc(regionLabel(state.cloneTarget ?? ""))} customers in a
											queue nobody there is watching — a silent mis-route, which
											is the worst kind. A queue that names no region is left
											alone and flagged rather than guessed at.
										</p>`
						}
					</section>

					<div class="grid2">
						<section class="card">
							<h2>Try a conversation</h2>
							<p class="muted" style="margin:2px 0 8px">One customer message per line.</p>
							<textarea id="botScript" rows="6" style="width:100%;font-family:inherit">${esc(script)}</textarea>
							<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
								<button type="button" id="botRun">Run it</button>
								<button type="button" class="ghost" id="botReset">Reset</button>
							</div>
							<p class="muted" style="font-size:12px;margin-top:8px">
								Nothing is sent. The preview returns what the bot would say and
								what it would ask the platform to do.
							</p>
						</section>
						<section class="card">
							<h2>What the customer would get</h2>
							${turns || `<p class="muted">Add a message and run it.</p>`}
							${
								result?.handedOver
									? `<p class="muted" style="font-size:12px;margin-top:8px">The conversation reached a person.</p>`
									: ""
							}
						</section>
					</div>
				</div>`;
			}

			const DEFAULT_BOT_SCRIPT = [
				"Hello",
				"Where is my shipment ABC-UAE-088210",
				"No, thank you",
			].join("\n");

			/* --------------------------------------------------- view: broadcasts */

			/*
			 * The audience rule is compiled by ENGINE.compileAudience, and the SQL
			 * it produces is shown as-is. The point of showing it is the two
			 * conditions nobody can switch off: the opt-out exclusion and the
			 * missing-number exclusion are added by the compiler, not by the rule.
			 */
			function viewBroadcasts() {
				const region = currentRegion();
				const rule = state.broadcastRule ?? { notBookedWithinDays: 90 };
				const kind = state.broadcastKind ?? "marketing";
				const problems = ENGINE.validateAudience(rule);
				const compiled = ENGINE.compileAudience({
					regionId: region.id,
					rule,
					optedInOnly: kind === "marketing",
					now: now(),
				});

				// Resolved against the demonstration's own customers, the same way
				// the service does it: everyone the filters reach, with the
				// marketing opt-in recorded as a skip rather than a silent drop.
				const candidates = state.customers.filter(
					(c) => c.regionId === region.id,
				);
				const audience = [];
				const skipped = [];
				for (const c of candidates) {
					const booked = state.bookings.filter((b) => b.customerId === c.id);
					const recent = booked.some(
						(b) =>
							now().getTime() - Date.parse(b.createdAt) <
							(rule.notBookedWithinDays ?? 0) * 86400000,
					);
					if (rule.notBookedWithinDays !== undefined && recent) continue;
					if (!c.waId) {
						skipped.push([c, "no_wa_id"]);
						continue;
					}
					if (kind === "marketing" && c.optInMarketing === false) {
						skipped.push([c, "not_opted_in"]);
						continue;
					}
					audience.push(c);
				}

				const bc = {
					id: "bc_demo",
					regionId: region.id,
					status: state.broadcastStatus ?? "draft",
					createdBy: "usr_hakkeem",
					resolvedAt: state.broadcastResolvedAt ?? null,
					resolvedCount: state.broadcastResolvedAt ? audience.length : null,
					approvedBy: state.broadcastApprovedBy ?? null,
					approvedAt: state.broadcastApprovedBy ? nowIso() : null,
					startedAt: null,
				};
				const author = {
					kind: "user",
					id: "usr_hakkeem",
					email: "h@abccargo.ae",
					displayName: "Hakkeem M",
					role: "master_admin",
					status: "active",
					regionIds: [region.id],
					teamIds: [],
				};
				const colleague = {
					...author,
					id: "usr_mariam",
					displayName: "Mariam",
				};

				const selfApprove = ENGINE.canApproveBroadcast(author, bc);
				const colleagueApprove = ENGINE.canApproveBroadcast(colleague, bc);
				const send = ENGINE.checkReadyToSend({
					caller: author,
					broadcast: bc,
					sendingEnabled: false,
					now: now(),
				});

				return `<div style="display:grid;gap:14px">
					<section class="card">
						<h2>Audience</h2>
						<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
							<label>Kind
								<select id="bcKind">
									<option value="marketing" ${kind === "marketing" ? "selected" : ""}>Marketing — needs opt-in</option>
									<option value="service" ${kind === "service" ? "selected" : ""}>Service notice — does not</option>
								</select>
							</label>
							<label>Not shipped within
								<select id="bcDays">
									${[30, 90, 180]
										.map(
											(d) =>
												`<option value="${d}" ${rule.notBookedWithinDays === d ? "selected" : ""}>${d} days</option>`,
										)
										.join("")}
								</select>
							</label>
						</div>
						<p style="margin:0 0 8px">${esc(ENGINE.describeAudience(rule, kind === "marketing"))}</p>
						${
							problems.length
								? `<p class="muted" style="color:var(--critical)">${esc(problems.map((p) => p.message).join("; "))}</p>`
								: ""
						}
						<details>
							<summary class="muted" style="font-size:12px;cursor:pointer">the query this produces</summary>
							<pre class="mono" style="font-size:11px;white-space:pre-wrap;color:var(--ink-3);margin-top:6px">${esc(compiled.sql)}</pre>
							<p class="muted" style="font-size:11.5px">
								The opt-out exclusion and the missing-number exclusion are added
								by the compiler, not by the rule. No audience can be written
								without them.
							</p>
						</details>
					</section>

					<div class="grid2">
						<section class="card">
							<h2>Who would get it</h2>
							<div class="stats" style="grid-template-columns:repeat(2,1fr)">
								<div class="stat"><div class="n">${audience.length}</div><div class="l">Would be messaged</div></div>
								<div class="stat"><div class="n">${skipped.length}</div><div class="l">Skipped, with a reason</div></div>
							</div>
							${
								skipped.length
									? `<div class="tablewrap" style="margin-top:8px"><table><tbody>${skipped
											.map(
												([c, why]) =>
													`<tr><td>${esc(c.displayName)}</td><td class="mono muted">${esc(why)}</td></tr>`,
											)
											.join("")}</tbody></table></div>`
									: ""
							}
						</section>

						<section class="card">
							<h2>Before it can go out</h2>
							<p class="muted" style="margin:2px 0 10px">Status: <span class="pill">${esc(bc.status)}</span></p>
							<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
								<button type="button" id="bcResolve">Resolve the audience</button>
								<button type="button" class="ghost" id="bcReview">Send for review</button>
								<button type="button" class="ghost" id="bcApproveSelf">Approve it myself</button>
								<button type="button" class="ghost" id="bcApproveOther">Mariam approves</button>
								<button type="button" class="ghost" id="bcSend">Send</button>
								<button type="button" class="ghost" id="bcResetBroadcast">Reset</button>
							</div>
							<ul style="margin:0;padding-left:18px;line-height:1.7">
								<li>Approve it myself — <strong>${selfApprove.allowed ? "allowed" : "refused"}</strong>${selfApprove.allowed ? "" : `: ${esc(selfApprove.message)}`}</li>
								<li>Mariam approves — <strong>${colleagueApprove.allowed ? "allowed" : "refused"}</strong>${colleagueApprove.allowed ? "" : `: ${esc(colleagueApprove.message)}`}</li>
								<li>Send now — <strong>${send.allowed ? "allowed" : "refused"}</strong>${send.allowed ? "" : `: ${esc(send.message)}`}</li>
							</ul>
							<p class="muted" style="font-size:12px;margin-top:10px">
								Sending is switched off for this deployment, and a broadcast is
								approved by somebody other than its author. Both refusals above
								come from the platform's own rules.

						</section>
					</div>
				</div>`;
			}

			/* ------------------------------------------- view: reports (wireframe 1e) */

			/*
			 * The supervisor dashboard from wireframe 1e. Its note says the
			 * supervisor is the only role that sees across all three regions, so
			 * this screen deliberately ignores the region switcher.
			 *
			 * Two figures the wireframe shows are missing on purpose: CSAT and bot
			 * deflection. Nothing in the platform measures either yet — CSAT needs
			 * a survey after resolution, deflection needs a definition of "resolved
			 * by the bot alone". A plausible number nobody can trace is worse on a
			 * management screen than an honest gap.
			 */
			/* ================================================================
			 * Charts
			 *
			 * Hand-built inline SVG, single series per plot. That is not a
			 * limitation worked around — it is the point. Red, white and black
			 * has one accent hue, so a chart that told three regions apart by
			 * colour would need three, and generating two more would be
			 * inventing brand colours. Three regions therefore become three
			 * small panels with one hue each (small multiples), which is the
			 * standard answer and happens to be easier to read than a
			 * three-colour grouped chart would have been.
			 *
			 * A single series needs no legend: the panel heading names what is
			 * plotted. Values are labelled selectively — the peak only — and
			 * every number is also in the table underneath, so nothing is
			 * reachable by hover alone.
			 * ================================================================ */

			/** Fixed mark specs, so every chart on the screen matches. */
			const CHART = {
				barMax: 24,
				barGap: 2,
				radius: 4,
				padTop: 16,
				padBottom: 18,
				padLeft: 30,
			};

			/**
			 * A single-series column chart.
			 *
			 * Bars grow from one baseline, are capped at 24px wide however much
			 * room there is, carry a 4px rounded top and a square foot, and are
			 * separated by 2px of surface rather than by a stroke. Gridlines are
			 * hairline and recessive. Each bar carries a <title> so hovering
			 * gives the exact value, and an aria-label so a screen reader gets
			 * the series without the geometry.
			 */
			function columnChart(points, opts) {
				const o = Object.assign(
					{ width: 320, height: 132, unit: "", labelEvery: 1, forcedMax: 0 },
					opts || {},
				);
				// A shared scale when the caller supplies one (small multiples),
				// otherwise this panel's own. Honouring forcedMax is what keeps
				// the panels comparable; ignoring it was a bug here once.
				const max =
					o.forcedMax && o.forcedMax > 0
						? o.forcedMax
						: ENGINE.niceMax(points.map((p) => p.value));
				const plotW = o.width - CHART.padLeft - 6;
				const plotH = o.height - CHART.padTop - CHART.padBottom;
				const band = points.length ? plotW / points.length : plotW;
				const barW = Math.min(CHART.barMax, Math.max(3, band - CHART.barGap));
				const baseY = CHART.padTop + plotH;

				// Two gridlines only: the top of the scale and the midpoint. More
				// would out-ink the data.
				const grid = [0, 0.5, 1]
					.map((f) => {
						const y = CHART.padTop + plotH * (1 - f);
						return `<line x1="${CHART.padLeft}" y1="${y.toFixed(1)}" x2="${o.width - 6}" y2="${y.toFixed(1)}"
							stroke="var(--rule-soft)" stroke-width="1" />`;
					})
					.join("");

				const ticks = [0, max]
					.map((v, i) => {
						const y = i === 0 ? baseY : CHART.padTop;
						return `<text x="${CHART.padLeft - 6}" y="${y + 3}" text-anchor="end"
							font-size="9" fill="var(--ink-3)" font-family="var(--mono)">${v}</text>`;
					})
					.join("");

				const peak = points.reduce(
					(best, p, i) => (p.value > (points[best]?.value ?? -1) ? i : best),
					0,
				);

				const bars = points
					.map((p, i) => {
						const h = max > 0 ? (p.value / max) * plotH : 0;
						const x = CHART.padLeft + band * i + (band - barW) / 2;
						const y = baseY - h;
						const r = Math.min(CHART.radius, h);
						// Rounded at the data end, square at the baseline.
						const d =
							h <= 0
								? ""
								: `M ${x} ${baseY} L ${x} ${y + r} Q ${x} ${y} ${x + r} ${y}
							   L ${x + barW - r} ${y} Q ${x + barW} ${y} ${x + barW} ${y + r}
							   L ${x + barW} ${baseY} Z`;
						const label =
							i === peak && p.value > 0
								? `<text x="${x + barW / 2}" y="${y - 4}" text-anchor="middle"
										font-size="9.5" fill="var(--ink-2)" font-family="var(--mono)">${p.value}${esc(o.unit)}</text>`
								: "";
						const tick =
							i % o.labelEvery === 0
								? `<text x="${x + barW / 2}" y="${baseY + 12}" text-anchor="middle"
										font-size="9" fill="var(--ink-3)">${esc(p.label)}</text>`
								: "";
						return `<g><title>${esc(p.label)}: ${p.value}${esc(o.unit)}</title>
							${d ? `<path d="${d}" fill="var(--brand)" />` : ""}
							<rect x="${x}" y="${CHART.padTop}" width="${barW}" height="${plotH}" fill="transparent" />
							${label}${tick}</g>`;
					})
					.join("");

				const total = points.reduce((n, p) => n + p.value, 0);
				return `<svg viewBox="0 0 ${o.width} ${o.height}" width="100%" height="${o.height}"
					role="img" aria-label="${esc(o.aria || "Column chart")}. ${points.length} values, total ${total}, peak ${points[peak]?.value ?? 0}."
					style="display:block;overflow:visible">
					${grid}${ticks}
					<line x1="${CHART.padLeft}" y1="${baseY}" x2="${o.width - 6}" y2="${baseY}"
						stroke="var(--rule)" stroke-width="1" />
					${bars}
				</svg>`;
			}

			/**
			 * One panel per region, each a single-series chart on the same
			 * scale.
			 *
			 * The shared scale is what makes the comparison honest: panels drawn
			 * to their own maxima look identical however different the volumes
			 * are, which is the classic small-multiples mistake.
			 */
			function smallMultiples(series, opts) {
				const everyValue = series.flatMap((s) => s.points.map((p) => p.value));
				const shared = ENGINE.niceMax(everyValue);
				return `<div class="grid3" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
					${series
						.map((s) => {
							const region = REGIONS.find((r) => r.id === s.name);
							const label = region ? region.label : s.name;
							const total = s.points.reduce((n, p) => n + p.value, 0);
							return `<figure style="margin:0">
								<figcaption style="font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:4px">
									<span class="dot dot-${esc(s.name)}" style="width:8px;height:8px;border-radius:50%;display:inline-block"></span>
									${esc(label)}
									<span class="mono muted" style="font-weight:400">${total} total</span>
								</figcaption>
								${columnChart(
									s.points,
									Object.assign({}, opts, {
										forcedMax: shared,
										aria: `${label} ${opts && opts.aria ? opts.aria : "volume"}`,
									}),
								)}
							</figure>`;
						})
						.join("")}
				</div>`;
			}

			/**
			 * Builds and downloads one report as CSV.
			 *
			 * The rows are assembled here from the demonstration's own state and
			 * then handed to ENGINE.toCsv, which owns the escaping — including
			 * the apostrophe prefix that stops a field like `=HYPERLINK(...)`
			 * running as a formula when the file is opened. The screen does not
			 * get to decide how a field is escaped.
			 */
			function exportReport(reportId) {
				const def = ENGINE.findReport(reportId);
				if (!def) {
					toast("Unknown report.");
					return;
				}

				// Reports are a supervisor view. The platform decides, not the
				// button's presence — a disabled-looking button is not a control.
				const allowed = ENGINE.canViewReports(currentCaller());
				if (!allowed.allowed) {
					toast("Reports are limited to team leads and administrators.");
					return;
				}

				const rows = reportRows(def);
				if (rows.length === 0) {
					toast("That report has no rows for this window.");
					return;
				}

				const csv = ENGINE.toCsv(def, rows);
				const window14 = reportWindow();
				const name = ENGINE.exportFilename(def, window14);

				try {
					const blob = new Blob([csv], {
						type: "text/csv;charset=utf-8",
					});
					const url = URL.createObjectURL(blob);
					const a = document.createElement("a");
					a.href = url;
					a.download = name;
					document.body.appendChild(a);
					a.click();
					a.remove();
					// Revoked on a timer rather than immediately: some browsers
					// have not finished reading the blob when click() returns.
					setTimeout(() => URL.revokeObjectURL(url), 10000);
					toast(`${rows.length} rows exported as ${name}`);
				} catch {
					toast("This browser would not accept the download.");
				}
			}

			/** The window the library reports cover. */
			function reportWindow() {
				const to = now();
				const from = new Date(to.getTime() - 13 * 86400000);
				return { from: from.toISOString(), to: to.toISOString() };
			}

			/**
			 * The rows behind each report, from the same state the charts use.
			 *
			 * Kept in one place so the CSV and the chart cannot drift apart: the
			 * chart for `volume_by_day` is drawn from exactly these rows.
			 */
			function reportRows(def) {
				switch (def.id) {
					case "volume_by_day":
						return state.dailyVolume.map((r) => ({
							day: r.day,
							regionId: regionLabel(r.regionId),
							conversations: r.conversations,
						}));

					case "first_response":
						return REGIONS.map((r) => {
							const mine = state.conversations.filter(
								(c) => c.regionId === r.id,
							);
							const answered = mine.filter((c) => c.firstResponseAt);
							const late = answered.filter(
								(c) =>
									c.firstResponseDueAt &&
									Date.parse(c.firstResponseAt) >
										Date.parse(c.firstResponseDueAt),
							);
							return {
								regionId: r.label,
								answered: answered.length,
								withinTarget: answered.length - late.length,
								late: late.length,
								unanswered: mine.length - answered.length,
							};
						});

					case "tickets_by_type":
						return ENGINE.TICKET_TYPES.map((type) => {
							const mine = state.tickets.filter((t) => t.type === type);
							return {
								type: titleCase(type),
								opened: mine.length,
								resolved: mine.filter(
									(t) => t.status === "resolved" || t.status === "closed",
								).length,
								overdue: mine.filter(
									(t) =>
										t.status !== "resolved" &&
										t.status !== "closed" &&
										t.resolutionDueAt &&
										isBreached(t.resolutionDueAt, now()),
								).length,
							};
						});

					case "csat_distribution": {
						const summary = ENGINE.summarise(
							state.csat.responses,
							Object.values(state.csat.sent).reduce((n, v) => n + v, 0),
						);
						return ENGINE.csatDistributionRows(summary.distribution);
					}

					default:
						return [];
				}
			}

			/** A region's label, falling back to its id rather than to blank. */
			function regionLabel(regionId) {
				const r = REGIONS.find((x) => x.id === regionId);
				return r ? r.label : regionId;
			}

			function viewReports() {
				const convs = state.conversations;
				const atRisk = convs.filter(
					(c) => !c.firstResponseAt && c.firstResponseDueAt,
				);
				const breached = atRisk.filter((c) =>
					isBreached(c.firstResponseDueAt, now()),
				);

				const byRegion = REGIONS.map((r) => {
					const mine = convs.filter((c) => c.regionId === r.id);
					return {
						region: r,
						total: mine.length,
						whatsapp: mine.filter((c) => channelOf(c) === "whatsapp").length,
						email: mine.filter((c) => channelOf(c) === "email").length,
						call: mine.filter((c) => channelOf(c) === "call").length,
						waiting: mine.filter((c) => isUnanswered(c)).length,
					};
				});
				const max = Math.max(1, ...byRegion.map((b) => b.total));

				// First response, measured rather than asserted: the gap between the
				// customer's first message and ours, for the conversations that have
				// had one.
				const answered = convs.filter((c) => c.firstResponseAt);
				const avgFirst =
					answered.length === 0
						? null
						: Math.round(
								answered.reduce(
									(n, c) =>
										n +
										(Date.parse(c.firstResponseAt) -
											Date.parse(c.lastInboundAt)),
									0,
								) /
									answered.length /
									60000,
							);

				// Satisfaction and deflection, both measured rather than asserted.
				// Each refuses to publish a figure below its own minimum sample, and
				// the screen prints the reason instead of a number.
				const csatAll = ENGINE.summarise(
					state.csat.responses,
					Object.values(state.csat.sent).reduce((n, v) => n + v, 0),
				);
				const csatByRegion = ENGINE.summariseByRegion(
					state.csat.responses,
					state.csat.sent,
				);
				const deflection = ENGINE.summariseDeflection(state.botSessions);
				const deflectionByFlow = ENGINE.summariseByFlow(state.botSessions);
				const hotspots = ENGINE.abandonmentHotspots(state.botSessions);
				const pct = (v) => `${Math.round(v * 100)}%`;
				const volumeSeries = ENGINE.toSeries(
					state.dailyVolume,
					"day",
					"conversations",
					"regionId",
				);

				return `<div style="display:grid;gap:14px">
					<section class="card">
						<h2>Team performance <small>all regions</small></h2>
						<p class="muted" style="margin:2px 0 0">
							The supervisor is the only role that sees across all three
							regions, so this screen ignores the region switcher.
						</p>
					</section>

					<div class="stats">
						<div class="stat"><div class="n">${convs.length}</div><div class="l">Conversations</div><div class="h">all channels</div></div>
						<div class="stat"><div class="n">${avgFirst === null ? "—" : esc(ENGINE.describeMinutes(Math.abs(avgFirst)))}</div><div class="l">Avg first response</div><div class="h">target ${CONVERSATION_FIRST_RESPONSE_MINUTES}m</div></div>
						<div class="stat"><div class="n">${breached.length}</div><div class="l">SLA breaches</div><div class="h">${atRisk.length} still at risk</div></div>
						<div class="stat">
							<div class="n">${deflection.reportable && deflection.deflectionRate !== null ? esc(pct(deflection.deflectionRate)) : "—"}</div>
							<div class="l">Bot deflection</div>
							<div class="h">${deflection.reportable ? `of ${deflection.resolved} ended sessions` : esc(deflection.note)}</div>
						</div>
						<div class="stat">
							<div class="n">${csatAll.reportable && csatAll.mean !== null ? esc(csatAll.mean.toFixed(1)) : "—"}</div>
							<div class="l">CSAT</div>
							<div class="h">${csatAll.reportable ? `${csatAll.responses} of ${csatAll.sent} answered` : esc(csatAll.note)}</div>
						</div>
					<section class="card">
						<h2>Bot deflection <small>${deflection.resolved} ended sessions</small></h2>
						<p class="muted" style="margin:2px 0 10px">
							A session counts as deflected when the flow finished and no
							human sent a message. A handover, a request for an agent and a
							flow that got stuck all count as escalated — a bot failing is
							not a bot deflecting.
						</p>
						<div class="tablewrap"><table>
							<thead><tr><th>Outcome</th><th>Sessions</th><th>Share</th><th>Reading</th></tr></thead>
							<tbody>
								<tr>
									<td>Deflected</td>
									<td class="mono">${deflection.deflected}</td>
									<td class="mono">${deflection.deflectionRate === null ? "—" : esc(pct(deflection.deflectionRate))}</td>
									<td class="muted" style="font-size:12px">Bot answered, nobody needed</td>
								</tr>
								<tr>
									<td>Escalated</td>
									<td class="mono">${deflection.escalated}</td>
									<td class="mono">${deflection.resolved ? esc(pct(deflection.escalated / deflection.resolved)) : "—"}</td>
									<td class="muted" style="font-size:12px">A person finished it, or the bot failed</td>
								</tr>
								<tr>
									<td>Abandoned</td>
									<td class="mono">${deflection.abandoned}</td>
									<td class="mono">${deflection.abandonmentRate === null ? "—" : esc(pct(deflection.abandonmentRate))}</td>
									<td class="muted" style="font-size:12px">Customer went quiet. Nobody can say whether they were helped</td>
								</tr>
								<tr>
									<td class="muted">Still running</td>
									<td class="mono muted">${deflection.inProgress}</td>
									<td class="muted">—</td>
									<td class="muted" style="font-size:12px">Counted nowhere until they end</td>
								</tr>
							</tbody>
						</table></div>
						<p class="muted" style="font-size:12px;margin-top:10px">
							<strong>The headline figure counts abandonment in the
							denominator.</strong> Excluding it gives
							<strong class="mono">${deflection.rateExcludingAbandoned === null ? "—" : esc(pct(deflection.rateExcludingAbandoned))}</strong>,
							which is the same data read more kindly. Both are shown so that
							neither can be quoted without the other.
						</p>
					</section>

					<section class="card">
						<h2>Conversation volume <small>last 14 days, demonstration data</small></h2>
						<p class="muted" style="margin:2px 0 12px">
							One panel per number, all three on the same scale — panels drawn
							to their own maxima look identical however different the volumes
							are, which is the usual way a small-multiples chart misleads.
						</p>
						${smallMultiples(volumeSeries, { height: 132, labelEvery: 3, aria: "daily conversation volume" })}
						<details style="margin-top:10px">
							<summary class="muted" style="font-size:12px">Table view</summary>
							<div class="tablewrap" style="margin-top:8px"><table>
								<thead><tr><th>Day</th>${REGIONS.map((r) => `<th>${esc(r.label)}</th>`).join("")}</tr></thead>
								<tbody>${(volumeSeries[0] ? volumeSeries[0].points : [])
									.map(
										(p, i) =>
											`<tr><td class="mono">${esc(p.label)}</td>${volumeSeries
												.map(
													(s) =>
														`<td class="mono">${s.points[i] ? s.points[i].value : 0}</td>`,
												)
												.join("")}</tr>`,
									)
									.join("")}</tbody>
							</table></div>
						</details>
					</section>

					<section class="card">
						<h2>Report library</h2>
						<p class="muted" style="margin:2px 0 12px">
							Each report is a definition — what it counts, how it groups, which
							columns it exports — so the chart and the CSV are built from the
							same rows and cannot disagree about what the report contains.
						</p>
						<div class="tablewrap"><table>
							<thead><tr><th>Report</th><th>Groups by</th><th>Chart</th><th>Export</th></tr></thead>
							<tbody>
								${ENGINE.REPORT_LIBRARY.map(
									(def) => `<tr>
									<td><strong>${esc(def.title)}</strong>
										<div class="muted" style="font-size:11.5px">${esc(def.description)}</div></td>
									<td class="mono">${esc(def.group.replace(/_/g, " "))}</td>
									<td class="muted" style="font-size:12px">${def.chart === "none" ? "table only" : esc(def.chart.replace(/_/g, " "))}</td>
									<td><button type="button" class="ghost" data-export="${esc(def.id)}">CSV</button></td>
								</tr>`,
								).join("")}
							</tbody>
						</table></div>
						<p class="muted" style="font-size:12px;margin-top:10px">
							The export writes CRLF endings and a UTF-8 BOM so Excel does not
							turn an Arabic customer name into mojibake, and it prefixes any
							field starting <span class="mono">=</span>, <span class="mono">+</span>,
							<span class="mono">-</span> or <span class="mono">@</span> with an
							apostrophe. Without that last step a customer called
							<span class="mono">=HYPERLINK(…)</span> runs as a formula when the
							file is opened, and a cargo reference starting with a dash is a
							perfectly ordinary thing to have. Supervisors only, per the same
							rule that gates this screen.
						</p>
					</section>

					<section class="card">
						<h2>Satisfaction distribution <small>all regions</small></h2>

			/* --------------------------------------------- view: deals (wireframe 1d) */

			/*
			 * The pipeline from wireframe 1d. Its note is that each card shows the
			 * channel it came from, "so pipeline and inbox stay one system" — which
			 * is the only reason the channel is on the card at all.
			 */
			/*
			 * The wireframe draws five columns. The platform has six stages: it
			 * keeps "qualified" separate from "quoted", because a lead somebody
			 * has spoken to is not the same as one that has had a price put to
			 * it, and folding them hides the step where most deals stall.
			 *
			 * So the vocabulary is the wireframe's and the column count is the
			 * platform's, which is a difference worth seeing rather than hiding.
			 */
			const DEAL_COLUMNS = [
				["new", "New enquiry"],
				["qualified", "Qualified"],
				["quoted", "Quoted"],
				["negotiating", "Negotiation"],
				["won", "Won"],
				["lost", "Lost"],
			];

			function viewDeals() {
				const mine = state.leads.filter((l) => l.regionId === state.regionId);
				const columns = DEAL_COLUMNS.map(([stage, label]) => {
					const cards = mine.filter((l) => l.stage === stage);
					const value = cards.reduce((n, l) => n + (l.estValue || 0), 0);
					return `<section class="card">
						<h2>${esc(label)} <small>${cards.length}${value ? ` · ${esc(String(value))}` : ""}</small></h2>
						${
							cards.length === 0
								? `<p class="muted" style="font-size:12px">—</p>`
								: cards
										.map((l) => {
											const customer = customerById(l.customerId);
											const conv = state.conversations.find(
												(c) => c.customerId === l.customerId,
											);
											return `<div style="padding:8px 0;border-top:1px solid var(--rule-soft)">
										<div>${esc(l.origin || "")} → ${esc(l.destination || "")}</div>
										<div class="muted" style="font-size:11.5px">${esc(customer ? customer.displayName : "")}</div>
										<div style="margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
											<span class="pill">${esc(CHANNEL_LABELS[conv ? channelOf(conv) : "whatsapp"])}</span>
											<span class="mono muted" style="font-size:11.5px">${esc(l.ref)}</span>
											${l.estValue ? `<span class="mono" style="font-size:11.5px">${esc(l.currency || "")} ${esc(String(l.estValue))}</span>` : ""}
										</div>
									</div>`;
										})
										.join("")
						}
					</section>`;
				}).join("");

				return `<div style="display:grid;gap:14px">
					<section class="card">
						<h2>Pipeline · Freight Sales <small>${esc(currentRegion().label)}</small></h2>
						<p class="muted" style="margin:2px 0 0">
							Each card carries the channel it came from, so the pipeline and
							the inbox stay one system rather than two lists about the same
							customer.
						</p>
					</section>
					<div class="grid2" style="grid-template-columns:repeat(6,1fr);align-items:start">${columns}</div>
				</div>`;
			}

			/* ----------------------------------------------------- view: contacts */

			/*
			 * Contact 360 from wireframe 1c. Its note — "record ownership is
			 * region-stamped, which is what enforces the agents-cannot-see-other-
			 * agents-customers rule" — is the reason the region is stated on the
			 * record rather than implied by which list it was opened from.
			 */
			function contact360(customer) {
				const life = lifecycleOf(customer);
				const convs = state.conversations.filter(
					(c) => c.customerId === customer.id,
				);
				const tickets = state.tickets.filter(
					(t) => t.customerId === customer.id,
				);
				const deals = state.leads.filter((l) => l.customerId === customer.id);
				const shipments = state.bookings.filter(
					(b) => b.customerId === customer.id,
				);
				const calls = state.calls.filter((c) => c.customerId === customer.id);

				const timeline = [
					...convs.flatMap((c) =>
						c.messages.map((m) => [m.at, CHANNEL_LABELS[channelOf(c)], m.text]),
					),
					...deals.map((d) => [
						d.createdAt,
						"Deal",
						`${d.ref} ${d.origin || ""}→${d.destination || ""}`,
					]),
					...shipments.map((b) => [
						b.createdAt,
						"Shipment",
						`${b.ref} ${b.milestone}`,
					]),
					...calls.map((c) => [c.startedAt, "Call", c.outcome || ""]),
				]
					.filter(([at]) => at)
					.sort((a, b) => Date.parse(b[0]) - Date.parse(a[0]))
					.slice(0, 8);

				return `<section class="card">
					<h2>${esc(customer.displayName)} <small>${esc(customer.company || "")}</small></h2>
					<div style="display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px">
						<span class="pill">${esc(regionOf(customer.regionId).label)} only</span>
						<span class="pill">${esc(life.label)}</span>
						<span class="pill">${esc(life.band)} · ${life.temperature}</span>
					</div>
					<div class="stats" style="grid-template-columns:repeat(4,1fr)">
						<div class="stat"><div class="n">${convs.length}</div><div class="l">Conversations</div></div>
						<div class="stat"><div class="n">${tickets.filter((t) => t.status === "open" || t.status === "pending").length}</div><div class="l">Open tickets</div></div>
						<div class="stat"><div class="n">${deals.filter((d) => isLeadOpen(d.stage)).length}</div><div class="l">Open deals</div></div>
						<div class="stat"><div class="n">${shipments.length}</div><div class="l">Shipments</div></div>
					</div>
					<h2 style="margin-top:14px">Timeline — all channels</h2>
					${
						timeline.length === 0
							? `<p class="muted" style="font-size:12px">Nothing recorded yet.</p>`
							: timeline
									.map(
										([
											at,
											kind,
											text,
										]) => `<div style="padding:6px 0;border-top:1px solid var(--rule-soft);display:flex;gap:10px">
							<span class="pill" style="min-width:86px">${esc(kind)}</span>
							<span style="flex:1">${esc(String(text).slice(0, 110))}</span>
							<span class="mono muted" style="font-size:11.5px">${esc(ago(at))}</span>
						</div>`,
									)
									.join("")
					}
					<p class="muted" style="font-size:12px;margin-top:10px">
						The wireframe also shows the last five consignments read from the
						ERP by API. That integration is an open decision, so nothing is
						shown rather than something invented.
					</p>
				</section>`;
			}

			function viewContacts() {
				const selected = state.selectedCustomerId
					? customerById(state.selectedCustomerId)
					: null;
				if (selected) {
					return `<div style="display:grid;gap:14px">
						<button type="button" class="ghost" data-contact-back="1" style="justify-self:start">← All contacts</button>
						${contact360(selected)}
					</div>`;
				}
				const cards = ENGINE.CUSTOMER_STAGES.map((stage) => {
					const inStage = state.customers
						.map((c) => ({ c, life: lifecycleOf(c) }))
						.filter((x) => x.life.stage === stage)
						.sort((a, b) => b.life.temperature - a.life.temperature);
					return `<section class="card">
						<h2>${esc(ENGINE.CUSTOMER_STAGE_LABELS[stage])} <span class="muted" style="font-weight:400">${inStage.length}</span></h2>
						${
							inStage.length === 0
								? `<p class="muted" style="font-size:12px">—</p>`
								: inStage
										.map(
											({
												c,
												life,
											}) => `<div data-contact="${esc(c.id)}" role="button" tabindex="0" style="padding:6px 0;border-top:1px solid var(--rule-soft);cursor:pointer">
								<div>${esc(c.displayName)}</div>
								<div class="muted" style="font-size:11.5px">${esc(c.company ?? "")}</div>
								<div class="mono" style="font-size:11.5px;color:var(--ink-3)">${esc(life.band)} · ${life.temperature}</div>
							</div>`,
										)
										.join("")
						}
					</section>`;
				}).join("");

				return `<div style="display:grid;gap:14px">
					<section class="card">
						<h2>Contacts</h2>
						<p class="muted" style="margin:2px 0 0">
							The stage is <strong>derived</strong>, not stored — from each
							customer's leads, quotations and shipments. It cannot go stale,
							and nobody has to remember to move a card.
						</p>
					</section>
					<div class="grid2" style="grid-template-columns:repeat(4,1fr);align-items:start">${cards}</div>
				</div>`;
			}

			/* --------------------------------------------------------- view: chat */

			function viewChat() {
				const thread = {
					id: "thr_demo",
					kind: "direct",
					participantIds: ["usr_hakkeem", "usr_mariam"],

					["Omar — not in it", person("usr_omar", "Omar", "agent")],
					[
						"A master admin, not in it",
						person("usr_admin", "Admin", "master_admin"),

						<h2>Team chat</h2>

									</tr>`;

						<p class="muted" style="font-size:12px;margin-top:10px">

			/* -------------------------------------------------------- view: setup */

			/*
			 * Setup, as wireframe 1g draws it. Its second note is the one that

			 * is the thing somebody checks before a cutover.
			 */
			function setupChannels() {
				return `<section class="card">
					<h2>WhatsApp Business numbers</h2>
					<div class="tablewrap"><table>
						<thead><tr><th>Number</th><th>Region</th><th>Routes to</th><th>Hours</th><th>Status</th></tr></thead>
						<tbody>${REGIONS.map((r) => {
							const days = r.businessHours.days.length;
							return `<tr>
								<td class="mono">${esc(r.displayNumber)}</td>
								<td><span class="dot dot-${esc(r.id)}" style="display:inline-block;margin-right:6px"></span>${esc(r.label)}</td>
								<td>${esc(r.label)} bot → ${esc(r.label)} Support</td>
								<td class="mono" style="font-size:11.5px">${esc(r.businessHours.start)}–${esc(r.businessHours.end)} · ${days} day${days === 1 ? "" : "s"}<div class="muted">${esc(r.timezone)}</div></td>
								<td><span class="pill pill-closed">Awaiting go-live</span></td>

						}).join("")}</tbody>
					</table></div>
					<p class="muted" style="font-size:12px;margin-top:10px">

						pre-cutover checks. Until then every number here is a placeholder
						and nothing can be sent.
					</p>
				</section>`;
			}

			/**
			 * Service targets, per team, with the provenance of every row.
			 *
			 * The screen designs set targets on the team; the platform used to set
			 * them per region and per ticket type only. Both now apply, and the
			 * table says which level each figure came from, because a supervisor
			 * looking at a five-minute target will ask why and "inherited from the
			 * region" is a different answer from "this team sets it".
			 */
			function setupSla() {
				const teams = state.teams;
				const policies = state.teamSlaPolicies;
				const regionPolicies = state.regionSlaPolicies;

				const teamBlocks = teams
					.map((team) => {
						const rows = ENGINE.effectivePolicyTable({
							teamId: team.id,
							regionId: team.regionId,
							teamPolicies: policies,
							regionPolicies,
						});
						// Anything the platform refused to apply, collected from the
						// same resolution the table above ran.
						const ignored = [];
						for (const type of ENGINE.TICKET_TYPES) {
							const resolved = ENGINE.resolveTarget(type, "normal", {
								teamIds: [team.id],
								regionId: team.regionId,
								teamPolicies: policies,
								regionPolicies,
							});
							for (const bad of resolved.ignored) {
								if (!ignored.some((i) => i.problem === bad.problem)) {
									ignored.push(bad);
								}
							}
						}

						const body = rows
							.map(
								(row) => `<tr>
							<td>${esc(titleCase(row.type))}</td>
							<td class="mono">${esc(String(row.stated.firstResponseMinutes))}m</td>
							<td class="mono">${esc(String(row.stated.resolutionMinutes))}m</td>
							<td class="${row.inherited ? "muted" : ""}" style="font-size:12px">
								${esc(ENGINE.TARGET_SOURCE_LABELS[row.source])}
							</td>
						</tr>`,
							)
							.join("");

						return `<details ${team.id === "uae-support" ? "open" : ""}>
						<summary><strong>${esc(team.label)}</strong>
							<span class="pill">${esc(team.regionId.toUpperCase())}</span>
							${
								rows.every((r) => r.inherited)
									? `<span class="mono muted" style="font-size:11.5px">all inherited</span>`
									: `<span class="mono" style="font-size:11.5px">${rows.filter((r) => !r.inherited).length} of ${rows.length} set by this team</span>`
							}
						</summary>
						<div class="tablewrap" style="margin-top:8px"><table>
							<thead><tr><th>Ticket type</th><th>First response</th><th>Resolution</th><th>From</th></tr></thead>
							<tbody>${body}</tbody>
						</table></div>
						${
							ignored.length
								? `<p class="muted" style="font-size:12px;margin:8px 0 0;color:var(--bad,#b00)">
									<strong>Ignored:</strong> ${ignored.map((i) => esc(i.problem)).join("; ")}.
									The platform fell through to the next level rather than apply it
									or fail the queue.
								</p>`
								: ""
						}
					</details>`;
					})
					.join("");

				return `<section class="card">
					<h2>Service targets <small>per team</small></h2>
					<div class="tablewrap"><table>
						<thead><tr><th>Applies to</th><th>First response</th><th>Resolution</th></tr></thead>
						<tbody>
							<tr><td>Conversation, any channel</td><td class="mono">${CONVERSATION_FIRST_RESPONSE_MINUTES}m</td><td class="muted">—</td></tr>
						</tbody>
					</table></div>
					<div style="display:grid;gap:6px;margin-top:12px">${teamBlocks}</div>
					<p class="muted" style="font-size:12px;margin-top:12px">
						Counted in <strong>business minutes</strong> on each region's own
						calendar, not wall-clock. The most specific policy wins: the team's
						own entry for the ticket type, then the team's default, then the
						region's, then the platform's. A malformed policy is ignored and
						reported rather than obeyed — open <strong>KSA Night Desk</strong>
						to see one. Priority shortens a target on top of all of this; an
						urgent claim is a quarter of the figure shown.
					</p>
				</section>`;
			}

				const rows = [

						"Agent",
						"Own conversations only, own region",
						"Can take unclaimed work; no cross-agent visibility",
					],
					["Team lead", "All queues in their region", "Reassign, escalate"],
					[
						"Master admin",
						"All three regions",
						"Channels, bots, users, keys, audit log",
					],
				];

					<h2>Roles and visibility</h2>
					<div class="tablewrap"><table>
						<thead><tr><th>Role</th><th>Sees</th><th>Can do</th></tr></thead>
						<tbody>${rows
							.map(
								([a, b, c]) =>
									`<tr><td><span class="pill">${esc(a)}</span></td><td>${esc(b)}</td><td>${esc(c)}</td></tr>`,

							.join("")}</tbody>
					</table></div>
				</section>`;

			function viewSetup() {
				const admins = state.staff.filter(
					(u) => u.role === "master_admin" && u.status === "active",
				);
				const adminIds = admins.map((u) => u.id);

				const rows = state.staff
					.map((u) => {
						const demote = ENGINE.checkUserChange({
							actingUserId: "usr_hakkeem",
							targetUserId: u.id,
							activeAdminIds: adminIds,
							next: { role: "agent" },
						});
						const suspend = ENGINE.checkUserChange({
							actingUserId: "usr_hakkeem",
							targetUserId: u.id,
							activeAdminIds: adminIds,
							next: { status: "suspended" },
						});
						return `<tr>
							<td>${esc(u.displayName)}<div class="mono muted" style="font-size:11.5px">${esc(u.email)}</div></td>
							<td><span class="pill">${esc(u.role.replace(/_/g, " "))}</span></td>
							<td>${demote.ok ? `<button type="button" class="ghost" data-demote="${esc(u.id)}">Make agent</button>` : `<span class="mono muted" title="${esc(demote.message)}">${esc(demote.reason)}</span>`}</td>
							<td>${suspend.ok ? `<button type="button" class="ghost" data-suspend="${esc(u.id)}">Suspend</button>` : `<span class="mono muted" title="${esc(suspend.message)}">${esc(suspend.reason)}</span>`}</td>

				return `<div style="display:grid;gap:14px">

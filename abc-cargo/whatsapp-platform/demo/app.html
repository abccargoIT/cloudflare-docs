			/* --------------------------------- helpers for the newer screens */

			/** The last thing the customer said, whichever way it was recorded. */
			function lastInboundAt(c) {
				if (c.lastInboundAt) return c.lastInboundAt;
				const last = [...c.messages].reverse().find((m) => m.dir === "in");
				return last ? last.at : null;
			}

			/** The customer has spoken since we last did. */
			function isUnanswered(c) {
				if (c.status === "resolved") return false;
				const msgs = [...c.messages].reverse();
				const lastIn = msgs.find((m) => m.dir === "in");
				if (!lastIn) return false;
				const lastOut = msgs.find((m) => m.dir === "out");
				return !lastOut || Date.parse(lastOut.at) < Date.parse(lastIn.at);
			}

			function customerFor(conversation) {
				return customerById(conversation.customerId);
			}

			/*
			 * The lifecycle stage is derived by the platform from what the customer
			 * has actually done, not stored on a record somebody has to remember to
			 * update. This gathers the facts and hands them to ENGINE.lifecycleFor.
			 */
			function lifecycleOf(customer) {
				const theirConversation = state.conversations.find(
					(c) => c.customerId === customer.id,
				);
				return ENGINE.lifecycleFor(
					{
						leads: state.leads
							.filter((l) => l.customerId === customer.id)
							.map((l) => ({ stage: l.stage, updatedAt: l.updatedAt })),
						quotations: state.quotations
							.filter((q) => q.customerId === customer.id)
							.map((q) => ({ status: q.status, updatedAt: q.updatedAt })),
						bookings: state.bookings
							.filter((b) => b.customerId === customer.id)
							.map((b) => ({ milestone: b.milestone, createdAt: b.createdAt })),
						lastInboundAt: theirConversation
							? lastInboundAt(theirConversation)
							: null,
					},
					now(),
				);
			}

			/* ----------------------------------------------------- view: dashboard */

			/*
			 * Everything on this screen that says "open", "closes in" or "today"
			 * comes from ENGINE.officeState and ENGINE.regionalDay, which is the
			 * same code the real dashboard route runs. The three regions are read
			 * in their own hours, which is why they do not agree.
			 */
			function viewDashboard() {
				const me = "Hakkeem M";
				const greet = ENGINE.greeting({
					displayName: me,
					now: now(),
					timezone: currentRegion().timezone,
				});

				const strip = REGIONS.map((r) => {
					const o = ENGINE.officeState(r, now());
					const day = ENGINE.regionalDay(now(), r.timezone);
					const convs = state.conversations.filter((c) => c.regionId === r.id);
					const unanswered = convs.filter((c) => isUnanswered(c));
					const todayIn = convs.reduce(
						(n, c) =>
							n +
							c.messages.filter(
								(m) =>
									m.dir === "in" &&
									m.at >= day.from &&
									m.at < day.to,
							).length,
						0,
					);
					const openTickets = state.tickets.filter(
						(t) =>
							t.regionId === r.id &&
							(t.status === "open" || t.status === "pending"),
					);
					const breaching = openTickets.filter(
						(t) =>
							(!t.firstResponseAt && isBreached(t.firstResponseDueAt, now())) ||
							isBreached(t.resolutionDueAt, now()),
					);
					return `<section class="card">
						<h2>${esc(r.label)} <span class="mono muted" style="font-size:11.5px">${esc(r.displayNumber)}</span></h2>
						<div style="display:flex;align-items:center;gap:8px;margin:2px 0 10px">
							<span class="pill ${o.open ? "pill-open" : "pill-closed"}">${o.open ? "Open" : "Closed"}</span>
							<span class="mono" style="font-size:13px">${esc(o.localTime)}</span>
							<span class="muted" style="font-size:12px">${esc(o.nextChange ?? "")} in ${esc(ENGINE.describeMinutes(o.changesInMinutes))}</span>
						</div>
						<div class="stats" style="grid-template-columns:repeat(2,1fr)">
							<div class="stat"><div class="n">${unanswered.length}</div><div class="l">Waiting on us</div><div class="h">${convs.length} open in total</div></div>
							<div class="stat"><div class="n">${todayIn}</div><div class="l">Inbound today</div><div class="h">${esc(r.timezone)} day</div></div>
							<div class="stat"><div class="n">${openTickets.length}</div><div class="l">Open tickets</div><div class="h">${breaching.length} past target</div></div>
							<div class="stat"><div class="n">${state.presence[r.id] ? 1 : 0}</div><div class="l">Agents online</div><div class="h">${state.presence[r.id] ? "cover" : "nobody on"}</div></div>
						</div>
					</section>`;
				}).join("");

				const attention = state.conversations
					.filter((c) => isUnanswered(c))
					.map((c) => ({
						c,
						mins: Math.floor((now().getTime() - Date.parse(lastInboundAt(c))) / 60000),
					}))
					.sort((a, b) => b.mins - a.mins)
					.slice(0, 8);

				return `<div style="display:grid;gap:14px">
					<section class="card">
						<h2>${esc(greet)}</h2>
						<p class="muted" style="margin:2px 0 0">
							Greeted in ${esc(currentRegion().label)} hours. A dashboard answers
							what needs doing now; the reports answer how we did. An agent sees
							this screen and not those.
						</p>
					</section>
					<div class="grid2" style="grid-template-columns:repeat(3,1fr)">${strip}</div>
					<section class="card">
						<h2>Needs somebody now</h2>
						${
							attention.length === 0
								? `<p class="muted">Nobody is waiting.</p>`
								: `<div class="tablewrap"><table>
							<thead><tr><th>Customer</th><th>Number</th><th>Waiting</th><th></th></tr></thead>
							<tbody>${attention
								.map(
									({ c, mins }) => `<tr>
								<td>${esc(customerFor(c)?.displayName ?? c.waId)}</td>
								<td><span class="dot dot-${esc(c.regionId)}" style="display:inline-block;margin-right:6px"></span>${esc(findRegionById(REGIONS, c.regionId)?.label ?? c.regionId)}</td>
								<td class="mono">${esc(ENGINE.describeMinutes(mins))}</td>
								<td><button type="button" class="ghost" data-open-conv="${esc(c.id)}">Open</button></td>
							</tr>`,
								)
								.join("")}</tbody></table></div>`
						}
					</section>
				</div>`;
			}

			/* ----------------------------------------------------------- view: bot */

			/*
			 * The preview runs ENGINE.previewFlow, which calls the same runTurn a
			 * live message goes through. It is not a second walk of the step graph:
			 * if it were, it would drift, and a flow would behave one way here and
			 * another in front of a customer.
			 */
			function viewBot() {
				const region = currentRegion();
				const starter = ENGINE.buildStarterFlow({ id: region.id, label: region.label });
				const flow = {
					id: "demo",
					regionId: region.id,
					name: starter.name,
					version: 1,
					status: "published",
					entryStepId: starter.entryStepId,
					steps: starter.steps,
				};
				const check = ENGINE.validateFlow(flow);
				const errors = check.problems.filter((p) => p.severity === "error");
				const warnings = check.problems.filter((p) => p.severity === "warning");

				const script = state.botScript ?? DEFAULT_BOT_SCRIPT;
				const messages = script
					.split("\n")
					.map((line) => line.trim())
					.filter(Boolean)
					.map((text) => ({
						text,
						facts: {
							contactName: "Rashid",
							references: ENGINE.extractTrackingNumbers(text),
							booking: /088210/.test(text.replace(/[^0-9]/g, ""))
								? { ref: "ABC-UAE-088210", milestone: "In transit" }
								: null,
						},
					}));

				let result = null;
				try {
					result = ENGINE.previewFlow({ flow, messages });
				} catch (error) {
					result = null;
				}

				const turns = (result?.turns ?? [])
					.map(
						(t) => `<div style="border-top:1px solid var(--rule-soft);padding:10px 0">
						<div class="mono" style="font-size:12px;color:var(--ink-3)">customer</div>
						<div style="margin:2px 0 8px">${esc(t.customer)}</div>
						${t.replies
							.map(
								(r) =>
									`<div class="bubble out" style="margin:4px 0"><div class="text">${esc(r)}</div></div>`,
							)
							.join("")}
						${
							t.effects.length
								? `<div class="muted" style="font-size:12px;margin-top:6px">also: ${esc(
										t.effects
											.map((e) =>
												e.kind === "handover"
													? `hand to an agent (${e.reason})`
													: e.kind === "open_ticket"
														? `open a ${e.type} ticket`
														: "open a lead",
											)
											.join(", "),
									)}</div>`
								: ""
						}
						<details style="margin-top:6px">
							<summary class="muted" style="font-size:12px;cursor:pointer">why</summary>
							<div class="mono" style="font-size:11.5px;color:var(--ink-3);padding-top:4px">
								${t.trace.map((x) => esc(`${x.stepId} · ${x.kind} · ${x.note}`)).join("<br>")}
							</div>
						</details>
					</div>`,
					)
					.join("");

				/*
				 * Wireframe 1f draws a block palette and a canvas. The platform's
				 * step kinds are shown in that vocabulary so the two can be read
				 * against each other, and where they do not correspond it says so
				 * rather than inventing a block.
				 */
				const BLOCK_NAMES = {
					message: "Send message",
					ask: "Ask question",
					menu: "Menu / buttons",
					classify: "Condition · intent",
					lookup: "API call · CRM/ERP",
					create: "Create record",
					handover: "Handover to agent",
					end: "End",
				};
				const blocks = flow.steps
					.map((step) => {
						const detail =
							step.kind === "menu"
								? `${step.options.length} options`
								: step.kind === "ask"
									? `→ ${step.slot}`
									: step.kind === "lookup"
										? "shipment status"
										: step.kind === "create"
											? step.create
											: "";
						return `<div style="display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--rule-soft)">
							<span class="pill" style="min-width:140px">${esc(BLOCK_NAMES[step.kind] || step.kind)}</span>
							<span class="mono" style="font-size:11.5px;color:var(--ink-3)">${esc(step.id)}</span>
							<span class="muted" style="font-size:11.5px">${esc(detail)}</span>
						</div>`;
					})
					.join("");

				return `<div style="display:grid;gap:14px">
					<section class="card">
						<h2>${esc(region.label)} bot flow</h2>
						<p class="muted" style="margin:2px 0 10px">
							A starting point, <strong>not</strong> ABC Cargo's live Freshchat flow
							for this number — those three have not been exported yet. The
							machinery below is what will run them.
						</p>
						<div style="display:flex;gap:8px;flex-wrap:wrap">
							<span class="pill ${errors.length ? "pill-closed" : "pill-open"}">
								${errors.length ? `${errors.length} error${errors.length === 1 ? "" : "s"} — would be refused` : "Publishable"}
							</span>
							<span class="pill">${flow.steps.length} steps</span>
							${warnings.length ? `<span class="pill">${warnings.length} warning${warnings.length === 1 ? "" : "s"}</span>` : ""}
						</div>
					</section>

					<section class="card">
						<h2>Blocks in this flow</h2>
						${blocks}
						<p class="muted" style="font-size:12px;margin-top:10px">
							The wireframe's palette also has <strong>Assign to group</strong>
							and a <strong>fallback after 10 minutes</strong> to a second
							tier, and a <strong>clone flow to another region</strong>
							action. None of the three is built: the runtime hands over to a
							queue but does not choose a group, has no timed fallback, and
							flows are per region with no copy between them.
						</p>
					</section>

					<div class="grid2">
						<section class="card">
							<h2>Try a conversation</h2>
							<p class="muted" style="margin:2px 0 8px">One customer message per line.</p>
							<textarea id="botScript" rows="6" style="width:100%;font-family:inherit">${esc(script)}</textarea>
							<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
								<button type="button" id="botRun">Run it</button>
								<button type="button" class="ghost" id="botReset">Reset</button>
							</div>
							<p class="muted" style="font-size:12px;margin-top:8px">
								Nothing is sent. The preview returns what the bot would say and
								what it would ask the platform to do.
							</p>
						</section>
						<section class="card">
							<h2>What the customer would get</h2>
							${turns || `<p class="muted">Add a message and run it.</p>`}
							${
								result?.handedOver
									? `<p class="muted" style="font-size:12px;margin-top:8px">The conversation reached a person.</p>`
									: ""
							}
						</section>
					</div>
				</div>`;
			}

			const DEFAULT_BOT_SCRIPT = [
				"Hello",
				"Where is my shipment ABC-UAE-088210",
				"No, thank you",
			].join("\n");

			/* --------------------------------------------------- view: broadcasts */

			/*
			 * The audience rule is compiled by ENGINE.compileAudience, and the SQL
			 * it produces is shown as-is. The point of showing it is the two
			 * conditions nobody can switch off: the opt-out exclusion and the
			 * missing-number exclusion are added by the compiler, not by the rule.
			 */
			function viewBroadcasts() {
				const region = currentRegion();
				const rule = state.broadcastRule ?? { notBookedWithinDays: 90 };
				const kind = state.broadcastKind ?? "marketing";
				const problems = ENGINE.validateAudience(rule);
				const compiled = ENGINE.compileAudience({
					regionId: region.id,
					rule,
					optedInOnly: kind === "marketing",
					now: now(),
				});

				// Resolved against the demonstration's own customers, the same way
				// the service does it: everyone the filters reach, with the
				// marketing opt-in recorded as a skip rather than a silent drop.
				const candidates = state.customers.filter((c) => c.regionId === region.id);
				const audience = [];
				const skipped = [];
				for (const c of candidates) {
					const booked = state.bookings.filter((b) => b.customerId === c.id);
					const recent = booked.some(
						(b) =>
							now().getTime() - Date.parse(b.createdAt) <
							(rule.notBookedWithinDays ?? 0) * 86400000,
					);
					if (rule.notBookedWithinDays !== undefined && recent) continue;
					if (!c.waId) {
						skipped.push([c, "no_wa_id"]);
						continue;
					}
					if (kind === "marketing" && c.optInMarketing === false) {
						skipped.push([c, "not_opted_in"]);
						continue;
					}
					audience.push(c);
				}

				const bc = {
					id: "bc_demo",
					regionId: region.id,
					status: state.broadcastStatus ?? "draft",
					createdBy: "usr_hakkeem",
					resolvedAt: state.broadcastResolvedAt ?? null,
					resolvedCount: state.broadcastResolvedAt ? audience.length : null,
					approvedBy: state.broadcastApprovedBy ?? null,
					approvedAt: state.broadcastApprovedBy ? nowIso() : null,
					startedAt: null,
				};
				const author = {
					kind: "user",
					id: "usr_hakkeem",
					email: "h@abccargo.ae",
					displayName: "Hakkeem M",
					role: "master_admin",
					status: "active",
					regionIds: [region.id],
					teamIds: [],
				};
				const colleague = { ...author, id: "usr_mariam", displayName: "Mariam" };

				const selfApprove = ENGINE.canApproveBroadcast(author, bc);
				const colleagueApprove = ENGINE.canApproveBroadcast(colleague, bc);
				const send = ENGINE.checkReadyToSend({
					caller: author,
					broadcast: bc,
					sendingEnabled: false,
					now: now(),
				});

				return `<div style="display:grid;gap:14px">
					<section class="card">
						<h2>Audience</h2>
						<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
							<label>Kind
								<select id="bcKind">
									<option value="marketing" ${kind === "marketing" ? "selected" : ""}>Marketing — needs opt-in</option>
									<option value="service" ${kind === "service" ? "selected" : ""}>Service notice — does not</option>
								</select>
							</label>
							<label>Not shipped within
								<select id="bcDays">
									${[30, 90, 180]
										.map(
											(d) =>
												`<option value="${d}" ${rule.notBookedWithinDays === d ? "selected" : ""}>${d} days</option>`,
										)
										.join("")}
								</select>
							</label>
						</div>
						<p style="margin:0 0 8px">${esc(ENGINE.describeAudience(rule, kind === "marketing"))}</p>
						${
							problems.length
								? `<p class="muted" style="color:var(--critical)">${esc(problems.map((p) => p.message).join("; "))}</p>`
								: ""
						}
						<details>
							<summary class="muted" style="font-size:12px;cursor:pointer">the query this produces</summary>
							<pre class="mono" style="font-size:11px;white-space:pre-wrap;color:var(--ink-3);margin-top:6px">${esc(compiled.sql)}</pre>
							<p class="muted" style="font-size:11.5px">
								The opt-out exclusion and the missing-number exclusion are added
								by the compiler, not by the rule. No audience can be written
								without them.
							</p>
						</details>
					</section>

					<div class="grid2">
						<section class="card">
							<h2>Who would get it</h2>
							<div class="stats" style="grid-template-columns:repeat(2,1fr)">
								<div class="stat"><div class="n">${audience.length}</div><div class="l">Would be messaged</div></div>
								<div class="stat"><div class="n">${skipped.length}</div><div class="l">Skipped, with a reason</div></div>
							</div>
							${
								skipped.length
									? `<div class="tablewrap" style="margin-top:8px"><table><tbody>${skipped
											.map(
												([c, why]) =>
													`<tr><td>${esc(c.displayName)}</td><td class="mono muted">${esc(why)}</td></tr>`,
											)
											.join("")}</tbody></table></div>`
									: ""
							}
						</section>

						<section class="card">
							<h2>Before it can go out</h2>
							<p class="muted" style="margin:2px 0 10px">Status: <span class="pill">${esc(bc.status)}</span></p>
							<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
								<button type="button" id="bcResolve">Resolve the audience</button>
								<button type="button" class="ghost" id="bcReview">Send for review</button>
								<button type="button" class="ghost" id="bcApproveSelf">Approve it myself</button>
								<button type="button" class="ghost" id="bcApproveOther">Mariam approves</button>
								<button type="button" class="ghost" id="bcSend">Send</button>
								<button type="button" class="ghost" id="bcResetBroadcast">Reset</button>
							</div>
							<ul style="margin:0;padding-left:18px;line-height:1.7">
								<li>Approve it myself — <strong>${selfApprove.allowed ? "allowed" : "refused"}</strong>${selfApprove.allowed ? "" : `: ${esc(selfApprove.message)}`}</li>
								<li>Mariam approves — <strong>${colleagueApprove.allowed ? "allowed" : "refused"}</strong>${colleagueApprove.allowed ? "" : `: ${esc(colleagueApprove.message)}`}</li>
								<li>Send now — <strong>${send.allowed ? "allowed" : "refused"}</strong>${send.allowed ? "" : `: ${esc(send.message)}`}</li>
							</ul>
							<p class="muted" style="font-size:12px;margin-top:10px">
								Sending is switched off for this deployment, and a broadcast is
								approved by somebody other than its author. Both refusals above
								come from the platform's own rules.
							</p>
						</section>
					</div>
				</div>`;
			}

			/* ------------------------------------------- view: reports (wireframe 1e) */

			/*
			 * The supervisor dashboard from wireframe 1e. Its note says the
			 * supervisor is the only role that sees across all three regions, so
			 * this screen deliberately ignores the region switcher.
			 *
			 * Two figures the wireframe shows are missing on purpose: CSAT and bot
			 * deflection. Nothing in the platform measures either yet — CSAT needs
			 * a survey after resolution, deflection needs a definition of "resolved
			 * by the bot alone". A plausible number nobody can trace is worse on a
			 * management screen than an honest gap.
			 */
			function viewReports() {
				const convs = state.conversations;
				const atRisk = convs.filter(
					(c) => !c.firstResponseAt && c.firstResponseDueAt,
				);
				const breached = atRisk.filter((c) => isBreached(c.firstResponseDueAt, now()));

				const byRegion = REGIONS.map((r) => {
					const mine = convs.filter((c) => c.regionId === r.id);
					return {
						region: r,
						total: mine.length,
						whatsapp: mine.filter((c) => channelOf(c) === "whatsapp").length,
						email: mine.filter((c) => channelOf(c) === "email").length,
						call: mine.filter((c) => channelOf(c) === "call").length,
						waiting: mine.filter((c) => isUnanswered(c)).length,
					};
				});
				const max = Math.max(1, ...byRegion.map((b) => b.total));

				// First response, measured rather than asserted: the gap between the
				// customer's first message and ours, for the conversations that have
				// had one.
				const answered = convs.filter((c) => c.firstResponseAt);
				const avgFirst =
					answered.length === 0
						? null
						: Math.round(
								answered.reduce(
									(n, c) =>
										n +
										(Date.parse(c.firstResponseAt) - Date.parse(c.lastInboundAt)),
									0,
								) /
									answered.length /
									60000,
							);

				return `<div style="display:grid;gap:14px">
					<section class="card">
						<h2>Team performance <small>all regions</small></h2>
						<p class="muted" style="margin:2px 0 0">
							The supervisor is the only role that sees across all three
							regions, so this screen ignores the region switcher.
						</p>
					</section>

					<div class="stats">
						<div class="stat"><div class="n">${convs.length}</div><div class="l">Conversations</div><div class="h">all channels</div></div>
						<div class="stat"><div class="n">${avgFirst === null ? "—" : esc(ENGINE.describeMinutes(Math.abs(avgFirst)))}</div><div class="l">Avg first response</div><div class="h">target ${CONVERSATION_FIRST_RESPONSE_MINUTES}m</div></div>
						<div class="stat"><div class="n">${breached.length}</div><div class="l">SLA breaches</div><div class="h">${atRisk.length} still at risk</div></div>
						<div class="stat"><div class="n">—</div><div class="l">Bot deflection</div><div class="h">not measured yet</div></div>
						<div class="stat"><div class="n">—</div><div class="l">CSAT</div><div class="h">no survey yet</div></div>
					</div>

					<div class="grid2">
						<section class="card">
							<h2>Volume by region and channel</h2>
							<div class="tablewrap"><table>
								<thead><tr><th>Region</th><th>WhatsApp</th><th>Email</th><th>Calls</th><th>Total</th><th></th></tr></thead>
								<tbody>${byRegion
									.map(
										(b) => `<tr>
										<td><span class="dot dot-${esc(b.region.id)}" style="display:inline-block;margin-right:6px"></span>${esc(b.region.label)}</td>
										<td>${b.whatsapp}</td><td>${b.email}</td><td>${b.call}</td><td><strong>${b.total}</strong></td>
										<td style="width:34%"><span style="display:block;height:8px;border-radius:999px;background:var(--brand);width:${Math.round((b.total / max) * 100)}%"></span></td>
									</tr>`,
									)
									.join("")}</tbody>
							</table></div>
						</section>

						<section class="card">
							<h2>Live queue</h2>
							<div class="tablewrap"><table>
								<thead><tr><th>Region</th><th>Waiting on us</th><th>Unassigned</th></tr></thead>
								<tbody>${byRegion
									.map(
										(b) => `<tr>
										<td>${esc(b.region.label)}</td>
										<td>${b.waiting}</td>
										<td>${convs.filter((c) => c.regionId === b.region.id && !c.assignedAgentId).length}</td>
									</tr>`,
									)
									.join("")}</tbody>
							</table></div>
							<p class="muted" style="font-size:12px;margin-top:10px">
								The wireframe has a "Rebalance agents" action here. It is not
								built: moving work between agents needs a rule for who gets
								what, and that is a decision rather than a button.
							</p>
						</section>
					</div>
				</div>`;
			}

			/* --------------------------------------------- view: deals (wireframe 1d) */

			/*
			 * The pipeline from wireframe 1d. Its note is that each card shows the
			 * channel it came from, "so pipeline and inbox stay one system" — which
			 * is the only reason the channel is on the card at all.
			 */
			/*
			 * The wireframe draws five columns. The platform has six stages: it
			 * keeps "qualified" separate from "quoted", because a lead somebody
			 * has spoken to is not the same as one that has had a price put to
			 * it, and folding them hides the step where most deals stall.
			 *
			 * So the vocabulary is the wireframe's and the column count is the
			 * platform's, which is a difference worth seeing rather than hiding.
			 */
			const DEAL_COLUMNS = [
				["new", "New enquiry"],
				["qualified", "Qualified"],
				["quoted", "Quoted"],
				["negotiating", "Negotiation"],
				["won", "Won"],
				["lost", "Lost"],
			];

			function viewDeals() {
				const mine = state.leads.filter((l) => l.regionId === state.regionId);
				const columns = DEAL_COLUMNS.map(([stage, label]) => {
					const cards = mine.filter((l) => l.stage === stage);
					const value = cards.reduce((n, l) => n + (l.estValue || 0), 0);
					return `<section class="card">
						<h2>${esc(label)} <small>${cards.length}${value ? ` · ${esc(String(value))}` : ""}</small></h2>
						${
							cards.length === 0
								? `<p class="muted" style="font-size:12px">—</p>`
								: cards
										.map((l) => {
											const customer = customerById(l.customerId);
											const conv = state.conversations.find(
												(c) => c.customerId === l.customerId,
											);
											return `<div style="padding:8px 0;border-top:1px solid var(--rule-soft)">
										<div>${esc(l.origin || "")} → ${esc(l.destination || "")}</div>
										<div class="muted" style="font-size:11.5px">${esc(customer ? customer.displayName : "")}</div>
										<div style="margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
											<span class="pill">${esc(CHANNEL_LABELS[conv ? channelOf(conv) : "whatsapp"])}</span>
											<span class="mono muted" style="font-size:11.5px">${esc(l.ref)}</span>
											${l.estValue ? `<span class="mono" style="font-size:11.5px">${esc(l.currency || "")} ${esc(String(l.estValue))}</span>` : ""}
										</div>
									</div>`;
										})
										.join("")
						}
					</section>`;
				}).join("");

				return `<div style="display:grid;gap:14px">
					<section class="card">
						<h2>Pipeline · Freight Sales <small>${esc(currentRegion().label)}</small></h2>
						<p class="muted" style="margin:2px 0 0">
							Each card carries the channel it came from, so the pipeline and
							the inbox stay one system rather than two lists about the same
							customer.
						</p>
					</section>
					<div class="grid2" style="grid-template-columns:repeat(6,1fr);align-items:start">${columns}</div>
				</div>`;
			}


			/* ----------------------------------------------------- view: contacts */

			/*
			 * Contact 360 from wireframe 1c. Its note — "record ownership is
			 * region-stamped, which is what enforces the agents-cannot-see-other-
			 * agents-customers rule" — is the reason the region is stated on the
			 * record rather than implied by which list it was opened from.
			 */
			function contact360(customer) {
				const life = lifecycleOf(customer);
				const convs = state.conversations.filter(
					(c) => c.customerId === customer.id,
				);
				const tickets = state.tickets.filter((t) => t.customerId === customer.id);
				const deals = state.leads.filter((l) => l.customerId === customer.id);
				const shipments = state.bookings.filter(
					(b) => b.customerId === customer.id,
				);
				const calls = state.calls.filter((c) => c.customerId === customer.id);

				const timeline = [

					(t) =>
						(!t.firstResponseAt && isBreached(t.firstResponseDueAt, now())) ||
						isBreached(t.resolutionDueAt, now()),
				);
				const atRisk = openTickets.filter(
					(t) =>
						!breached.includes(t) &&
						((!t.firstResponseAt &&
							remainingMs(t.firstResponseDueAt, now()) < 60 * 60000) ||
							remainingMs(t.resolutionDueAt, now()) < 60 * 60000),
				);
				const openLeads = state.leads.filter((l) => isLeadOpen(l.stage));
				const won = state.leads.filter((l) => l.stage === "won");
				const stalled = state.bookings.filter(
					(b) =>
						!isDelivered(b.milestone) &&
						checkStall(b.milestone, b.milestoneAt, now()).stalled,
				);
				const msgsToday = state.conversations.reduce(
					(n, c) =>
						n +
						c.messages.filter(
							(m) => now().getTime() - Date.parse(m.at) < 24 * 3_600_000,
						).length,
					0,
				);

				const byStage = LEAD_STAGES.map((s) => [

					state.leads.filter((l) => l.stage === s).length,

						<div class="stat"><div class="n">${openLeads.length}</div><div class="l">Open leads</div><div class="h">${won.length} won so far</div></div>
						<div class="stat"><div class="n">${state.bookings.filter((b) => !isDelivered(b.milestone)).length}</div><div class="l">Shipments moving</div><div class="h">${stalled.length} not moving as expected</div></div>
						<div class="stat"><div class="n">${msgsToday}</div><div class="l">Messages, last 24h</div><div class="h">across all three numbers</div></div>
					</div>

					<div class="grid2">
						<section class="card">

										return `<tr>
											<td><span class="dot dot-${esc(r.id)}" style="display:inline-block;margin-right:6px"></span>${esc(r.label)}<div class="mono muted" style="font-size:11.5px">${esc(r.displayNumber)}</div></td>
											<td><span class="pill ${open ? "pill-open" : "pill-closed"}">${open ? "Open" : "Closed"}</span><div class="muted" style="font-size:11.5px">${esc(r.businessHours.start)}–${esc(r.businessHours.end)} ${esc(r.timezone)}</div></td>
											<td>${state.conversations.filter((c) => c.regionId === r.id).length}</td>
											<td>${state.tickets.filter((t) => t.regionId === r.id && (t.status === "open" || t.status === "pending")).length}</td>
											<td>${state.leads.filter((l) => l.regionId === r.id && isLeadOpen(l.stage)).length}</td>
										</tr>`;
									}).join("")}</tbody>
								</table>
							</div>
						</section>

						<section class="card">
							<h2>Lead pipeline</h2>

								<div class="bars">
									${byStage
										.map(

										<span>${esc(s)}</span>

										<span class="v">${n}</span>
									</div>`,

										.join("")}
								</div>
							</div>

					<section class="card">
						<h2>What this demonstration is, and is not</h2>
						<div class="pad" style="display:grid;gap:11px">
							<div class="note">
								<b>It is the real decision logic.</b> Intent recognition in
								English and Arabic, the service-target clocks on each region's
								own calendar, the reference formats, the lead, quotation and
								milestone transitions, and the automated replies are all the
								platform's own compiled code, inlined into this page at build
								time. If a rule changes in the source, this page changes with
								it. Nothing on these screens is a drawing of behaviour.

								browser, not in the database, and the page never makes a

								placeholders because they need ABC Cargo's own answers rather

			/* ------------------------------------------------------------- events */

			function toast(message) {
				const el = document.getElementById("toast");
				el.textContent = message;
				el.classList.add("show");
				window.clearTimeout(toast._t);
				toast._t = window.setTimeout(() => el.classList.remove("show"), 2600);
			}

			document.addEventListener("click", (event) => {
				const t = event.target.closest("[data-region],[data-view],[data-conv],[data-sample],[data-lead],[data-quote],[data-quotemove],[data-ticket],[data-booking],[data-logcall],[data-open-conv],[data-demote],[data-suspend],[data-inbox-filter],[data-contact],[data-contact-back]");
				if (t) {
					if (t.dataset.region) {
						state.regionId = t.dataset.region;
						state.selectedConversationId = null;
						lastTrace = null;
						save();
						renderApp();
						return;
					}
					if (t.dataset.view) {
						state.view = t.dataset.view;
						save();
						renderApp();
						return;
					}
					if (t.dataset.conv) {
						state.selectedConversationId = t.dataset.conv;
						lastTrace = null;
						save();
						renderApp();
						return;
					}
					// The dashboard's attention list jumps straight into the thread.
					if (t.dataset.contact) {
						state.selectedCustomerId = t.dataset.contact;
						save();
						renderApp();
						return;
					}
					if (t.dataset.contactBack) {
						state.selectedCustomerId = null;
						save();
						renderApp();
						return;
					}
					if (t.dataset.inboxFilter) {
						state.inboxFilter = t.dataset.inboxFilter;
						save();
						renderApp();
						return;
					}
					if (t.dataset.openConv) {
						const conv = conversationById(t.dataset.openConv);
						if (conv) state.regionId = conv.regionId;
						state.selectedConversationId = t.dataset.openConv;
						state.view = "inbox";
						lastTrace = null;
						save();
						renderApp();
						return;
					}
					// Setup: the guards have already decided whether the button is
					// there at all, but they are asked again here. A screen that
					// only hides a button is not an access rule.
					if (t.dataset.demote || t.dataset.suspend) {
						const targetId = t.dataset.demote || t.dataset.suspend;
						const next = t.dataset.demote
							? { role: "agent" }
							: { status: "suspended" };
						const check = ENGINE.checkUserChange({
							actingUserId: "usr_hakkeem",
							targetUserId: targetId,
							activeAdminIds: state.staff
								.filter((u) => u.role === "master_admin" && u.status === "active")
								.map((u) => u.id),
							next,
						});
						if (!check.ok) {
							toast(check.message);
							return;
						}
						const person = state.staff.find((u) => u.id === targetId);
						if (person) Object.assign(person, next);
						save();
						renderApp();
						toast(
							`${person ? person.displayName : "That person"} is now ${
								t.dataset.demote ? "an agent" : "suspended"
							}.`,
						);
						return;
					}
					if (t.dataset.sample) {
						const box = document.getElementById("simBox");
						if (box) {
							box.value = t.dataset.sample;
							box.focus();
						}
						return;
					}
					if (t.dataset.lead && t.dataset.stage) {
						advanceLead(t.dataset.lead, t.dataset.stage);
						return;
					}
					if (t.dataset.quote) {
						quoteLead(t.dataset.quote);
						return;
					}
					if (t.dataset.quotemove && t.dataset.status) {
						moveQuotation(t.dataset.quotemove, t.dataset.status);
						return;
					}
					if (t.dataset.ticket && t.dataset.action) {
						ticketAction(t.dataset.ticket, t.dataset.action);
						return;
					}
					if (t.dataset.booking && t.dataset.milestone) {
						advanceMilestone(t.dataset.booking, t.dataset.milestone);
						return;
					}
					if (t.dataset.logcall) {
						state.view = "calls";
						save();
						renderApp();
						return;
					}
				}

				const id = event.target.id;

				if (id === "simBtn") {
					const box = document.getElementById("simBox");
					const text = (box.value || "").trim();
					if (!text) {
						toast("Type a message first.");
						return;
					}
					const picker = document.getElementById("simCustomer");
					const conv = conversationById(state.selectedConversationId);
					const customerId = picker
						? picker.value
						: conv
							? conv.customerId
							: null;
					if (!customerId) {
						toast("There is no customer on file for this number.");
						return;
					}
					lastTrace = receiveInbound(customerId, text);
					state.selectedConversationId = lastTrace.conversationId;
					renderApp();
					return;
				}

				if (id === "replyBtn") {
					const box = document.getElementById("replyBox");
					const text = (box.value || "").trim();
					if (!text) {
						toast("Type a reply first.");
						return;
					}
					agentReply(state.selectedConversationId, text);
					return;
				}

				if (id === "templateBtn") {
					const sel = document.getElementById("templateSelect");
					sendTemplate(state.selectedConversationId, sel.value);
					return;
				}

				if (id === "callBtn") {
					const customerId = document.getElementById("callCustomer").value;
					const direction = document.getElementById("callDirection").value;
					const seconds = Number(document.getElementById("callSeconds").value || 0);
					const outcome = document.getElementById("callOutcome").value.trim();
					if (!customerId) {
						toast("Choose a customer.");
						return;
					}
					logCall(customerId, direction, seconds, outcome || "No note");
					return;
				}

				if (id === "presenceBtn") {
					state.presence[state.regionId] = !state.presence[state.regionId];
					save();
					renderApp();
					toast(
						state.presence[state.regionId]
							? `${currentRegion().label} agents are now online.`
							: `${currentRegion().label} agents are now offline — a new message will get the automated reply.`,
					);
					return;
				}

				if (id === "clockBtn") {
					if (clockOffsetMs !== 0) {
						clockOffsetMs = 0;
						toast("Back to real time.");
					} else {
						clockOffsetMs = offsetToClosed(currentRegion());
						toast(
							`Clock moved to a time when ${currentRegion().label} is closed. Send a message now.`,
						);
					}
					renderApp();
					return;
				}

				if (id === "botRun") {
					const box = document.getElementById("botScript");
					state.botScript = box ? box.value : null;
					save();
					renderApp();
					return;
				}

				if (id === "botReset") {
					state.botScript = null;
					save();
					renderApp();
					return;
				}

				if (id === "bcResolve") {
					// Resolving writes down exactly who will be messaged, and any
					// approval given before it is void: the approval was of a
					// particular list of people.
					state.broadcastResolvedAt = nowIso();
					state.broadcastApprovedBy = null;
					if (state.broadcastStatus === "approved") {
						state.broadcastStatus = "draft";
					}
					save();
					renderApp();
					toast("Audience resolved. Any approval given before now is void.");
					return;
				}

				if (id === "bcReview" || id === "bcApproveSelf" || id === "bcApproveOther") {
					const wanted = id === "bcReview" ? "review" : "approved";
					const step = ENGINE.canTransition(state.broadcastStatus ?? "draft", wanted);
					if (!step.allowed) {
						toast(step.message);
						return;
					}
					if (wanted === "approved") {
						const who = id === "bcApproveSelf" ? "usr_hakkeem" : "usr_mariam";
						const caller = {
							kind: "user",
							id: who,
							email: "x@abccargo.ae",
							displayName: who,
							role: "master_admin",
							status: "active",
							regionIds: [state.regionId],
							teamIds: [],
						};
						const may = ENGINE.canApproveBroadcast(caller, {
							id: "bc_demo",
							regionId: state.regionId,
							status: state.broadcastStatus ?? "draft",
							createdBy: "usr_hakkeem",
							resolvedAt: state.broadcastResolvedAt,
							resolvedCount: state.broadcastResolvedAt ? 1 : null,
							approvedBy: null,
							approvedAt: null,
							startedAt: null,
						});
						if (!may.allowed) {
							toast(may.message);
							return;
						}
						state.broadcastApprovedBy = who;
					}
					state.broadcastStatus = wanted;
					save();
					renderApp();
					return;
				}

				if (id === "bcSend") {
					const may = ENGINE.checkReadyToSend({
						caller: {
							kind: "user",
							id: "usr_hakkeem",
							email: "h@abccargo.ae",
							displayName: "Hakkeem",
							role: "master_admin",
							status: "active",
							regionIds: [state.regionId],
							teamIds: [],
						},
						broadcast: {
							id: "bc_demo",
							regionId: state.regionId,
							status: state.broadcastStatus ?? "draft",
							createdBy: "usr_hakkeem",
							resolvedAt: state.broadcastResolvedAt,
							resolvedCount: state.broadcastResolvedAt ? 1 : null,
							approvedBy: state.broadcastApprovedBy,
							approvedAt: state.broadcastApprovedBy ? nowIso() : null,
							startedAt: null,
						},
						// Off, exactly as it is in the real configuration.
						sendingEnabled: false,
						now: now(),
					});
					toast(may.allowed ? "Would start sending." : may.message);
					return;
				}

				if (id === "bcResetBroadcast") {
					state.broadcastStatus = "draft";
					state.broadcastResolvedAt = null;
					state.broadcastApprovedBy = null;
					save();
					renderApp();
					return;
				}

				if (id === "resetBtn") {
					if (!window.confirm("Clear the demonstration and start again?")) return;
					activityId = 1;
					clockOffsetMs = 0;
					state = seed();
					save();
					renderApp();
					toast("Demonstration reset.");
					return;
				}
			});

			document.addEventListener("change", (event) => {
				const id = event.target.id;
				if (id === "bcKind" || id === "bcDays") {
					if (id === "bcKind") state.broadcastKind = event.target.value;
					else {
						state.broadcastRule = {
							...(state.broadcastRule ?? {}),
							notBookedWithinDays: Number(event.target.value),
						};
					}
					// Changing who is messaged voids an approval, for the same
					// reason the platform does it: otherwise the thing a second
					// person read is not the thing that goes out.
					state.broadcastResolvedAt = null;
					state.broadcastApprovedBy = null;
					if (state.broadcastStatus !== "draft") state.broadcastStatus = "draft";
					save();
					renderApp();
				}
			});

			document.addEventListener("keydown", (event) => {
				if (event.key !== "Enter" || event.shiftKey) return;
				if (event.target.id === "simBox") {
					event.preventDefault();
					document.getElementById("simBtn").click();
				} else if (event.target.id === "replyBox" && (event.metaKey || event.ctrlKey)) {
					event.preventDefault();
					document.getElementById("replyBtn").click();
				}
			});

			/**
			 * Finds an offset that puts the clock outside a region's working
			 * hours, by stepping forward an hour at a time. Honest because it
			 * asks the platform's own `isWithinBusinessHours` whether it has
			 * arrived, rather than assuming where the edge is.
			 */
			function offsetToClosed(region) {
				const start = Date.now();
				for (let h = 1; h <= 24 * 8; h++) {
					const candidate = h * 3_600_000;
					if (!isWithinBusinessHours(region, new Date(start + candidate))) {
						return candidate;
					}
				}
				return 0;
			}

			/* --------------------------------------------------------------- boot */

			state = load() || seed();
			if (state.activities.length) {
				activityId =
					Math.max(...state.activities.map((a) => Number(a.id) || 0)) + 1;
			}
			renderApp();

			// The service clocks are the point, so they have to actually tick.
			window.setInterval(() => {
				// The dashboard is included: its office countdowns and waiting times
				// are the whole point of it, and a frozen clock on a screen that
				// says "closes in 54 minutes" is worse than no clock.
				if (
					state.view === "dashboard" ||
					state.view === "inbox" ||
					state.view === "tickets" ||
					state.view === "overview" ||
					state.view === "bookings"
				) {
					renderApp();
				} else {
					renderTopbar();
				}
			}, 30_000);
		</script>
	</body>
</html>

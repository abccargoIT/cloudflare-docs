			/* ------------------------------------------- view: reports (wireframe 1e) */

			/*
			 * The supervisor dashboard from wireframe 1e. Its note says the
			 * supervisor is the only role that sees across all three regions, so
			 * this screen deliberately ignores the region switcher.
			 *
			 * Two figures the wireframe shows are missing on purpose: CSAT and bot
			 * deflection. Nothing in the platform measures either yet — CSAT needs
			 * a survey after resolution, deflection needs a definition of "resolved
			 * by the bot alone". A plausible number nobody can trace is worse on a
			 * management screen than an honest gap.
			 */
			/* ================================================================
			 * Charts
			 *
			 * Hand-built inline SVG, single series per plot. That is not a
			 * limitation worked around — it is the point. Red, white and black
			 * has one accent hue, so a chart that told three regions apart by
			 * colour would need three, and generating two more would be
			 * inventing brand colours. Three regions therefore become three
			 * small panels with one hue each (small multiples), which is the
			 * standard answer and happens to be easier to read than a
			 * three-colour grouped chart would have been.
			 *
			 * A single series needs no legend: the panel heading names what is
			 * plotted. Values are labelled selectively — the peak only — and
			 * every number is also in the table underneath, so nothing is
			 * reachable by hover alone.
			 * ================================================================ */

			/** Fixed mark specs, so every chart on the screen matches. */
			const CHART = {
				barMax: 24,
				barGap: 2,
				radius: 4,
				padTop: 16,
				padBottom: 18,
				padLeft: 30,
			};

			/**
			 * A single-series column chart.
			 *
			 * Bars grow from one baseline, are capped at 24px wide however much
			 * room there is, carry a 4px rounded top and a square foot, and are
			 * separated by 2px of surface rather than by a stroke. Gridlines are
			 * hairline and recessive. Each bar carries a <title> so hovering
			 * gives the exact value, and an aria-label so a screen reader gets
			 * the series without the geometry.
			 */
			function columnChart(points, opts) {
				const o = Object.assign(
					{ width: 320, height: 132, unit: "", labelEvery: 1, forcedMax: 0 },
					opts || {},
				);
				// A shared scale when the caller supplies one (small multiples),
				// otherwise this panel's own. Honouring forcedMax is what keeps
				// the panels comparable; ignoring it was a bug here once.
				const max =
					o.forcedMax && o.forcedMax > 0
						? o.forcedMax
						: ENGINE.niceMax(points.map((p) => p.value));
				const plotW = o.width - CHART.padLeft - 6;
				const plotH = o.height - CHART.padTop - CHART.padBottom;
				const band = points.length ? plotW / points.length : plotW;
				const barW = Math.min(CHART.barMax, Math.max(3, band - CHART.barGap));
				const baseY = CHART.padTop + plotH;

				// Two gridlines only: the top of the scale and the midpoint. More
				// would out-ink the data.
				const grid = [0, 0.5, 1]
					.map((f) => {
						const y = CHART.padTop + plotH * (1 - f);
						return `<line x1="${CHART.padLeft}" y1="${y.toFixed(1)}" x2="${o.width - 6}" y2="${y.toFixed(1)}"
							stroke="var(--rule-soft)" stroke-width="1" />`;
					})
					.join("");

				const ticks = [0, max]
					.map((v, i) => {
						const y = i === 0 ? baseY : CHART.padTop;
						return `<text x="${CHART.padLeft - 6}" y="${y + 3}" text-anchor="end"
							font-size="9" fill="var(--ink-3)" font-family="var(--mono)">${v}</text>`;
					})
					.join("");

				const peak = points.reduce(
					(best, p, i) => (p.value > (points[best]?.value ?? -1) ? i : best),
					0,
				);

				const bars = points
					.map((p, i) => {
						const h = max > 0 ? (p.value / max) * plotH : 0;
						const x = CHART.padLeft + band * i + (band - barW) / 2;
						const y = baseY - h;
						const r = Math.min(CHART.radius, h);
						// Rounded at the data end, square at the baseline.
						const d =
							h <= 0
								? ""
								: `M ${x} ${baseY} L ${x} ${y + r} Q ${x} ${y} ${x + r} ${y}
							   L ${x + barW - r} ${y} Q ${x + barW} ${y} ${x + barW} ${y + r}
							   L ${x + barW} ${baseY} Z`;
						const label =
							i === peak && p.value > 0
								? `<text x="${x + barW / 2}" y="${y - 4}" text-anchor="middle"
										font-size="9.5" fill="var(--ink-2)" font-family="var(--mono)">${p.value}${esc(o.unit)}</text>`
								: "";
						const tick =
							i % o.labelEvery === 0
								? `<text x="${x + barW / 2}" y="${baseY + 12}" text-anchor="middle"
										font-size="9" fill="var(--ink-3)">${esc(p.label)}</text>`
								: "";
						return `<g><title>${esc(p.label)}: ${p.value}${esc(o.unit)}</title>
							${d ? `<path d="${d}" fill="var(--brand)" />` : ""}
							<rect x="${x}" y="${CHART.padTop}" width="${barW}" height="${plotH}" fill="transparent" />
							${label}${tick}</g>`;
					})
					.join("");

				const total = points.reduce((n, p) => n + p.value, 0);
				return `<svg viewBox="0 0 ${o.width} ${o.height}" width="100%" height="${o.height}"
					role="img" aria-label="${esc(o.aria || "Column chart")}. ${points.length} values, total ${total}, peak ${points[peak]?.value ?? 0}."
					style="display:block;overflow:visible">
					${grid}${ticks}
					<line x1="${CHART.padLeft}" y1="${baseY}" x2="${o.width - 6}" y2="${baseY}"
						stroke="var(--rule)" stroke-width="1" />
					${bars}
				</svg>`;
			}

			/**
			 * One panel per region, each a single-series chart on the same
			 * scale.
			 *
			 * The shared scale is what makes the comparison honest: panels drawn
			 * to their own maxima look identical however different the volumes
			 * are, which is the classic small-multiples mistake.
			 */
			function smallMultiples(series, opts) {
				const everyValue = series.flatMap((s) => s.points.map((p) => p.value));
				const shared = ENGINE.niceMax(everyValue);
				return `<div class="grid3" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
					${series
						.map((s) => {
							const region = REGIONS.find((r) => r.id === s.name);
							const label = region ? region.label : s.name;
							const total = s.points.reduce((n, p) => n + p.value, 0);
							return `<figure style="margin:0">
								<figcaption style="font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:4px">
									<span class="dot dot-${esc(s.name)}" style="width:8px;height:8px;border-radius:50%;display:inline-block"></span>
									${esc(label)}
									<span class="mono muted" style="font-weight:400">${total} total</span>
								</figcaption>
								${columnChart(
									s.points,
									Object.assign({}, opts, {
										forcedMax: shared,
										aria: `${label} ${opts && opts.aria ? opts.aria : "volume"}`,
									}),
								)}
							</figure>`;
						})
						.join("")}
				</div>`;
			}

			/**
			 * Builds and downloads one report as CSV.
			 *
			 * The rows are assembled here from the demonstration's own state and
			 * then handed to ENGINE.toCsv, which owns the escaping — including
			 * the apostrophe prefix that stops a field like `=HYPERLINK(...)`
			 * running as a formula when the file is opened. The screen does not
			 * get to decide how a field is escaped.
			 */
			function exportReport(reportId) {
				const def = ENGINE.findReport(reportId);
				if (!def) {
					toast("Unknown report.");
					return;
				}

				// Reports are a supervisor view. The platform decides, not the
				// button's presence — a disabled-looking button is not a control.
				const allowed = ENGINE.canViewReports(currentCaller());
				if (!allowed.allowed) {
					toast("Reports are limited to team leads and administrators.");
					return;
				}

				const rows = reportRows(def);
				if (rows.length === 0) {
					toast("That report has no rows for this window.");
					return;
				}

				const csv = ENGINE.toCsv(def, rows);
				const window14 = reportWindow();
				const name = ENGINE.exportFilename(def, window14);

				try {
					const blob = new Blob([csv], {
						type: "text/csv;charset=utf-8",
					});
					const url = URL.createObjectURL(blob);
					const a = document.createElement("a");
					a.href = url;
					a.download = name;
					document.body.appendChild(a);
					a.click();
					a.remove();
					// Revoked on a timer rather than immediately: some browsers
					// have not finished reading the blob when click() returns.
					setTimeout(() => URL.revokeObjectURL(url), 10000);
					toast(`${rows.length} rows exported as ${name}`);
				} catch {
					toast("This browser would not accept the download.");
				}
			}

			/** The window the library reports cover. */
			function reportWindow() {
				const to = now();
				const from = new Date(to.getTime() - 13 * 86400000);
				return { from: from.toISOString(), to: to.toISOString() };
			}

			/**
			 * The rows behind each report, from the same state the charts use.
			 *
			 * Kept in one place so the CSV and the chart cannot drift apart: the
			 * chart for `volume_by_day` is drawn from exactly these rows.
			 */
			function reportRows(def) {
				switch (def.id) {
					case "volume_by_day":
						return state.dailyVolume.map((r) => ({
							day: r.day,
							regionId: regionLabel(r.regionId),
							conversations: r.conversations,
						}));

					case "first_response":
						return REGIONS.map((r) => {
							const mine = state.conversations.filter(
								(c) => c.regionId === r.id,
							);
							const answered = mine.filter((c) => c.firstResponseAt);
							const late = answered.filter(
								(c) =>
									c.firstResponseDueAt &&
									Date.parse(c.firstResponseAt) >
										Date.parse(c.firstResponseDueAt),
							);
							return {
								regionId: r.label,
								answered: answered.length,
								withinTarget: answered.length - late.length,
								late: late.length,
								unanswered: mine.length - answered.length,
							};
						});

					case "tickets_by_type":
						return ENGINE.TICKET_TYPES.map((type) => {
							const mine = state.tickets.filter((t) => t.type === type);
							return {
								type: titleCase(type),
								opened: mine.length,
								resolved: mine.filter(
									(t) => t.status === "resolved" || t.status === "closed",
								).length,
								overdue: mine.filter(
									(t) =>
										t.status !== "resolved" &&
										t.status !== "closed" &&
										t.resolutionDueAt &&
										isBreached(t.resolutionDueAt, now()),
								).length,
							};
						});

					case "csat_distribution": {
						const summary = ENGINE.summarise(
							state.csat.responses,
							Object.values(state.csat.sent).reduce((n, v) => n + v, 0),
						);
						return ENGINE.csatDistributionRows(summary.distribution);
					}

					default:
						return [];
				}
			}

			/** A region's label, falling back to its id rather than to blank. */
			function regionLabel(regionId) {
				const r = REGIONS.find((x) => x.id === regionId);
				return r ? r.label : regionId;
			}

			function viewReports() {
				const convs = state.conversations;
				const atRisk = convs.filter(
					(c) => !c.firstResponseAt && c.firstResponseDueAt,
				);
				const breached = atRisk.filter((c) =>
					isBreached(c.firstResponseDueAt, now()),
				);

				const byRegion = REGIONS.map((r) => {
					const mine = convs.filter((c) => c.regionId === r.id);
					return {
						region: r,
						total: mine.length,
						whatsapp: mine.filter((c) => channelOf(c) === "whatsapp").length,
						email: mine.filter((c) => channelOf(c) === "email").length,
						call: mine.filter((c) => channelOf(c) === "call").length,
						waiting: mine.filter((c) => isUnanswered(c)).length,
					};
				});
				const max = Math.max(1, ...byRegion.map((b) => b.total));

				// First response, measured rather than asserted: the gap between the
				// customer's first message and ours, for the conversations that have
				// had one.
				const answered = convs.filter((c) => c.firstResponseAt);
				const avgFirst =
					answered.length === 0
						? null
						: Math.round(
								answered.reduce(
									(n, c) =>
										n +
										(Date.parse(c.firstResponseAt) -
											Date.parse(c.lastInboundAt)),
									0,
								) /
									answered.length /
									60000,
							);

				// Satisfaction and deflection, both measured rather than asserted.
				// Each refuses to publish a figure below its own minimum sample, and
				// the screen prints the reason instead of a number.
				const csatAll = ENGINE.summarise(
					state.csat.responses,
					Object.values(state.csat.sent).reduce((n, v) => n + v, 0),
				);
				const csatByRegion = ENGINE.summariseByRegion(
					state.csat.responses,
					state.csat.sent,
				);
				const deflection = ENGINE.summariseDeflection(state.botSessions);
				const deflectionByFlow = ENGINE.summariseByFlow(state.botSessions);
				const hotspots = ENGINE.abandonmentHotspots(state.botSessions);
				const pct = (v) => `${Math.round(v * 100)}%`;
				const volumeSeries = ENGINE.toSeries(
					state.dailyVolume,
					"day",
					"conversations",
					"regionId",
				);

				return `<div style="display:grid;gap:14px">
					<section class="card">
						<h2>Team performance <small>all regions</small></h2>
						<p class="muted" style="margin:2px 0 0">
							The supervisor is the only role that sees across all three
							regions, so this screen ignores the region switcher.
						</p>
					</section>

					<div class="stats">
						<div class="stat"><div class="n">${convs.length}</div><div class="l">Conversations</div><div class="h">all channels</div></div>
						<div class="stat"><div class="n">${avgFirst === null ? "—" : esc(ENGINE.describeMinutes(Math.abs(avgFirst)))}</div><div class="l">Avg first response</div><div class="h">target ${CONVERSATION_FIRST_RESPONSE_MINUTES}m</div></div>
						<div class="stat"><div class="n">${breached.length}</div><div class="l">SLA breaches</div><div class="h">${atRisk.length} still at risk</div></div>
						<div class="stat">
							<div class="n">${deflection.reportable && deflection.deflectionRate !== null ? esc(pct(deflection.deflectionRate)) : "—"}</div>
							<div class="l">Bot deflection</div>
							<div class="h">${deflection.reportable ? `of ${deflection.resolved} ended sessions` : esc(deflection.note)}</div>
						</div>
						<div class="stat">
							<div class="n">${csatAll.reportable && csatAll.mean !== null ? esc(csatAll.mean.toFixed(1)) : "—"}</div>
							<div class="l">CSAT</div>
							<div class="h">${csatAll.reportable ? `${csatAll.responses} of ${csatAll.sent} answered` : esc(csatAll.note)}</div>
						</div>
					<section class="card">
						<h2>Bot deflection <small>${deflection.resolved} ended sessions</small></h2>
						<p class="muted" style="margin:2px 0 10px">
							A session counts as deflected when the flow finished and no
							human sent a message. A handover, a request for an agent and a
							flow that got stuck all count as escalated — a bot failing is
							not a bot deflecting.
						</p>
						<div class="tablewrap"><table>
							<thead><tr><th>Outcome</th><th>Sessions</th><th>Share</th><th>Reading</th></tr></thead>
							<tbody>
								<tr>
									<td>Deflected</td>
									<td class="mono">${deflection.deflected}</td>
									<td class="mono">${deflection.deflectionRate === null ? "—" : esc(pct(deflection.deflectionRate))}</td>
									<td class="muted" style="font-size:12px">Bot answered, nobody needed</td>
								</tr>
								<tr>
									<td>Escalated</td>
									<td class="mono">${deflection.escalated}</td>
									<td class="mono">${deflection.resolved ? esc(pct(deflection.escalated / deflection.resolved)) : "—"}</td>
									<td class="muted" style="font-size:12px">A person finished it, or the bot failed</td>
								</tr>
								<tr>
									<td>Abandoned</td>
									<td class="mono">${deflection.abandoned}</td>
									<td class="mono">${deflection.abandonmentRate === null ? "—" : esc(pct(deflection.abandonmentRate))}</td>
									<td class="muted" style="font-size:12px">Customer went quiet. Nobody can say whether they were helped</td>
								</tr>
								<tr>
									<td class="muted">Still running</td>
									<td class="mono muted">${deflection.inProgress}</td>
									<td class="muted">—</td>
									<td class="muted" style="font-size:12px">Counted nowhere until they end</td>
								</tr>
							</tbody>
						</table></div>
						<p class="muted" style="font-size:12px;margin-top:10px">
							<strong>The headline figure counts abandonment in the
							denominator.</strong> Excluding it gives
							<strong class="mono">${deflection.rateExcludingAbandoned === null ? "—" : esc(pct(deflection.rateExcludingAbandoned))}</strong>,
							which is the same data read more kindly. Both are shown so that
							neither can be quoted without the other.
						</p>
					</section>

					<section class="card">
						<h2>Conversation volume <small>last 14 days, demonstration data</small></h2>
						<p class="muted" style="margin:2px 0 12px">
							One panel per number, all three on the same scale — panels drawn
							to their own maxima look identical however different the volumes
							are, which is the usual way a small-multiples chart misleads.
						</p>
						${smallMultiples(volumeSeries, { height: 132, labelEvery: 3, aria: "daily conversation volume" })}
						<details style="margin-top:10px">
							<summary class="muted" style="font-size:12px">Table view</summary>
							<div class="tablewrap" style="margin-top:8px"><table>
								<thead><tr><th>Day</th>${REGIONS.map((r) => `<th>${esc(r.label)}</th>`).join("")}</tr></thead>
								<tbody>${(volumeSeries[0] ? volumeSeries[0].points : [])
									.map(
										(p, i) =>
											`<tr><td class="mono">${esc(p.label)}</td>${volumeSeries
												.map(
													(s) =>
														`<td class="mono">${s.points[i] ? s.points[i].value : 0}</td>`,
												)
												.join("")}</tr>`,
									)
									.join("")}</tbody>
							</table></div>
						</details>
					</section>

					<section class="card">
						<h2>Report library</h2>
						<p class="muted" style="margin:2px 0 12px">
							Each report is a definition — what it counts, how it groups, which
							columns it exports — so the chart and the CSV are built from the
							same rows and cannot disagree about what the report contains.
						</p>
						<div class="tablewrap"><table>
							<thead><tr><th>Report</th><th>Groups by</th><th>Chart</th><th>Export</th></tr></thead>
							<tbody>
								${ENGINE.REPORT_LIBRARY.map(
									(def) => `<tr>
									<td><strong>${esc(def.title)}</strong>
										<div class="muted" style="font-size:11.5px">${esc(def.description)}</div></td>
									<td class="mono">${esc(def.group.replace(/_/g, " "))}</td>
									<td class="muted" style="font-size:12px">${def.chart === "none" ? "table only" : esc(def.chart.replace(/_/g, " "))}</td>
									<td><button type="button" class="ghost" data-export="${esc(def.id)}">CSV</button></td>
								</tr>`,
								).join("")}
							</tbody>
						</table></div>
						<p class="muted" style="font-size:12px;margin-top:10px">
							The export writes CRLF endings and a UTF-8 BOM so Excel does not
							turn an Arabic customer name into mojibake, and it prefixes any
							field starting <span class="mono">=</span>, <span class="mono">+</span>,
							<span class="mono">-</span> or <span class="mono">@</span> with an
							apostrophe. Without that last step a customer called
							<span class="mono">=HYPERLINK(…)</span> runs as a formula when the
							file is opened, and a cargo reference starting with a dash is a
							perfectly ordinary thing to have. Supervisors only, per the same
							rule that gates this screen.
						</p>
					</section>

					<section class="card">
						<h2>Satisfaction distribution <small>all regions</small></h2>
						<p class="muted" style="margin:2px 0 12px">
							The spread, not just the mean. A 4.4 made of fives and ones is not
							a 4.4, and the mean alone hides that completely.
						</p>
						${columnChart(
							ENGINE.csatDistributionRows(csatAll.distribution).map((r) => ({
								label: r.score,
								value: r.responses,
							})),
							{ height: 150, aria: "satisfaction score distribution, 1 to 5" },
						)}
						<p class="muted" style="font-size:12px;margin-top:6px">
							${csatAll.responses} response${csatAll.responses === 1 ? "" : "s"} of
							${csatAll.sent} sent. All five scores are shown even where nobody
							gave one — a missing 2 reads as though 2 were impossible.
						</p>
					</section>

					<div class="grid2">
						<section class="card">
							<h2>Deflection by flow</h2>
							<p class="muted" style="margin:2px 0 10px">
								An overall rate says the bot is doing well or badly. It never
								says which flow to fix.
							</p>
							<div class="tablewrap"><table>
								<thead><tr><th>Flow</th><th>Ended</th><th>Deflected</th><th>Rate</th></tr></thead>
								<tbody>
									${Object.entries(deflectionByFlow)
										.sort((a, b) => b[1].resolved - a[1].resolved)
										.map(
											([flowId, summary]) => `<tr>
										<td class="mono">${esc(flowId)}</td>
										<td class="mono">${summary.resolved}</td>
										<td class="mono">${summary.deflected}</td>
										<td class="mono">${
											summary.reportable && summary.deflectionRate !== null
												? esc(pct(summary.deflectionRate))
												: `<span class="muted" title="${esc(summary.note ?? "")}">—</span>`
										}</td>
									</tr>`,
										)
										.join("")}
								</tbody>
							</table></div>
							<p class="muted" style="font-size:12px;margin-top:10px">
								Each flow is held to the same minimum sample on its own. A
								healthy total does not license publishing a rate for a flow
								that has barely run.
							</p>
						</section>

						<section class="card">
							<h2>Where customers stop replying</h2>
							<p class="muted" style="margin:2px 0 10px">
								Abandonment cannot be interpreted in aggregate. Per step it
								can: if the same question loses everybody, the question is the
								problem.
							</p>
							${
								hotspots.length
									? `<div class="tablewrap"><table>
										<thead><tr><th>Step</th><th>Abandoned at</th></tr></thead>
										<tbody>${hotspots
											.map(
												(h) =>
													`<tr><td class="mono">${esc(h.stepId)}</td><td class="mono">${h.count}</td></tr>`,
											)
											.join("")}</tbody>
									</table></div>`
									: `<p class="muted">No abandoned sessions recorded a step.</p>`
							}
						</section>
					</div>

					<section class="card">
						<h2>Customer satisfaction</h2>
						<p class="muted" style="margin:2px 0 10px">
							Asked once per conversation, at most once a month per customer,
							never when the customer has opted out. Eligibility turns on the
							channel, consent and survey fatigue — never on how the
							conversation went, because a score you can shape by choosing who
							to ask is worse than no score.
						</p>
						<div class="tablewrap"><table>
							<thead><tr><th>Region</th><th>Sent</th><th>Answered</th><th>Response rate</th><th>Score</th></tr></thead>
							<tbody>
								${REGIONS.map((r) => {
									const c = csatByRegion[r.id] ?? ENGINE.summarise([], 0);
									return `<tr>
										<td><span class="dot dot-${esc(r.id)}"></span>${esc(r.label)}</td>
										<td class="mono">${c.sent}</td>
										<td class="mono">${c.responses}</td>
										<td class="mono">${c.responseRate === null ? "—" : esc(pct(c.responseRate))}</td>
										<td class="mono">${
											c.reportable && c.mean !== null
												? esc(c.mean.toFixed(1)) + " / 5"
												: `<span class="muted" title="${esc(c.note ?? "")}">${esc(c.note ?? "—")}</span>`
										}</td>
									</tr>`;
								}).join("")}
							</tbody>
						</table></div>
						<p class="muted" style="font-size:12px;margin-top:10px">
							<strong>KSA shows a sentence instead of a score on purpose.</strong>
							Three replies is three opinions, not a satisfaction figure, and
							each region has to clear the minimum on its own — a healthy group
							sample is exactly how a thin regional one gets laundered into a
							headline.
						</p>
					</section>

					</div>

					<div class="grid2">
						<section class="card">
							<h2>Volume by region and channel</h2>
							<div class="tablewrap"><table>
								<thead><tr><th>Region</th><th>WhatsApp</th><th>Email</th><th>Calls</th><th>Total</th><th></th></tr></thead>
								<tbody>${byRegion
									.map(
										(b) => `<tr>
										<td><span class="dot dot-${esc(b.region.id)}" style="display:inline-block;margin-right:6px"></span>${esc(b.region.label)}</td>
										<td>${b.whatsapp}</td><td>${b.email}</td><td>${b.call}</td><td><strong>${b.total}</strong></td>
										<td style="width:34%"><span style="display:block;height:8px;border-radius:999px;background:var(--brand);width:${Math.round((b.total / max) * 100)}%"></span></td>
									</tr>`,
									)
									.join("")}</tbody>
							</table></div>
						</section>

						<section class="card">
							<h2>Live queue</h2>
							<div class="tablewrap"><table>
								<thead><tr><th>Region</th><th>Waiting on us</th><th>Unassigned</th></tr></thead>
								<tbody>${byRegion
									.map(
										(b) => `<tr>
										<td>${esc(b.region.label)}</td>
										<td>${b.waiting}</td>
										<td>${convs.filter((c) => c.regionId === b.region.id && !c.assignedAgentId).length}</td>
									</tr>`,
									)
									.join("")}</tbody>
							</table></div>
							<p class="muted" style="font-size:12px;margin-top:10px">
								The wireframe has a "Rebalance agents" action here. It is not
								built: moving work between agents needs a rule for who gets
								what, and that is a decision rather than a button.
							</p>
						</section>
					</div>
				</div>`;
			}

			/* --------------------------------------------- view: deals (wireframe 1d) */

			/*
			 * The pipeline from wireframe 1d. Its note is that each card shows the
			 * channel it came from, "so pipeline and inbox stay one system" — which
			 * is the only reason the channel is on the card at all.
			 */
			/*
			 * The wireframe draws five columns. The platform has six stages: it
			 * keeps "qualified" separate from "quoted", because a lead somebody
			 * has spoken to is not the same as one that has had a price put to
			 * it, and folding them hides the step where most deals stall.
			 *
			 * So the vocabulary is the wireframe's and the column count is the
			 * platform's, which is a difference worth seeing rather than hiding.
			 */
			const DEAL_COLUMNS = [
				["new", "New enquiry"],
				["qualified", "Qualified"],
				["quoted", "Quoted"],
				["negotiating", "Negotiation"],
				["won", "Won"],
				["lost", "Lost"],
			];

			function viewDeals() {
				const mine = state.leads.filter((l) => l.regionId === state.regionId);
				const columns = DEAL_COLUMNS.map(([stage, label]) => {
					const cards = mine.filter((l) => l.stage === stage);
					const value = cards.reduce((n, l) => n + (l.estValue || 0), 0);
					return `<section class="card">
						<h2>${esc(label)} <small>${cards.length}${value ? ` · ${esc(String(value))}` : ""}</small></h2>
						${
							cards.length === 0
								? `<p class="muted" style="font-size:12px">—</p>`
								: cards
										.map((l) => {
											const customer = customerById(l.customerId);
											const conv = state.conversations.find(
												(c) => c.customerId === l.customerId,
											);
											return `<div style="padding:8px 0;border-top:1px solid var(--rule-soft)">
										<div>${esc(l.origin || "")} → ${esc(l.destination || "")}</div>
										<div class="muted" style="font-size:11.5px">${esc(customer ? customer.displayName : "")}</div>
										<div style="margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
											<span class="pill">${esc(CHANNEL_LABELS[conv ? channelOf(conv) : "whatsapp"])}</span>
											<span class="mono muted" style="font-size:11.5px">${esc(l.ref)}</span>
											${l.estValue ? `<span class="mono" style="font-size:11.5px">${esc(l.currency || "")} ${esc(String(l.estValue))}</span>` : ""}
										</div>
									</div>`;
										})
										.join("")
						}
					</section>`;

			/* ----------------------------------------------------- view: contacts */

			/*
			 * Contact 360 from wireframe 1c. Its note — "record ownership is
			 * region-stamped, which is what enforces the agents-cannot-see-other-
			 * agents-customers rule" — is the reason the region is stated on the
			 * record rather than implied by which list it was opened from.
			 */
			function contact360(customer) {
				const life = lifecycleOf(customer);
				const convs = state.conversations.filter(
					(c) => c.customerId === customer.id,
				);
				const tickets = state.tickets.filter(
					(t) => t.customerId === customer.id,
				);
				const deals = state.leads.filter((l) => l.customerId === customer.id);
				const shipments = state.bookings.filter(
					(b) => b.customerId === customer.id,
				);
				const calls = state.calls.filter((c) => c.customerId === customer.id);

				const timeline = [
					...convs.flatMap((c) =>
						c.messages.map((m) => [m.at, CHANNEL_LABELS[channelOf(c)], m.text]),
					),
					...deals.map((d) => [
						d.createdAt,
						"Deal",
						`${d.ref} ${d.origin || ""}→${d.destination || ""}`,
					]),
					...shipments.map((b) => [
						b.createdAt,
						"Shipment",
						`${b.ref} ${b.milestone}`,
					]),
					...calls.map((c) => [c.startedAt, "Call", c.outcome || ""]),
				]
					.filter(([at]) => at)
					.sort((a, b) => Date.parse(b[0]) - Date.parse(a[0]))
					.slice(0, 8);

				return `<section class="card">
					<h2>${esc(customer.displayName)} <small>${esc(customer.company || "")}</small></h2>
					<div style="display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px">
						<span class="pill">${esc(regionOf(customer.regionId).label)} only</span>
						<span class="pill">${esc(life.label)}</span>
						<span class="pill">${esc(life.band)} · ${life.temperature}</span>
					</div>
					<div class="stats" style="grid-template-columns:repeat(4,1fr)">
						<div class="stat"><div class="n">${convs.length}</div><div class="l">Conversations</div></div>
						<div class="stat"><div class="n">${tickets.filter((t) => t.status === "open" || t.status === "pending").length}</div><div class="l">Open tickets</div></div>
						<div class="stat"><div class="n">${deals.filter((d) => isLeadOpen(d.stage)).length}</div><div class="l">Open deals</div></div>
						<div class="stat"><div class="n">${shipments.length}</div><div class="l">Shipments</div></div>
					</div>
					<h2 style="margin-top:14px">Timeline — all channels</h2>
					${
						timeline.length === 0
							? `<p class="muted" style="font-size:12px">Nothing recorded yet.</p>`
							: timeline
									.map(
										([
											at,
											kind,
											text,
										]) => `<div style="padding:6px 0;border-top:1px solid var(--rule-soft);display:flex;gap:10px">
							<span class="pill" style="min-width:86px">${esc(kind)}</span>
							<span style="flex:1">${esc(String(text).slice(0, 110))}</span>
							<span class="mono muted" style="font-size:11.5px">${esc(ago(at))}</span>
						</div>`,
									)
									.join("")
					}
					<p class="muted" style="font-size:12px;margin-top:10px">
						The wireframe also shows the last five consignments read from the
						ERP by API. That integration is an open decision, so nothing is
						shown rather than something invented.
					</p>
				</section>`;
			}

			function viewContacts() {
				const selected = state.selectedCustomerId
					? customerById(state.selectedCustomerId)

				if (selected) {
					return `<div style="display:grid;gap:14px">

					return `<section class="card">
						<h2>${esc(ENGINE.CUSTOMER_STAGE_LABELS[stage])} <span class="muted" style="font-weight:400">${inStage.length}</span></h2>
						${
							inStage.length === 0
								? `<p class="muted" style="font-size:12px">—</p>`
								: inStage
										.map(
											({
												c,
												life,
											}) => `<div data-contact="${esc(c.id)}" role="button" tabindex="0" style="padding:6px 0;border-top:1px solid var(--rule-soft);cursor:pointer">
								<div>${esc(c.displayName)}</div>
								<div class="muted" style="font-size:11.5px">${esc(c.company ?? "")}</div>
								<div class="mono" style="font-size:11.5px;color:var(--ink-3)">${esc(life.band)} · ${life.temperature}</div>
							</div>`,
										)
										.join("")
						}
					</section>`;
				}).join("");

				return `<div style="display:grid;gap:14px">
					<section class="card">
						<h2>Contacts</h2>
						<p class="muted" style="margin:2px 0 0">
							The stage is <strong>derived</strong>, not stored — from each
							customer's leads, quotations and shipments. It cannot go stale,
							and nobody has to remember to move a card.

					</section>
					<div class="grid2" style="grid-template-columns:repeat(4,1fr);align-items:start">${cards}</div>
				</div>`;
			}

			/* -------------------------------------------------------- view: setup */

			/*
			 * Setup, as wireframe 1g draws it. Its second note is the one that
			 * matters: "Number → region → bot → team is the whole routing chain in
			 * one table." That table is the first thing on the screen, because it
			 * is the thing somebody checks before a cutover.
			 */
			function setupChannels() {
				return `<section class="card">
					<h2>WhatsApp Business numbers</h2>
					<div class="tablewrap"><table>
						<thead><tr><th>Number</th><th>Region</th><th>Routes to</th><th>Hours</th><th>Status</th></tr></thead>
						<tbody>${REGIONS.map((r) => {
							const days = r.businessHours.days.length;

								<td class="mono">${esc(r.displayNumber)}</td>

								<td>${esc(r.label)} bot → ${esc(r.label)} Support</td>
								<td class="mono" style="font-size:11.5px">${esc(r.businessHours.start)}–${esc(r.businessHours.end)} · ${days} day${days === 1 ? "" : "s"}<div class="muted">${esc(r.timezone)}</div></td>
								<td><span class="pill pill-closed">Awaiting go-live</span></td>

						}).join("")}</tbody>
					</table></div>
					<p class="muted" style="font-size:12px;margin-top:10px">

						pre-cutover checks. Until then every number here is a placeholder

					</p>
				</section>`;

			/**
			 * Service targets, per team, with the provenance of every row.
			 *
			 * The screen designs set targets on the team; the platform used to set
			 * them per region and per ticket type only. Both now apply, and the
			 * table says which level each figure came from, because a supervisor
			 * looking at a five-minute target will ask why and "inherited from the
			 * region" is a different answer from "this team sets it".
			 */
			function setupSla() {
				const teams = state.teams;
				const policies = state.teamSlaPolicies;
				const regionPolicies = state.regionSlaPolicies;

				const teamBlocks = teams
					.map((team) => {
						const rows = ENGINE.effectivePolicyTable({
							teamId: team.id,
							regionId: team.regionId,
							teamPolicies: policies,
							regionPolicies,
						});
						// Anything the platform refused to apply, collected from the
						// same resolution the table above ran.
						const ignored = [];
						for (const type of ENGINE.TICKET_TYPES) {
							const resolved = ENGINE.resolveTarget(type, "normal", {
								teamIds: [team.id],
								regionId: team.regionId,
								teamPolicies: policies,
								regionPolicies,
							});
							for (const bad of resolved.ignored) {
								if (!ignored.some((i) => i.problem === bad.problem)) {
									ignored.push(bad);
								}
							}
						}

						const body = rows
							.map(
								(row) => `<tr>
							<td>${esc(titleCase(row.type))}</td>
							<td class="mono">${esc(String(row.stated.firstResponseMinutes))}m</td>
							<td class="mono">${esc(String(row.stated.resolutionMinutes))}m</td>
							<td class="${row.inherited ? "muted" : ""}" style="font-size:12px">
								${esc(ENGINE.TARGET_SOURCE_LABELS[row.source])}
							</td>
						</tr>`,
							)
							.join("");

						return `<details ${team.id === "uae-support" ? "open" : ""}>
						<summary><strong>${esc(team.label)}</strong>
							<span class="pill">${esc(team.regionId.toUpperCase())}</span>
							${
								rows.every((r) => r.inherited)
									? `<span class="mono muted" style="font-size:11.5px">all inherited</span>`
									: `<span class="mono" style="font-size:11.5px">${rows.filter((r) => !r.inherited).length} of ${rows.length} set by this team</span>`
							}
						</summary>
						<div class="tablewrap" style="margin-top:8px"><table>
							<thead><tr><th>Ticket type</th><th>First response</th><th>Resolution</th><th>From</th></tr></thead>
							<tbody>${body}</tbody>
						</table></div>
						${
							ignored.length
								? `<p class="muted" style="font-size:12px;margin:8px 0 0;color:var(--bad,#b00)">
									<strong>Ignored:</strong> ${ignored.map((i) => esc(i.problem)).join("; ")}.
									The platform fell through to the next level rather than apply it
									or fail the queue.
								</p>`
								: ""
						}
					</details>`;
					})
					.join("");

				return `<section class="card">
					<h2>Service targets <small>per team</small></h2>
					<div class="tablewrap"><table>
						<thead><tr><th>Applies to</th><th>First response</th><th>Resolution</th></tr></thead>
						<tbody>
							<tr><td>Conversation, any channel</td><td class="mono">${CONVERSATION_FIRST_RESPONSE_MINUTES}m</td><td class="muted">—</td></tr>
						</tbody>
					</table></div>
					<div style="display:grid;gap:6px;margin-top:12px">${teamBlocks}</div>
					<p class="muted" style="font-size:12px;margin-top:12px">
						Counted in <strong>business minutes</strong> on each region's own
						calendar, not wall-clock. The most specific policy wins: the team's
						own entry for the ticket type, then the team's default, then the
						region's, then the platform's. A malformed policy is ignored and
						reported rather than obeyed — open <strong>KSA Night Desk</strong>
						to see one. Priority shortens a target on top of all of this; an
						urgent claim is a quarter of the figure shown.
					</p>
				</section>`;
			}

					<section class="card">
						<h2>People</h2>

							the screen's — a platform nobody can administer is recovered by
							writing SQL against production.
						</p>
						<div class="tablewrap"><table>
							<thead><tr><th>Person</th><th>Role</th><th>Demote</th><th>Suspend</th></tr></thead>
							<tbody>${rows}</tbody>

							Make the other administrator an agent, then try to change yourself.

					</section>
				</div>`;
			}

			/* ------------------------------------------------------ view: overview */

			function viewOverview() {
				const openTickets = state.tickets.filter(
					(t) => t.status === "open" || t.status === "pending",
				);
				const breached = openTickets.filter(
					(t) =>
						(!t.firstResponseAt && isBreached(t.firstResponseDueAt, now())) ||
						isBreached(t.resolutionDueAt, now()),
				);
				const atRisk = openTickets.filter(
					(t) =>
						!breached.includes(t) &&
						((!t.firstResponseAt &&
							remainingMs(t.firstResponseDueAt, now()) < 60 * 60000) ||
							remainingMs(t.resolutionDueAt, now()) < 60 * 60000),
				);
				const openLeads = state.leads.filter((l) => isLeadOpen(l.stage));
				const won = state.leads.filter((l) => l.stage === "won");
				const stalled = state.bookings.filter(
					(b) =>
						!isDelivered(b.milestone) &&
						checkStall(b.milestone, b.milestoneAt, now()).stalled,
				);
				const msgsToday = state.conversations.reduce(
					(n, c) =>
						n +
						c.messages.filter(
							(m) => now().getTime() - Date.parse(m.at) < 24 * 3_600_000,
						).length,
					0,
				);

				const byStage = LEAD_STAGES.map((s) => [
					s,
					state.leads.filter((l) => l.stage === s).length,
				]);
				const maxStage = Math.max(1, ...byStage.map(([, n]) => n));

				return `<div style="display:grid;gap:14px">
					<div class="stats">
						<div class="stat"><div class="n">${openTickets.length}</div><div class="l">Open tickets</div><div class="h">${breached.length} overdue · ${atRisk.length} due within the hour</div></div>
						<div class="stat"><div class="n">${openLeads.length}</div><div class="l">Open leads</div><div class="h">${won.length} won so far</div></div>
						<div class="stat"><div class="n">${state.bookings.filter((b) => !isDelivered(b.milestone)).length}</div><div class="l">Shipments moving</div><div class="h">${stalled.length} not moving as expected</div></div>
						<div class="stat"><div class="n">${msgsToday}</div><div class="l">Messages, last 24h</div><div class="h">across all three numbers</div></div>
					</div>

					<div class="grid2">
						<section class="card">
							<h2>By number</h2>
							<div class="tablewrap">
								<table>
									<thead><tr><th>Number</th><th>State</th><th>Conversations</th><th>Open tickets</th><th>Open leads</th></tr></thead>
									<tbody>${REGIONS.map((r) => {
										const open = isWithinBusinessHours(r, now());
										return `<tr>
											<td><span class="dot dot-${esc(r.id)}" style="display:inline-block;margin-right:6px"></span>${esc(r.label)}<div class="mono muted" style="font-size:11.5px">${esc(r.displayNumber)}</div></td>
											<td><span class="pill ${open ? "pill-open" : "pill-closed"}">${open ? "Open" : "Closed"}</span><div class="muted" style="font-size:11.5px">${esc(r.businessHours.start)}–${esc(r.businessHours.end)} ${esc(r.timezone)}</div></td>
											<td>${state.conversations.filter((c) => c.regionId === r.id).length}</td>
											<td>${state.tickets.filter((t) => t.regionId === r.id && (t.status === "open" || t.status === "pending")).length}</td>
											<td>${state.leads.filter((l) => l.regionId === r.id && isLeadOpen(l.stage)).length}</td>
										</tr>`;
									}).join("")}</tbody>
								</table>
							</div>
						</section>

						<section class="card">
							<h2>Lead pipeline</h2>
							<div class="pad">
								<div class="bars">
									${byStage
										.map(
											([s, n]) => `<div class="bar">
										<span>${esc(s)}</span>
										<span class="track"><span class="fill" style="width:${Math.round((n / maxStage) * 100)}%"></span></span>
										<span class="v">${n}</span>
									</div>`,
										)
										.join("")}
								</div>
							</div>
						</section>
					</div>

					<section class="card">
						<h2>What this demonstration is, and is not</h2>
						<div class="pad" style="display:grid;gap:11px">
							<div class="note">
								<b>It is the real decision logic.</b> Intent recognition in
								English and Arabic, the service-target clocks on each region's
								own calendar, the reference formats, the lead, quotation and
								milestone transitions, and the automated replies are all the
								platform's own compiled code, inlined into this page at build
								time. If a rule changes in the source, this page changes with
								it. Nothing on these screens is a drawing of behaviour.
							</div>
							<div class="note">
								<b>It is not connected to anything.</b> Records live in this
								browser, not in the database, and the page never makes a
								network call. It cannot reach Meta, it cannot reach Freshworks,
								and it cannot send a message to a real customer. Closing the
								tab loses nothing that matters; <b>Reset demo</b> clears it.
							</div>
							<div class="note">
								<b>Three things are still placeholders</b>, and they are
								placeholders because they need ABC Cargo's own answers rather
								than a decision by me: the service targets in the SLA table,
								the business hours per number, and the exact tracking
								reference format. Each is a single edit once the real values
								are available.
							</div>
							<div class="note">
								<b>One artefact worth knowing about.</b> Booking references
								carry a three-letter region code taken from the region id, so
								UAE and KSA read <span class="mono">ABC-UAE-000001</span> and
								<span class="mono">ABC-KSA-000001</span>, but a two-letter id
								like <span class="mono">uk</span> is padded and reads
								<span class="mono">ABC-UKX-000001</span>. Accept the padding or
								change the UK region id before any reference is issued to a
								customer — not after.
							</div>
						</div>
					</section>
				</div>`;
			}

			/* ------------------------------------------------------------- events */

			function toast(message) {
				const el = document.getElementById("toast");
				el.textContent = message;
				el.classList.add("show");
				window.clearTimeout(toast._t);
				toast._t = window.setTimeout(() => el.classList.remove("show"), 2600);
			}

			document.addEventListener("click", (event) => {
				const t = event.target.closest(
					"[data-region],[data-view],[data-conv],[data-sample],[data-lead],[data-quote],[data-quotemove],[data-ticket],[data-booking],[data-logcall],[data-open-conv],[data-demote],[data-suspend],[data-inbox-filter],[data-contact],[data-contact-back],[data-export]",
				);
				if (t) {
					if (t.dataset.region) {
						state.regionId = t.dataset.region;
						state.selectedConversationId = null;
						lastTrace = null;
						save();
						renderApp();
						return;
					}
					if (t.dataset.export) {
						exportReport(t.dataset.export);
						return;
					}
					if (t.dataset.view) {
						state.view = t.dataset.view;
						save();
						renderApp();
						return;
					}
					if (t.dataset.conv) {
						state.selectedConversationId = t.dataset.conv;
						lastTrace = null;
						save();
						renderApp();
						return;
					}
					// The dashboard's attention list jumps straight into the thread.
					if (t.dataset.contact) {
						state.selectedCustomerId = t.dataset.contact;
						save();
						renderApp();
						return;
					}
					if (t.dataset.contactBack) {
						state.selectedCustomerId = null;
						save();
						renderApp();
						return;
					}
					if (t.dataset.inboxFilter) {
						state.inboxFilter = t.dataset.inboxFilter;
						save();
						renderApp();
						return;
					}
					if (t.dataset.openConv) {
						const conv = conversationById(t.dataset.openConv);
						if (conv) state.regionId = conv.regionId;
						state.selectedConversationId = t.dataset.openConv;
						state.view = "inbox";
						lastTrace = null;
						save();
						renderApp();
						return;
					}
					// Setup: the guards have already decided whether the button is
					// there at all, but they are asked again here. A screen that
					// only hides a button is not an access rule.
					if (t.dataset.demote || t.dataset.suspend) {
						const targetId = t.dataset.demote || t.dataset.suspend;
						const next = t.dataset.demote
							? { role: "agent" }
							: { status: "suspended" };
						const check = ENGINE.checkUserChange({
							actingUserId: "usr_hakkeem",
							targetUserId: targetId,
							activeAdminIds: state.staff
								.filter(
									(u) => u.role === "master_admin" && u.status === "active",
								)
								.map((u) => u.id),
							next,
						});
						if (!check.ok) {
							toast(check.message);
							return;
						}
						const person = state.staff.find((u) => u.id === targetId);
						if (person) Object.assign(person, next);
						save();
						renderApp();
						toast(
							`${person ? person.displayName : "That person"} is now ${
								t.dataset.demote ? "an agent" : "suspended"
							}.`,
						);
						return;
					}
					if (t.dataset.sample) {
						const box = document.getElementById("simBox");
						if (box) {
							box.value = t.dataset.sample;
							box.focus();
						}
						return;
					}
					if (t.dataset.lead && t.dataset.stage) {
						advanceLead(t.dataset.lead, t.dataset.stage);
						return;
					}
					if (t.dataset.quote) {
						quoteLead(t.dataset.quote);
						return;
					}
					if (t.dataset.quotemove && t.dataset.status) {
						moveQuotation(t.dataset.quotemove, t.dataset.status);
						return;
					}
					if (t.dataset.ticket && t.dataset.action) {
						ticketAction(t.dataset.ticket, t.dataset.action);
						return;
					}
					if (t.dataset.booking && t.dataset.milestone) {
						advanceMilestone(t.dataset.booking, t.dataset.milestone);
						return;
					}
					if (t.dataset.logcall) {
						state.view = "calls";
						save();
						renderApp();
						return;
					}
				}

				const id = event.target.id;

				if (id === "simBtn") {
					const box = document.getElementById("simBox");
					const text = (box.value || "").trim();
					if (!text) {
						toast("Type a message first.");
						return;
					}
					const picker = document.getElementById("simCustomer");
					const conv = conversationById(state.selectedConversationId);
					const customerId = picker
						? picker.value
						: conv
							? conv.customerId
							: null;
					if (!customerId) {
						toast("There is no customer on file for this number.");
						return;
					}
					lastTrace = receiveInbound(customerId, text);
					state.selectedConversationId = lastTrace.conversationId;
					renderApp();
					return;
				}

				if (id === "replyBtn") {
					const box = document.getElementById("replyBox");
					const text = (box.value || "").trim();
					if (!text) {
						toast("Type a reply first.");
						return;
					}
					agentReply(state.selectedConversationId, text);
					return;
				}

				if (id === "transferBtn") {
					const conv = conversationById(state.selectedConversationId);
					if (!conv) return;
					const select = document.getElementById("transferTeam");
					const option = select.options[select.selectedIndex];
					const reason = (
						document.getElementById("transferReason").value || ""
					).trim();

					// The platform decides. The screen only collects the request and
					// prints whatever comes back, refusal or warning.
					const outcome = ENGINE.transferConversation(
						currentCaller(),
						conv,
						{
							toTeamId: select.value,
							toRegionId: option.dataset.region,
							reason,
						},
						REGIONS,
						now(),
					);

					if (!outcome.ok) {
						toast(outcome.message);
						return;
					}

					ENGINE.assertChannelUnchanged(conv, outcome.patch.phoneNumberId);
					conv.regionId = outcome.patch.regionId;
					conv.assignedTeamId = outcome.patch.assignedTeamId;
					conv.assignedAgentId = outcome.patch.assignedAgentId;
					conv.firstResponseDueAt = outcome.patch.firstResponseDueAt;
					state.transfers.push(outcome.record);
					state.activities.push(
						act(
							conv.customerId,
							outcome.patch.regionId,
							"note",
							null,
							`Transferred to ${option.textContent.trim().replace(/\s+/g, " ")}`,
							outcome.record.reason,
							signedInAs().displayName,
							outcome.record.at,
						),
					);

					// Follow the conversation into its new region, otherwise the agent
					// is left looking at a number the thread is no longer filed under.
					state.regionId = outcome.patch.regionId;
					save();
					renderApp();

					const host = document.getElementById("transferResult");
					if (host && outcome.warnings.length) {
						host.insertAdjacentHTML(
							"afterbegin",
							`<div class="card" style="margin-top:10px;border-color:var(--warn,#c80)">
								<strong style="font-size:13px">Transferred, with warnings</strong>
								<ul style="margin:6px 0 0;padding-left:18px">
									${outcome.warnings.map((w) => `<li class="muted" style="font-size:12.5px">${esc(w.message)}</li>`).join("")}
								</ul>
							</div>`,
						);
					}
					toast(
						outcome.warnings.length
							? `Transferred. ${outcome.warnings.length} warning${outcome.warnings.length === 1 ? "" : "s"}.`
							: "Transferred.",
					);
					return;
				}

				if (id === "templateBtn") {
					const sel = document.getElementById("templateSelect");
					sendTemplate(state.selectedConversationId, sel.value);
					return;
				}

				if (id === "callBtn") {
					const customerId = document.getElementById("callCustomer").value;
					const direction = document.getElementById("callDirection").value;
					const seconds = Number(
						document.getElementById("callSeconds").value || 0,
					);
					const outcome = document.getElementById("callOutcome").value.trim();
					if (!customerId) {
						toast("Choose a customer.");
						return;
					}
					logCall(customerId, direction, seconds, outcome || "No note");
					return;
				}

				if (id === "presenceBtn") {
					state.presence[state.regionId] = !state.presence[state.regionId];
					save();
					renderApp();
					toast(
						state.presence[state.regionId]
							? `${currentRegion().label} agents are now online.`
							: `${currentRegion().label} agents are now offline — a new message will get the automated reply.`,
					);
					return;
				}

				if (id === "clockBtn") {
					if (clockOffsetMs !== 0) {
						clockOffsetMs = 0;
						toast("Back to real time.");
					} else {
						clockOffsetMs = offsetToClosed(currentRegion());
						toast(
							`Clock moved to a time when ${currentRegion().label} is closed. Send a message now.`,
						);
					}
					renderApp();
					return;
				}

				if (id === "botRun") {
					const box = document.getElementById("botScript");
					state.botScript = box ? box.value : null;
					save();
					renderApp();
					return;
				}

				if (id === "botReset") {
					state.botScript = null;
					save();
					renderApp();
					return;
				}

				if (id === "bcResolve") {
					// Resolving writes down exactly who will be messaged, and any
					// approval given before it is void: the approval was of a
					// particular list of people.
					state.broadcastResolvedAt = nowIso();
					state.broadcastApprovedBy = null;
					if (state.broadcastStatus === "approved") {
						state.broadcastStatus = "draft";
					}
					save();
					renderApp();
					toast("Audience resolved. Any approval given before now is void.");
					return;
				}

				if (
					id === "bcReview" ||
					id === "bcApproveSelf" ||
					id === "bcApproveOther"
				) {
					const wanted = id === "bcReview" ? "review" : "approved";
					const step = ENGINE.canTransition(
						state.broadcastStatus ?? "draft",
						wanted,
					);
					if (!step.allowed) {
						toast(step.message);
						return;
					}
					if (wanted === "approved") {
						const who = id === "bcApproveSelf" ? "usr_hakkeem" : "usr_mariam";
						const caller = {
							kind: "user",
							id: who,
							email: "x@abccargo.ae",
							displayName: who,
							role: "master_admin",
							status: "active",
							regionIds: [state.regionId],
							teamIds: [],
						};
						const may = ENGINE.canApproveBroadcast(caller, {
							id: "bc_demo",
							regionId: state.regionId,
							status: state.broadcastStatus ?? "draft",
							createdBy: "usr_hakkeem",
							resolvedAt: state.broadcastResolvedAt,
							resolvedCount: state.broadcastResolvedAt ? 1 : null,
							approvedBy: null,
							approvedAt: null,
							startedAt: null,
						});
						if (!may.allowed) {
							toast(may.message);
							return;
						}
						state.broadcastApprovedBy = who;
					}
					state.broadcastStatus = wanted;
					save();
					renderApp();
					return;
				}

				if (id === "bcSend") {
					const may = ENGINE.checkReadyToSend({
						caller: {
							kind: "user",
							id: "usr_hakkeem",
							email: "h@abccargo.ae",
							displayName: "Hakkeem",
							role: "master_admin",
							status: "active",
							regionIds: [state.regionId],
							teamIds: [],
						},
						broadcast: {
							id: "bc_demo",
							regionId: state.regionId,
							status: state.broadcastStatus ?? "draft",
							createdBy: "usr_hakkeem",
							resolvedAt: state.broadcastResolvedAt,
							resolvedCount: state.broadcastResolvedAt ? 1 : null,
							approvedBy: state.broadcastApprovedBy,
							approvedAt: state.broadcastApprovedBy ? nowIso() : null,
							startedAt: null,
						},
						// Off, exactly as it is in the real configuration.
						sendingEnabled: false,
						now: now(),
					});
					toast(may.allowed ? "Would start sending." : may.message);
					return;
				}

				if (id === "bcResetBroadcast") {
					state.broadcastStatus = "draft";
					state.broadcastResolvedAt = null;
					state.broadcastApprovedBy = null;
					save();
					renderApp();
					return;
				}

				if (id === "resetBtn") {
					if (!window.confirm("Clear the demonstration and start again?"))
						return;
					activityId = 1;
					clockOffsetMs = 0;
					state = seed();
					save();
					renderApp();
					toast("Demonstration reset.");
					return;
				}
			});

			document.addEventListener("change", (event) => {
				const id = event.target.id;
				if (id === "bcKind" || id === "bcDays") {
					if (id === "bcKind") state.broadcastKind = event.target.value;
					else {
						state.broadcastRule = {
							...(state.broadcastRule ?? {}),
							notBookedWithinDays: Number(event.target.value),
						};
					}
					// Changing who is messaged voids an approval, for the same
					// reason the platform does it: otherwise the thing a second
					// person read is not the thing that goes out.
					state.broadcastResolvedAt = null;
					state.broadcastApprovedBy = null;
					if (state.broadcastStatus !== "draft")
						state.broadcastStatus = "draft";
					save();
					renderApp();
				}
			});

			document.addEventListener("keydown", (event) => {
				if (event.key !== "Enter" || event.shiftKey) return;
				if (event.target.id === "simBox") {
					event.preventDefault();
					document.getElementById("simBtn").click();
				} else if (
					event.target.id === "replyBox" &&
					(event.metaKey || event.ctrlKey)
				) {
					event.preventDefault();
					document.getElementById("replyBtn").click();
				}
			});

			/**
			 * Finds an offset that puts the clock outside a region's working
			 * hours, by stepping forward an hour at a time. Honest because it
			 * asks the platform's own `isWithinBusinessHours` whether it has
			 * arrived, rather than assuming where the edge is.
			 */
			function offsetToClosed(region) {
				const start = Date.now();
				for (let h = 1; h <= 24 * 8; h++) {
					const candidate = h * 3_600_000;
					if (!isWithinBusinessHours(region, new Date(start + candidate))) {
						return candidate;
					}
				}
				return 0;
			}

			/* --------------------------------------------------------------- boot */

			state = load() || seed();
			if (state.activities.length) {
				activityId =
					Math.max(...state.activities.map((a) => Number(a.id) || 0)) + 1;
			}
			renderApp();

			// The service clocks are the point, so they have to actually tick.
			window.setInterval(() => {
				// The dashboard is included: its office countdowns and waiting times
				// are the whole point of it, and a frozen clock on a screen that
				// says "closes in 54 minutes" is worse than no clock.
				if (
					state.view === "dashboard" ||
					state.view === "inbox" ||
					state.view === "tickets" ||
					state.view === "overview" ||
					state.view === "bookings"
				) {
					renderApp();
				} else {
					renderTopbar();
				}
			}, 30_000);
		</script>
	</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<title>ABC Cargo Engage</title>
		<style>
			:root {
				color-scheme: light;
				--paper: #f5f5f5;
				--card: #ffffff;
				--sunk: #ebebeb;
				--ink: #111111;
				--ink-2: #4a4a4a;
				--ink-3: #7a7a7a;
				--rule: #d8d8d8;
				--rule-soft: #e8e8e8;
				/*
				 * Red, white and black only — the Head of IT's decision of
				 * 8 October 2026.
				 *
				 * One accent hue means status cannot be carried by colour alone,
				 * so it is carried by WEIGHT in that one hue: quiet states are
				 * ink on a neutral wash, attention is red on a red wash, and the
				 * most serious state is the only thing on the screen allowed a
				 * solid red fill. Every pill also carries its own word, so none
				 * of this depends on seeing the colour at all.
				 *
				 * The greys below are tone, not a fourth colour: rules, muted
				 * text and sunk surfaces are steps between the white and the
				 * black. Nothing grey carries meaning.
				 */
				/*
				 * #e64a3c is ABC Cargo's own red, read off the live sites
				 * (abccargo.ae, abccargogcc.com, abccargo.com — it is the most
				 * frequent colour on all three). It is a FILL colour: 3.88:1 on
				 * white, which clears the 3:1 a mark needs and misses the 4.5:1
				 * text needs. So text uses --brand-ink, a darker step of the
				 * same hue, and a solid red pill uses --brand-solid so the white
				 * on it still clears 4.5:1. Every ratio here was measured, not
				 * chosen by eye.
				 */
				--brand: #e64a3c;
				--brand-ink: #d42a1b;
				--brand-wash: #fbefee;
				--brand-solid: #e22f1f;
				/*
				 * Region identity is shape, not hue — three regions cannot have
				 * three accent colours out of two. See `.dot-*`: filled red,
				 * filled ink, and a ring. The label is beside the mark in every
				 * place one appears, so the mark is reinforcement.
				 */
				--uae: #e64a3c;
				--ksa: #111111;
				--uk: #ffffff;
				/* Quiet, settled, nothing-to-do-here. Ink, never green. */
				--good: #2f2f2f;
				--good-wash: #ededed;
				/* Attention. Red, outlined weight. */
				--warn: #d42a1b;
				--warn-wash: #fbefee;
				/* Serious. Red, solid weight — see .pill-critical. */
				--critical: #ffffff;
				--critical-wash: #e22f1f;
				/*
				 * The WhatsApp thread. Real WhatsApp tints outbound messages
				 * green; red/white/black has no green, so direction is shown by
				 * a red edge on our own messages instead of a fill colour. The
				 * thread is therefore readable but deliberately not a faithful
				 * likeness of WhatsApp's own interface.
				 */
				--wa-canvas: #efefef;
				--wa-in: #ffffff;
				--wa-out: #fbefee;
				--wa-ink: #17120f;
				/*
				 * Fonts already on the machine. The page must work with the
				 * network cable out, so it asks nothing of a font service; on a
				 * corporate laptop a blocked webfont request is a blank second
				 * of unstyled text, and on an air-gapped one it never resolves.
				 */
				--ui:
					"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial,
					sans-serif;
				--narrow:
					"Segoe UI Semibold", "Segoe UI", system-ui, "Helvetica Neue", Arial,
					sans-serif;
				--mono:
					"Cascadia Mono", Consolas, ui-monospace, Menlo, "DejaVu Sans Mono",
					monospace;
				--shadow:
					0 1px 2px rgba(23, 18, 15, 0.06),
					0 10px 28px -20px rgba(23, 18, 15, 0.35);
			}

			@media (prefers-color-scheme: dark) {
				:root:not([data-theme="light"]) {
					color-scheme: dark;
					--paper: #0d0d0d;
					--card: #1a1a1a;
					--sunk: #222222;
					--ink: #f2f2f2;
					--ink-2: #b0b0b0;
					--ink-3: #808080;
					--rule: #2e2e2e;
					--rule-soft: #242424;
					/* The same three colours, stepped for a dark surface. */
					--brand: #e64a3c;
					--brand-ink: #e64c3e;
					--brand-wash: #2b1113;
					--brand-solid: #e64a3c;
					--uae: #e64a3c;
					--ksa: #f2f2f2;
					--uk: #1a1a1a;
					--good: #c8c8c8;
					--good-wash: #262626;
					--warn: #e64c3e;
					--warn-wash: #2b1113;
					/* Solid red fill; near-black text on it, because white is 3.88:1. */
					--critical: #140605;
					--critical-wash: #e64a3c;
					--wa-canvas: #121212;
					--wa-in: #221f1d;
					--wa-out: #2b1113;
					--wa-ink: #f3efec;
					--shadow:
						0 1px 2px rgba(0, 0, 0, 0.5), 0 12px 30px -22px rgba(0, 0, 0, 0.9);
				}
			}

			:root[data-theme="dark"] {
				color-scheme: dark;
				--paper: #0d0d0d;
				--card: #1a1a1a;
				--sunk: #222222;
				--ink: #f2f2f2;
				--ink-2: #b0b0b0;
				--ink-3: #808080;
				--rule: #2e2e2e;
				--rule-soft: #242424;
				--brand: #e64a3c;
				--brand-ink: #e64c3e;
				--brand-wash: #2b1113;
				--brand-solid: #e64a3c;
				--uae: #e64a3c;
				--ksa: #f2f2f2;
				--uk: #1a1a1a;
				--good: #c8c8c8;
				--good-wash: #262626;
				--warn: #e64c3e;
				--warn-wash: #2b1113;
				--critical: #140605;
				--critical-wash: #e64a3c;
				--wa-canvas: #121212;
				--wa-in: #221f1d;
				--wa-out: #2b1113;
				--wa-ink: #f3efec;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				padding: 0;
			}

			body {
				background: var(--paper);
				color: var(--ink);
				font-family: var(--ui);
				font-size: 15px;
				line-height: 1.45;
				-webkit-font-smoothing: antialiased;
			}

			button,
			input,
			select,
			textarea {
				font: inherit;
				color: inherit;
			}

			button {
				cursor: pointer;
			}

			/* ------------------------------------------------------------ chrome */

			.topbar {
				position: sticky;
				top: 0;
				z-index: 20;
				background: var(--card);
				border-bottom: 1px solid var(--rule);
				padding: 10px 16px;
				display: flex;
				flex-wrap: wrap;
				gap: 12px 18px;
				align-items: center;
			}

			.brand {
				display: flex;
				align-items: baseline;
				gap: 9px;
				margin-right: auto;
			}

			.brand b {
				font-family: var(--narrow);
				font-weight: 700;
				font-size: 20px;
				letter-spacing: 0.01em;
				color: var(--brand);
				text-transform: uppercase;
			}

			.brand span {
				font-size: 12px;
				color: var(--ink-3);
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}

			.regions {
				display: flex;
				gap: 6px;
				background: var(--sunk);
				padding: 4px;
				border-radius: 10px;
			}

			.regions button {
				border: 0;
				background: transparent;
				border-radius: 7px;
				padding: 6px 12px;
				font-size: 13px;
				font-weight: 600;
				color: var(--ink-2);
				display: flex;
				align-items: center;
				gap: 7px;
			}

			.regions button[aria-pressed="true"] {
				background: var(--card);
				color: var(--ink);
				box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
			}

			.regions .dot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				flex: none;
			}

			/*
			 * Region identity, in a palette with one accent hue.
			 *
			 * Three regions cannot have three accent colours out of red, white
			 * and black, so the mark differs by FILL AND SHAPE rather than hue:
			 * UAE is solid red, KSA is solid ink, UK is a ring. A region's name
			 * is beside the mark everywhere one appears, so the mark reinforces
			 * the label instead of replacing it — which is the right way round
			 * even when a palette does have spare hues.
			 */
			.dot-uae {
				background: var(--uae);
			}
			.dot-ksa {
				background: var(--ksa);
			}
			.dot-uk {
				background: var(--uk);
				box-shadow: inset 0 0 0 2px var(--ink);
			}

			.regions .count {
				font-family: var(--mono);
				font-size: 11px;
				background: var(--brand);
				color: #fff;
				border-radius: 999px;
				padding: 0 5px;
				min-width: 17px;
				text-align: center;
			}

			.clockbox {
				display: flex;
				align-items: center;
				gap: 10px;
				font-size: 12px;
				color: var(--ink-2);
			}

			.pill {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				border-radius: 999px;
				padding: 3px 9px;
				font-size: 11px;
				font-weight: 600;
				letter-spacing: 0.03em;
				text-transform: uppercase;
				border: 1px solid transparent;
			}

			/*
			 * Status, as a weight ladder in one hue.
			 *
			 * With no green and no amber, severity cannot be a colour change, so
			 * it is a WEIGHT change: settled states are ink on a neutral wash,
			 * attention is red ink on a red wash with a red edge, and the most
			 * serious state is the only solid red fill on the screen. Weight
			 * reads as severity even in greyscale.
			 *
			 * Every pill also prints its own word — "answered", "resolved",
			 * "overdue" — so none of this is colour-alone. That is the actual
			 * accessibility guarantee; the colour is the fast path, not the
			 * information.
			 */
			.pill-open {
				background: var(--good-wash);
				color: var(--good);
			}
			.pill-closed {
				background: var(--sunk);
				color: var(--ink-3);
			}
			.pill-warn {
				background: var(--warn-wash);
				color: var(--warn);
				border-color: var(--warn);
			}
			.pill-critical {
				background: var(--critical-wash);
				color: var(--critical);
				border-color: var(--critical-wash);
			}
			.pill-brand {
				background: var(--brand-wash);
				color: var(--brand-ink);
			}

			.ghost {
				border: 1px solid var(--rule);
				background: var(--card);
				border-radius: 8px;
				padding: 6px 11px;
				font-size: 13px;
				font-weight: 500;
			}

			.ghost:hover {
				border-color: var(--ink-3);
			}

			.primary {
				border: 0;
				/* --brand-solid, not --brand: white on the brand fill is 3.88:1. */
				background: var(--brand-solid);
				color: #fff;
				border-radius: 8px;
				padding: 7px 14px;
				font-size: 13px;
				font-weight: 600;
			}

			.primary:disabled,
			.ghost:disabled {
				opacity: 0.4;
				cursor: not-allowed;
			}

			.safety {
				background: var(--warn-wash);
				color: var(--warn);
				border-bottom: 1px solid var(--rule);
				padding: 7px 16px;
				font-size: 12.5px;
				display: flex;
				gap: 8px;
				align-items: center;
			}

			nav.tabs {
				display: flex;
				gap: 2px;
				padding: 0 16px;
				border-bottom: 1px solid var(--rule);
				background: var(--card);
				overflow-x: auto;
			}

			nav.tabs button {
				border: 0;
				background: transparent;
				padding: 11px 13px;
				font-size: 13.5px;
				font-weight: 600;
				color: var(--ink-3);
				border-bottom: 2px solid transparent;
				white-space: nowrap;
			}

			nav.tabs button[aria-selected="true"] {
				color: var(--ink);
				border-bottom-color: var(--brand);
			}

			main {
				padding: 16px;
				max-width: 1440px;
				margin: 0 auto;
			}

			/* ------------------------------------------------------------- cards */

			.card {
				background: var(--card);
				border: 1px solid var(--rule);
				border-radius: 12px;
				box-shadow: var(--shadow);
			}

			.card > h2,
			.card > h3 {
				margin: 0;
				padding: 12px 14px;
				border-bottom: 1px solid var(--rule-soft);
				font-size: 13px;
				font-weight: 700;
				letter-spacing: 0.05em;
				text-transform: uppercase;
				color: var(--ink-2);
				display: flex;
				align-items: center;
				gap: 9px;
			}

			.card > h2 small,
			.card > h3 small {
				margin-left: auto;
				font-weight: 500;
				letter-spacing: 0;
				text-transform: none;
				color: var(--ink-3);
			}

			.pad {
				padding: 14px;
			}

			.muted {
				color: var(--ink-3);
			}

			.mono {
				font-family: var(--mono);
				font-size: 12.5px;
			}

			.empty {
				padding: 28px 14px;
				text-align: center;
				color: var(--ink-3);
				font-size: 13.5px;
			}

			/* ------------------------------------------------------------- inbox */

			.inbox {
				display: grid;
				grid-template-columns: 290px minmax(0, 1fr) 330px;
				gap: 14px;
				align-items: start;
			}

			@media (max-width: 1180px) {
				.inbox {
					grid-template-columns: 260px minmax(0, 1fr);
				}
				.inbox .rail {
					grid-column: 1 / -1;
				}
			}

			@media (max-width: 760px) {
				.inbox {
					grid-template-columns: minmax(0, 1fr);
				}
			}

			.convlist {
				max-height: 70vh;
				overflow-y: auto;
			}

			.conv {
				display: block;
				width: 100%;
				text-align: left;
				border: 0;
				border-bottom: 1px solid var(--rule-soft);
				background: transparent;
				padding: 11px 13px;
			}

			.conv:hover {
				background: var(--sunk);
			}

			.conv[aria-current="true"] {
				background: var(--brand-wash);
				box-shadow: inset 3px 0 0 var(--brand);
			}

			.conv .row1 {
				display: flex;
				align-items: baseline;
				gap: 8px;
			}

			.conv .name {
				font-weight: 600;
				font-size: 14px;
			}

			.conv .time {
				margin-left: auto;
				font-size: 11px;
				color: var(--ink-3);
				font-family: var(--mono);
			}

			.conv .preview {
				font-size: 12.5px;
				color: var(--ink-3);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				margin-top: 2px;
			}

			.conv .tags {
				display: flex;
				gap: 5px;
				margin-top: 6px;
				flex-wrap: wrap;
			}

			.thread {
				background: var(--wa-canvas);
				padding: 14px;
				min-height: 320px;
				max-height: 52vh;
				overflow-y: auto;
				display: flex;
				flex-direction: column;
				gap: 9px;
			}

			.bubble {
				max-width: 78%;
				padding: 7px 10px 5px;
				border-radius: 9px;
				font-size: 14px;
				color: var(--wa-ink);
				word-wrap: break-word;
				box-shadow: 0 1px 1px rgba(0, 0, 0, 0.12);
			}

			/*
			 * Only the message text keeps the customer's own line breaks. Putting
			 * pre-wrap on the bubble itself would also preserve the indentation of
			 * the template literal that builds it, which pushes every message to
			 * the right and stretches the bubble to its full width.
			 */
			.bubble .text {
				display: block;
				white-space: pre-wrap;
			}

			.bubble.in {
				background: var(--wa-in);
				align-self: flex-start;
				border-top-left-radius: 2px;
			}

			.bubble.out {
				background: var(--wa-out);
				align-self: flex-end;
				border-top-right-radius: 2px;
			}

			.bubble .meta {
				display: flex;
				gap: 6px;
				align-items: center;
				justify-content: flex-end;
				font-size: 10.5px;
				color: var(--ink-3);
				font-family: var(--mono);
				margin-top: 3px;
			}

			.bubble .who {
				font-size: 10.5px;
				font-weight: 700;
				letter-spacing: 0.05em;
				text-transform: uppercase;
				color: var(--ink-3);
				margin-bottom: 2px;
			}

			.composer {
				border-top: 1px solid var(--rule);
				padding: 12px 14px;
				display: grid;
				gap: 9px;
			}

			.composer textarea {
				width: 100%;
				min-height: 62px;
				resize: vertical;
				border: 1px solid var(--rule);
				border-radius: 9px;
				padding: 9px 11px;
				background: var(--card);
			}

			.composer .actions {
				display: flex;
				gap: 8px;
				align-items: center;
				flex-wrap: wrap;
			}

			.sim {
				border-top: 1px dashed var(--rule-soft);
				background: var(--sunk);
				padding: 12px 14px;
				display: grid;
				gap: 9px;
			}

			.sim h4 {
				margin: 0;
				font-size: 12px;
				text-transform: uppercase;
				letter-spacing: 0.05em;
				color: var(--ink-2);
			}

			.sim .simwho {
				display: flex;
				align-items: center;
				gap: 8px;
				font-size: 12px;
				text-transform: uppercase;
				letter-spacing: 0.05em;
				color: var(--ink-3);
			}

			.sim .simwho select {
				flex: 1;
				min-width: 0;
				text-transform: none;
				letter-spacing: 0;
			}

			.sim .inputrow {
				display: flex;
				gap: 8px;
			}

			.sim input {
				flex: 1;
				border: 1px solid var(--rule);
				border-radius: 9px;
				padding: 9px 11px;
				background: var(--card);
				min-width: 0;
			}

			.chips {
				display: flex;
				gap: 6px;
				flex-wrap: wrap;
			}

			.chip {
				border: 1px solid var(--rule);
				background: var(--card);
				border-radius: 999px;
				padding: 4px 10px;
				font-size: 12px;
				color: var(--ink-2);
			}

			.chip:hover {
				border-color: var(--brand);
				color: var(--brand-ink);
			}

			/* -------------------------------------------------------- trace card */

			.trace {
				border: 1px solid var(--rule);
				border-left: 3px solid var(--brand);
				border-radius: 9px;
				background: var(--card);
				padding: 11px 13px;
				display: grid;
				gap: 7px;
				font-size: 13px;
			}

			.trace h5 {
				margin: 0;
				font-size: 11.5px;
				letter-spacing: 0.05em;
				text-transform: uppercase;
				color: var(--ink-3);
			}

			.trace ul {
				margin: 0;
				padding-left: 17px;
				display: grid;
				gap: 3px;
			}

			.kv {
				display: grid;
				grid-template-columns: 128px minmax(0, 1fr);
				gap: 3px 10px;
				font-size: 13px;
			}

			.kv dt {
				color: var(--ink-3);
			}

			.kv dd {
				margin: 0;
			}

			/* ------------------------------------------------------------- rail */

			.rail {
				display: grid;
				gap: 14px;
			}

			.timeline {
				max-height: 42vh;
				overflow-y: auto;
				padding: 4px 0;
			}

			.tl {
				display: grid;
				grid-template-columns: 22px minmax(0, 1fr);
				gap: 9px;
				padding: 8px 13px;
				border-bottom: 1px solid var(--rule-soft);
			}

			.tl:last-child {
				border-bottom: 0;
			}

			.tl .ic {
				width: 22px;
				height: 22px;
				border-radius: 6px;
				background: var(--sunk);
				display: grid;
				place-items: center;
				font-size: 11px;
				font-weight: 700;
				color: var(--ink-2);
			}

			.tl .s {
				font-size: 13px;
				font-weight: 500;
			}

			.tl .d {
				font-size: 12px;
				color: var(--ink-3);
				white-space: pre-wrap;
			}

			.tl .t {
				font-family: var(--mono);
				font-size: 10.5px;
				color: var(--ink-3);
			}

			/* ------------------------------------------------------------ tables */

			.tablewrap {
				overflow-x: auto;
			}

			table {
				width: 100%;
				border-collapse: collapse;
				font-size: 13.5px;
			}

			th {
				text-align: left;
				font-size: 11px;
				letter-spacing: 0.05em;
				text-transform: uppercase;
				color: var(--ink-3);
				padding: 9px 12px;
				border-bottom: 1px solid var(--rule);
				white-space: nowrap;
			}

			td {
				padding: 10px 12px;
				border-bottom: 1px solid var(--rule-soft);
				vertical-align: top;
			}

			tr:last-child td {
				border-bottom: 0;
			}

			td .acts {
				display: flex;
				gap: 6px;
				flex-wrap: wrap;
			}

			/**
			 * Ended bot sessions for the demonstration, in the shape the runtime
			 * records them: a flow, one of the runtime's own end reasons, whether a
			 * human also sent a message, and the step the customer was sitting on
			 * when the session ended.
			 *
			 * Written as counts rather than a hundred literal objects. The counts
			 * are chosen so that the deflection figure works out at the 41% the
			 * screen designs show — but it is now *derived* from the end reasons
			 * rather than typed into a tile, and it only reaches 41% because
			 * abandonment is counted in the denominator. Fold the abandoned twenty

			 */
			/**
			 * Fourteen days of conversation volume per region, for the chart.
			 *
			 * Demonstration data, and the Reports screen says so on the panel.
			 * The seeded conversations number four — enough to show routing and
			 * a timeline, nowhere near enough to draw a trend from — so rather
			 * than render four bars and let them imply a history the platform
			 * has not collected, the series is seeded and labelled as such.
			 *
			 * Shaped rather than random: UAE busiest, KSA about half, UK a quiet
			 * desk, with a weekly dip, so the three panels differ the way three
			 * real numbers would and the shared scale has something to show.
			 */
			function seedDailyVolume() {
				const base = { uae: 24, ksa: 13, uk: 5 };
				const rows = [];
				for (let back = 13; back >= 0; back--) {
					const d = new Date(Date.now() - back * 86400000);
					const day = d.toISOString().slice(5, 10);
					const weekday = d.getUTCDay();
					for (const region of ["uae", "ksa", "uk"]) {
						// A Friday dip in the Gulf, a weekend dip in the UK.
						const quiet =
							region === "uk" ? weekday === 0 || weekday === 6 : weekday === 5;
						const swing = ((back * 7 + region.length * 3) % 5) - 2;
						const n = Math.max(
							0,
							Math.round(base[region] * (quiet ? 0.35 : 1) + swing),
						);
						rows.push({ day, regionId: region, conversations: n });
					}
				}
				return rows;
			}

				s.activities = [

					act(

				s.selectedConversationId = "conv_1";

			}

			function hoursAgo(h) {
				return new Date(Date.now() - h * 3_600_000).toISOString();
			}

			function msg(dir, text, at, opts = {}) {
				return {
					id: uid("msg"),
					dir,
					text,
					at,
					kind: opts.kind || (dir === "in" ? "text" : "text"),
					actor: opts.actor || (dir === "in" ? "customer" : AGENT_NAME),
					template: opts.template || null,
				};
			}

			function act(
				customerId,
				regionId,
				kind,
				ref,
				summary,
				detail,
				actor,
				occurredAt,
			) {
				return {
					id: activityId++,
					customerId,
					regionId,
					kind,
					ref,
					summary,
					detail,
					actor,
					occurredAt,
				};
			}

			/* --------------------------------------------------------- selectors */

			function regionOf(id) {
				const r = findRegionById(REGIONS, id);
				if (!r) throw new Error(`unknown region ${id}`);
				return r;
			}

			function currentRegion() {
				return regionOf(state.regionId);
			}

			function customerById(id) {
				return state.customers.find((c) => c.id === id) || null;
			}

			function customerByWaId(waId) {
				return state.customers.find((c) => c.waId === waId) || null;
			}

			/**
			 * Mirrors Repository.getBooking. References arrive here normalised by
			 * intent recognition — ABC-UAE-088210 as ABCUAE088210 — so both sides
			 * have to be compared in that form or a customer quoting exactly what
			 * we printed is not matched to their own shipment.
			 */
			function bookingByRef(ref) {
				const want = normaliseRef(String(ref));
				return state.bookings.find((b) => normaliseRef(b.ref) === want) || null;
			}

			function conversationById(id) {
				return state.conversations.find((c) => c.id === id) || null;
			}

			function conversationsForRegion(regionId) {
				return state.conversations
					.filter((c) => c.regionId === regionId)
					.sort(
						(a, b) => Date.parse(b.lastInboundAt) - Date.parse(a.lastInboundAt),
					);
			}

			function conversationForCustomer(customerId) {
				return (
					state.conversations.find((c) => c.customerId === customerId) || null
				);
			}

			/** Any open matter for this customer — for chips and list rows. */
			function anyOpenTicketFor(customerId) {
				return (
					state.tickets.find(
						(t) =>
							t.customerId === customerId &&
							(t.status === "open" || t.status === "pending"),
					) || null
				);
			}

			/**
			 * Mirrors CrmService.openTicketIfNoneOpen: a second message only joins
			 * an existing ticket when it is the SAME kind of matter. A damage
			 * claim raised while a documentation request is still open is its own
			 * ticket, with its own type, priority and clock.
			 */
			function openTicketFor(customerId, type) {
				return (
					state.tickets.find(
						(t) =>
							t.customerId === customerId &&
							t.type === type &&
							(t.status === "open" || t.status === "pending"),
					) || null
				);
			}

			function openLeadFor(customerId) {
				return (
					state.leads.find(
						(l) => l.customerId === customerId && isLeadOpen(l.stage),
					) || null
				);
			}

			function activitiesFor(customerId) {
				return state.activities
					.filter((a) => a.customerId === customerId)
					.sort((a, b) => Date.parse(b.occurredAt) - Date.parse(a.occurredAt));
			}

			function windowOpen(conv) {
				return (
					!!conv.windowExpiresAt &&
					Date.parse(conv.windowExpiresAt) > now().getTime()
				);
			}

			function agentsOnline(regionId) {
				return state.presence[regionId] ? 1 : 0;
			}

			/* ---------------------------------------------------------- pipeline */

			/**
			 * The inbound path, in the same order as the Worker: the conversation
			 * is updated, the message is classified, a reference is matched to a
			 * shipment, and the intent decides whether a lead or a ticket is
			 * opened — reusing an open one rather than creating a second.
			 *
			 * Returns a trace so the screen can show not just what happened but
			 * why, which is the part a supervisor needs to trust it.
			 */
			function receiveInbound(customerId, text) {
				const customer = customerById(customerId);
				const region = regionOf(customer.regionId);
				const at = nowIso();

				let conv = conversationForCustomer(customerId);
				if (!conv) {
					conv = {
						id: uid("conv"),
						customerId,
						regionId: customer.regionId,
						status: "open",
						assignedAgentId: null,
						lastInboundAt: at,
						windowExpiresAt: null,
						firstResponseDueAt: null,
						firstResponseAt: null,
						lastAutoReplyAt: null,
						messages: [],
					};
					state.conversations.push(conv);
				}

				conv.messages.push(msg("in", text, at));
				conv.lastInboundAt = at;
				conv.status = "open";
				// A customer message opens or extends the 24-hour service window.
				conv.windowExpiresAt = new Date(
					Date.parse(at) + SERVICE_WINDOW_MS,
				).toISOString();
				if (!conv.firstResponseAt) {
					conv.firstResponseDueAt = addBusinessMinutes(
						region,
						new Date(at),
						CONVERSATION_FIRST_RESPONSE_MINUTES,
					).toISOString();
				}

				const intent = classifyIntent(text);

				state.activities.push(
					act(
						customerId,
						region.id,
						"whatsapp",
						null,
						`Inbound WhatsApp · ${intent.intent}`,
						text,
						"customer",
						at,
					),
				);

				let booking = null;
				for (const ref of intent.references) {
					booking = bookingByRef(ref);
					if (booking) break;
				}

				const outcome = outcomeFor(intent.intent);
				let lead = null;
				let ticket = null;
				let reusedExisting = false;

				if (outcome === "lead") {
					const existing = openLeadFor(customerId);
					if (existing) {
						lead = existing;
						reusedExisting = true;
					} else {
						lead = {
							id: uid("lead"),
							ref: buildRef("lead", ++state.seq.lead),
							customerId,
							regionId: region.id,
							source: "whatsapp_bot",
							origin: null,
							destination: null,
							mode: null,
							stage: "new",
							estValue: null,
							currency: null,
							lostReason: null,
							createdAt: at,
							updatedAt: at,
						};
						state.leads.push(lead);
						state.activities.push(
							act(
								customerId,
								region.id,
								"lead",
								lead.ref,
								"Lead opened · whatsapp_bot",
								summarise(text),
								"system",
								at,
							),
						);
					}
				} else if (outcome === "ticket") {
					const type = ticketTypeFor(intent.intent);
					const existing = openTicketFor(customerId, type);
					if (existing) {
						ticket = existing;
						reusedExisting = true;
					} else {
						const priority = type === "claim" ? "high" : "normal";
						const due = ticketDueDates(region, type, priority, new Date(at));
						ticket = {
							id: uid("tkt"),
							ref: buildRef("ticket", ++state.seq.ticket),
							customerId,
							regionId: region.id,
							bookingId: booking ? booking.id : null,
							type,
							subject: summarise(text) || `${type} raised on WhatsApp`,
							priority,
							status: "open",
							firstResponseDueAt: due.firstResponseDueAt,
							resolutionDueAt: due.resolutionDueAt,
							firstResponseAt: null,
							resolvedAt: null,
							createdAt: at,
							updatedAt: at,
						};
						state.tickets.push(ticket);
						state.activities.push(
							act(
								customerId,
								region.id,
								"ticket",
								ticket.ref,
								`Ticket opened · ${type}`,
								ticket.subject,
								"system",
								at,
							),
						);
					}
				}

				// Automated reply, under the same conditions as the Worker: only
				// when no agent owns the conversation, and only outside hours or
				// with nobody online.
				let autoReply = null;
				let autoReason = null;
				if (!conv.assignedAgentId) {
					if (!isWithinBusinessHours(region, now())) {
						autoReason = "outside-hours";
					} else if (agentsOnline(region.id) === 0) {
						autoReason = "no-agents-online";
					}
				}
				if (autoReason) {
					autoReply = buildAutoReply({
						region,
						reason: autoReason,
						contactName: customer.displayName,
						inboundText: text,
					});
					conv.messages.push(
						msg("out", autoReply, nowIso(), {
							kind: "auto",
							actor: "automated",
						}),
					);
					conv.lastAutoReplyAt = nowIso();
				}

				save();
				return {
					conversationId: conv.id,
					intent,
					booking,
					lead,
					ticket,
					reusedExisting,
					autoReason,
					outcome,
				};
			}

			/** Same shortening rule the service uses for a ticket subject. */
			function summarise(text, max = 120) {
				const clean = String(text || "")
					.replace(/\s+/g, " ")
					.trim();
				return clean.length <= max ? clean : `${clean.slice(0, max - 1)}…`;
			}

			/* ----------------------------------------------------------- actions */

			function agentReply(convId, text) {
				const conv = conversationById(convId);
				if (!conv) return;
				if (!windowOpen(conv)) {
					toast("The 24-hour service window has closed — send a template.");
					return;
				}
				const at = nowIso();
				conv.messages.push(
					msg("out", text, at, { kind: "text", actor: AGENT_NAME }),
				);
				conv.assignedAgentId = AGENT_ID;
				if (!conv.firstResponseAt) {
					conv.firstResponseAt = at;
					conv.firstResponseDueAt = null;
				}
				const ticket = openTicketFor(conv.customerId);
				if (ticket && !ticket.firstResponseAt) {
					ticket.firstResponseAt = at;
					ticket.updatedAt = at;
				}
				state.activities.push(
					act(
						conv.customerId,
						conv.regionId,
						"whatsapp",
						null,
						"Outbound WhatsApp · agent reply",
						text,
						AGENT_NAME,
						at,
					),
				);
				save();
				renderApp();
			}

			function sendTemplate(convId, templateName) {
				const conv = conversationById(convId);
				if (!conv) return;
				const at = nowIso();
				const body = TEMPLATE_BODIES[templateName] || templateName;
				conv.messages.push(
					msg("out", body, at, {
						kind: "template",
						actor: AGENT_NAME,
						template: templateName,
					}),
				);
				state.activities.push(
					act(
						conv.customerId,
						conv.regionId,
						"whatsapp",
						null,
						`Outbound template · ${templateName}`,
						body,
						AGENT_NAME,
						at,
					),
				);
				save();
				renderApp();
				toast(`Template ${templateName} sent.`);
			}

			const TEMPLATE_BODIES = {
				abc_shipment_status_update:
					"Hello, this is an update on your ABC Cargo shipment. Your shipment has reached a new stage. Reply to this message if you need anything from us.",
				abc_delivery_completed:
					"Hello, your ABC Cargo shipment has been delivered. Thank you for shipping with us. Reply here if anything is not as expected.",
				abc_service_followup:
					"Hello, this is ABC Cargo following up on your recent enquiry. Reply to this message and an agent will continue where we left off.",
			};

			function advanceLead(leadId, to) {
				const lead = state.leads.find((l) => l.id === leadId);
				if (!lead) return;
				try {
					assertLeadTransition(lead.stage, to);
				} catch (error) {
					toast(error.message);
					return;
				}
				const from = lead.stage;
				lead.stage = to;
				lead.updatedAt = nowIso();
				if (to === "lost") lead.lostReason = "Price";
				if (to === "won" || to === "lost") lead.closedAt = nowIso();
				state.activities.push(
					act(
						lead.customerId,
						lead.regionId,
						"lead",
						lead.ref,
						`Lead ${from} → ${to}`,
						null,
						AGENT_NAME,
						nowIso(),
					),
				);
				save();
				renderApp();
			}

			function quoteLead(leadId) {
				const lead = state.leads.find((l) => l.id === leadId);
				if (!lead) return;
				if (lead.stage === "new") {
					try {
						assertLeadTransition("new", "qualified");
						lead.stage = "qualified";
					} catch {
						/* unreachable: new → qualified is always allowed */
					}
				}
				const at = nowIso();
				const amount = 400 + Math.round(Math.random() * 2600);
				const currency =
					lead.regionId === "uae"
						? "AED"
						: lead.regionId === "ksa"
							? "SAR"
							: "GBP";
				const q = {
					id: uid("quo"),
					ref: buildRef("quotation", ++state.seq.quotation),
					leadId: lead.id,
					customerId: lead.customerId,
					regionId: lead.regionId,
					origin: lead.origin || "Dubai",
					destination: lead.destination || "Kochi",
					mode: lead.mode || "air",
					chargeableKg: 40,
					totalAmount: amount,
					currency,
					status: "draft",
					validUntil: new Date(Date.parse(at) + 7 * 86_400_000).toISOString(),
					createdAt: at,
					updatedAt: at,
				};
				state.quotations.push(q);
				state.activities.push(
					act(
						lead.customerId,
						lead.regionId,
						"quotation",
						q.ref,
						`Quotation drafted · ${currency} ${amount}`,
						`${q.origin} → ${q.destination}, ${q.mode}`,
						AGENT_NAME,
						at,
					),
				);
				save();
				renderApp();
				toast(`${q.ref} drafted against ${lead.ref}.`);
			}

			function moveQuotation(quoteId, to) {
				const q = state.quotations.find((x) => x.id === quoteId);
				if (!q) return;
				try {
					assertQuotationTransition(q.status, to);
				} catch (error) {
					toast(error.message);
					return;
				}
				const from = q.status;
				q.status = to;
				q.updatedAt = nowIso();

				state.activities.push(
					act(
						q.customerId,
						q.regionId,
						"quotation",
						q.ref,
						`Quotation ${from} → ${to}`,
						null,
						AGENT_NAME,
						nowIso(),
					),
				);

				// The lead follows the quotation, by the rule in lifecycle.ts.
				const implied = leadStageForQuotation(to);
				const lead = state.leads.find((l) => l.id === q.leadId);
				if (implied && lead && canAdvanceLead(lead.stage, implied)) {
					const from2 = lead.stage;
					lead.stage = implied;
					lead.updatedAt = nowIso();
					state.activities.push(
						act(
							lead.customerId,
							lead.regionId,
							"lead",
							lead.ref,
							`Lead ${from2} → ${implied} (quotation ${to})`,
							null,
							"system",
							nowIso(),
						),
					);
				}

				// An accepted quotation becomes a shipment.
				if (to === "accepted") {
					const at = nowIso();
					const booking = {
						id: uid("bkg"),
						ref: buildRef("booking", ++state.seq.booking, q.regionId),
						customerId: q.customerId,
						regionId: q.regionId,
						origin: q.origin,
						destination: q.destination,
						mode: q.mode,
						pieces: 1,
						weightKg: q.chargeableKg,
						valueAmount: q.totalAmount,
						currency: q.currency,
						milestone: "booked",
						milestoneAt: at,
						createdAt: at,
					};
					state.bookings.push(booking);
					state.activities.push(
						act(
							q.customerId,
							q.regionId,
							"booking",
							booking.ref,
							`Booking created · ${booking.origin} → ${booking.destination}`,
							`From quotation ${q.ref}`,
							"system",
							at,
						),
					);
					toast(`${booking.ref} created from ${q.ref}.`);
				}
				save();
				renderApp();
			}

			function advanceMilestone(bookingId, to) {
				const b = state.bookings.find((x) => x.id === bookingId);
				if (!b) return;
				try {
					assertMilestoneAdvance(b.milestone, to);
				} catch (error) {
					toast(error.message);
					return;
				}
				const from = b.milestone;
				const at = nowIso();
				b.milestone = to;
				b.milestoneAt = at;
				state.activities.push(
					act(
						b.customerId,
						b.regionId,
						"milestone",
						b.ref,
						`Milestone ${from} → ${to}`,
						null,
						"shipment_system",
						at,
					),
				);

				// Only some milestones are worth a message to the customer.
				const template = templateForMilestone(to);
				if (template && shouldNotifyCustomer(to)) {
					const conv = conversationForCustomer(b.customerId);
					if (conv) {
						conv.messages.push(
							msg("out", TEMPLATE_BODIES[template], nowIso(), {
								kind: "template",
								actor: "automated",
								template,
							}),
						);
						state.activities.push(
							act(
								b.customerId,
								b.regionId,
								"whatsapp",
								b.ref,
								`Proactive update sent · ${template}`,
								null,
								"automated",
								nowIso(),
							),
						);
					}
				}
				save();
				renderApp();
			}

			function ticketAction(ticketId, action) {
				const t = state.tickets.find((x) => x.id === ticketId);
				if (!t) return;
				const at = nowIso();
				if (action === "respond") {
					t.firstResponseAt = at;
					t.status = "pending";
				} else if (action === "resolve") {
					if (!t.firstResponseAt) t.firstResponseAt = at;
					t.resolvedAt = at;
					t.status = "resolved";
				} else if (action === "close") {
					t.status = "closed";
					if (!t.resolvedAt) t.resolvedAt = at;
				} else if (action === "escalate") {
					t.priority = "urgent";
					const due = ticketDueDates(
						regionOf(t.regionId),
						t.type,
						"urgent",
						new Date(t.createdAt),
					);
					t.firstResponseDueAt = due.firstResponseDueAt;
					t.resolutionDueAt = due.resolutionDueAt;
				}
				t.updatedAt = at;
				state.activities.push(
					act(
						t.customerId,
						t.regionId,
						"ticket",
						t.ref,
						`Ticket ${action === "respond" ? "first response recorded" : action === "escalate" ? "escalated to urgent" : action + "d"}`,
						null,
						AGENT_NAME,
						at,
					),
				);
				save();
				renderApp();
			}

			function logCall(customerId, direction, seconds, outcome) {
				const customer = customerById(customerId);
				if (!customer) return;
				const at = nowIso();
				state.calls.push({
					id: uid("call"),
					customerId,
					regionId: customer.regionId,
					direction,
					agentId: AGENT_ID,
					startedAt: at,
					durationSeconds: seconds,
					outcome,
					linkedRef: null,
				});
				state.activities.push(
					act(
						customerId,
						customer.regionId,
						"call",
						null,
						`${direction === "in" ? "Inbound" : "Outbound"} call · ${formatDuration(seconds)}`,
						outcome,
						AGENT_NAME,
						at,
					),
				);
				save();
				renderApp();
				toast("Call logged on the customer timeline.");
			}

			/* --------------------------------------------------------- formatting */

			function esc(value) {
				return String(value == null ? "" : value).replace(
					/[&<>"']/g,
					(ch) =>
						({
							"&": "&amp;",
							"<": "&lt;",
							">": "&gt;",
							'"': "&quot;",
							"'": "&#39;",
						})[ch],
				);
			}

			function formatDuration(seconds) {
				const s = Math.max(0, Math.round(seconds));
				return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
			}

			/** Clock time in a region's own timezone — the only honest way to show it. */
			function localTime(iso, regionId) {
				const region = regionOf(regionId);
				return new Intl.DateTimeFormat("en-GB", {
					timeZone: region.timezone,
					hour: "2-digit",
					minute: "2-digit",
					hourCycle: "h23",
				}).format(new Date(iso));
			}

			function localDateTime(iso, regionId) {
				const region = regionOf(regionId);
				return new Intl.DateTimeFormat("en-GB", {
					timeZone: region.timezone,
					day: "2-digit",
					month: "short",
					hour: "2-digit",
					minute: "2-digit",
					hourCycle: "h23",
				}).format(new Date(iso));
			}

			function ago(iso) {
				const ms = now().getTime() - Date.parse(iso);
				const mins = Math.round(ms / 60000);
				if (mins < 1) return "just now";
				if (mins < 60) return `${mins}m ago`;
				const hours = Math.round(mins / 60);
				if (hours < 24) return `${hours}h ago`;
				return `${Math.round(hours / 24)}d ago`;
			}

			/** A countdown that reads the same way a supervisor would say it. */
			function countdown(dueAt) {
				const ms = remainingMs(dueAt, now());
				const over = ms < 0;
				const abs = Math.abs(ms);
				const mins = Math.floor(abs / 60000);
				const h = Math.floor(mins / 60);
				const m = mins % 60;
				const text = h > 0 ? `${h}h ${m}m` : `${m}m`;
				return { over, text, ms };
			}

			function slaPill(dueAt, label) {
				if (!dueAt) return "";
				const c = countdown(dueAt);
				const cls = c.over
					? "pill-critical"
					: c.ms < 30 * 60000
						? "pill-warn"
						: "pill-open";
				return `<span class="pill ${cls}">${esc(label)} ${c.over ? `overdue ${esc(c.text)}` : esc(c.text)}</span>`;
			}

			function titleCase(value) {
				return String(value)
					.replace(/_/g, " ")
					.replace(/\b[a-z]/g, (ch) => ch.toUpperCase());
			}

			/* ------------------------------------------------------------- render */

			function renderApp() {
				renderTopbar();
				renderTabs();
				const main = document.getElementById("main");
				const view = state.view;
				if (view === "dashboard") main.innerHTML = viewDashboard();
				else if (view === "inbox") main.innerHTML = viewInbox();
				else if (view === "contacts") main.innerHTML = viewContacts();
				else if (view === "leads") main.innerHTML = viewLeads();
				else if (view === "tickets") main.innerHTML = viewTickets();
				else if (view === "bookings") main.innerHTML = viewBookings();
				else if (view === "calls") main.innerHTML = viewCalls();
				else if (view === "bot") main.innerHTML = viewBot();
				else if (view === "broadcasts") main.innerHTML = viewBroadcasts();
				else if (view === "chat") main.innerHTML = viewChat();
				else if (view === "deals") main.innerHTML = viewDeals();
				else if (view === "reports") main.innerHTML = viewReports();
				else if (view === "setup") main.innerHTML = viewSetup();
				else main.innerHTML = viewOverview();

				const thread = document.getElementById("thread");
				if (thread) thread.scrollTop = thread.scrollHeight;
			}

			function renderTopbar() {
				const host = document.getElementById("regions");
				host.innerHTML = REGIONS.map((r) => {
					const unread = conversationsForRegion(r.id).filter(
						(c) => !c.firstResponseAt && c.firstResponseDueAt,
					).length;
					return `<button type="button" data-region="${esc(r.id)}" aria-pressed="${r.id === state.regionId}">
						<span class="dot dot-${esc(r.id)}"></span>${esc(r.label)}
						<span class="mono" style="font-size:11px;color:var(--ink-3)">${esc(r.displayNumber)}</span>
						${unread ? `<span class="count">${unread}</span>` : ""}
					</button>`;
				}).join("");

				const region = currentRegion();
				const open = isWithinBusinessHours(region, now());
				const clock = new Intl.DateTimeFormat("en-GB", {
					timeZone: region.timezone,
					weekday: "short",
					hour: "2-digit",
					minute: "2-digit",
					hourCycle: "h23",
				}).format(now());
				document.getElementById("regionClock").textContent =
					`${clock} ${region.timezone}`;
				const stateEl = document.getElementById("regionState");
				stateEl.className = `pill ${open ? "pill-open" : "pill-closed"}`;
				stateEl.textContent = open ? "Open" : "Closed";

				const presence = document.getElementById("presenceBtn");
				const online = state.presence[region.id];
				presence.textContent = online
					? `${region.label} agents: online`
					: `${region.label} agents: offline`;
				presence.setAttribute("aria-pressed", String(!!online));

				document.getElementById("clockBtn").textContent =
					clockOffsetMs === 0 ? "Jump to after hours" : "Back to real time";
			}

			function renderTabs() {
				document.getElementById("tabs").innerHTML = VIEWS.map(([id, label]) => {
					const badge =
						id === "tickets"
							? state.tickets.filter(
									(t) => t.status === "open" || t.status === "pending",
								).length
							: id === "leads"
								? state.leads.filter((l) => isLeadOpen(l.stage)).length
								: 0;
					return `<button type="button" role="tab" data-view="${esc(id)}" aria-selected="${state.view === id}">
							${esc(label)}${badge ? ` <span class="mono" style="color:var(--ink-3)">${badge}</span>` : ""}
						</button>`;
				}).join("");
			}

			/* --------------------------------------------------------- view: inbox */

			/*
			 * The wireframe's inbox is omnichannel: one list with WhatsApp, email
			 * and calls in it, filtered across the top. The filters are counts
			 * rather than decoration — an agent picks "SLA at risk" to find the
			 * two that matter, not to tidy the view.
			 */
			const CHANNEL_LABELS = {
				whatsapp: "WhatsApp",
				email: "Email",
				call: "Call",
			};

			function channelOf(conv) {
				return conv.channel || "whatsapp";
			}

			/*
			 * Where the conversation arrived. The wireframe calls this out
			 * specifically — "every thread names the WABA number it arrived on" —
			 * because an agent replying on the wrong number is answering as the
			 * wrong office.
			 */
			function arrivedOn(conv) {
				const region = regionOf(conv.regionId);
				const channel = channelOf(conv);
				if (channel === "email") return `${region.label} support inbox`;
				if (channel === "call") return `${region.label} switchboard`;
				return region.displayNumber;
			}

			function inboxFilters(convs) {
				const atRisk = convs.filter(
					(c) => !c.firstResponseAt && c.firstResponseDueAt,
				).length;
				const unassigned = convs.filter((c) => !c.assignedAgentId).length;
				const counts = {
					all: convs.length,
					whatsapp: convs.filter((c) => channelOf(c) === "whatsapp").length,
					email: convs.filter((c) => channelOf(c) === "email").length,
					call: convs.filter((c) => channelOf(c) === "call").length,
					unassigned,
					risk: atRisk,
				};
				const current = state.inboxFilter || "all";
				const chip = (id, label) =>
					`<button type="button" class="chip" data-inbox-filter="${esc(id)}" aria-pressed="${current === id}">${esc(label)} <span class="mono">${counts[id]}</span></button>`;
				return `<div class="chips">
					${chip("all", "All")}
					${chip("whatsapp", "WhatsApp")}
					${chip("email", "Email")}
					${chip("call", "Calls")}
					${chip("unassigned", "Unassigned")}
					${chip("risk", "SLA at risk")}
				</div>`;
			}

			function applyInboxFilter(convs) {
				switch (state.inboxFilter) {
					case "whatsapp":
					case "email":
					case "call":
						return convs.filter((c) => channelOf(c) === state.inboxFilter);
					case "unassigned":
						return convs.filter((c) => !c.assignedAgentId);
					case "risk":
						return convs.filter(
							(c) => !c.firstResponseAt && c.firstResponseDueAt,
						);
					default:
						return convs;
				}
			}

			function viewInbox() {
				const all = conversationsForRegion(state.regionId);
				const convs = applyInboxFilter(all);
				let selected = conversationById(state.selectedConversationId);
				if (!selected || selected.regionId !== state.regionId) {
					selected = convs[0] || all[0] || null;
					state.selectedConversationId = selected ? selected.id : null;
				}

				return `<div class="inbox">
					<section class="card">
						<h2>Conversations <small>${all.length}</small></h2>
						${inboxFilters(all)}
						<div class="convlist">${convs.length ? convs.map(convRow).join("") : `<div class="empty">Nothing matches this filter.</div>`}</div>
					</section>

					${
						selected
							? threadCard(selected)
							: `<section class="card">
								<h2>No conversation open<small>${esc(regionOf(state.regionId).displayNumber)}</small></h2>
								<div class="empty">Nobody has written to this number yet. Send the first message below and the platform will open the conversation.</div>
								${simPanel(null)}
							</section>`
					}

					${selected ? railFor(selected) : "<div></div>"}
				</div>`;
			}

			function convRow(conv) {
				const customer = customerById(conv.customerId);
				const last = conv.messages[conv.messages.length - 1];
				const ticket = anyOpenTicketFor(conv.customerId);
				const lead = openLeadFor(conv.customerId);
				const tags = [];
				if (!conv.firstResponseAt && conv.firstResponseDueAt) {
					tags.push(slaPill(conv.firstResponseDueAt, "First reply"));
				}
				if (ticket)
					tags.push(`<span class="pill pill-brand">${esc(ticket.ref)}</span>`);
				if (lead)
					tags.push(`<span class="pill pill-brand">${esc(lead.ref)}</span>`);
				// The window rule is WhatsApp's. An email or a call does not have
				// one, and showing "window closed" against them would be telling
				// an agent something untrue about the channel they are on.
				if (channelOf(conv) === "whatsapp" && !windowOpen(conv)) {
					tags.push('<span class="pill pill-closed">Window closed</span>');
				}
				tags.unshift(
					`<span class="pill">${esc(CHANNEL_LABELS[channelOf(conv)] || "WhatsApp")}</span>`,
				);
				return `<button class="conv" type="button" data-conv="${esc(conv.id)}" aria-current="${conv.id === state.selectedConversationId}">
					<span class="row1">
						<span class="name">${esc(customer ? customer.displayName : conv.customerId)}</span>
						<span class="time">${esc(ago(conv.lastInboundAt))}</span>
					</span>
					<span class="preview">${esc(last ? (last.dir === "out" ? "↩ " : "") + last.text : "")}</span>
					${tags.length ? `<span class="tags">${tags.join("")}</span>` : ""}
				</button>`;
			}

			function threadCard(conv) {
				const customer = customerById(conv.customerId);
				const open = windowOpen(conv);
				const region = regionOf(conv.regionId);

				const channel = channelOf(conv);
				// "Every thread names the WABA number it arrived on" — wireframe 1a,
				// note 2. For email and calls it names the inbox or switchboard
				// instead, and the 24-hour window is not mentioned at all, because
				// that rule belongs to WhatsApp.
				const where = `${region.label} · ${CHANNEL_LABELS[channel] || "WhatsApp"} · ${arrivedOn(conv)}`;
				return `<section class="card">
					<h2>
						${esc(customer ? customer.displayName : "")}
						<small>${esc(where)}${channel === "whatsapp" ? ` · ${open ? `window open, ${esc(countdown(conv.windowExpiresAt).text)} left` : "window closed"}` : ""}</small>
					</h2>

					<div class="thread" id="thread">
						${conv.messages.map(bubble).join("")}
					</div>

					<div class="composer">
						<textarea id="replyBox" placeholder="${open ? "Reply to the customer…" : "The 24-hour window has closed. Free text cannot be sent; use a template."}" ${open ? "" : "disabled"}></textarea>
						<div class="actions">
							<button class="primary" type="button" id="replyBtn" ${open ? "" : "disabled"}>Send reply</button>
							<select id="templateSelect" class="ghost">
								<option value="abc_service_followup">abc_service_followup</option>
								<option value="abc_shipment_status_update">abc_shipment_status_update</option>
								<option value="abc_delivery_completed">abc_delivery_completed</option>
							</select>
							<button class="ghost" type="button" id="templateBtn">Send template</button>
							${open ? "" : '<span class="muted" style="font-size:12.5px">Meta only allows an approved template outside the window.</span>'}
						</div>
					</div>

					${transferPanel(conv)}
					${simPanel(conv)}
				</section>`;
			}

			/**
			 * Transfer, including across regions.
			 *
			 * The one thing worth watching on this panel is the line about the
			 * number. The designs offer "Forward to KSA team" as though a
			 * conversation could move house; it cannot. The customer messaged a
			 * particular WhatsApp number, that is the thread on their handset, and
			 * the 24-hour window belongs to that number. So a transfer moves who
			 * owns the work and leaves the channel exactly where it was — the KSA
			 * team answers, and the reply still leaves from the UAE number.
			 *
			 * The warnings are the platform's, not the screen's. Nothing here
			 * decides whether a handover is sensible; it asks
			 * ENGINE.transferConversation and prints the answer.
			 */
			function transferPanel(conv) {
				const teams = state.teams.filter(
					(team) =>
						team.id !== conv.assignedTeamId || team.regionId !== conv.regionId,
				);
				const caller = currentCaller();
				const recent = state.transfers
					.filter((r) => r.conversationId === conv.id)
					.slice(-3)
					.reverse();

				const options = teams
					.map((team) => {
						const decision = ENGINE.canTransfer(caller, conv, team.regionId);
						return `<option value="${esc(team.id)}" data-region="${esc(team.regionId)}" ${decision.allowed ? "" : "disabled"}>
							${esc(team.label)}${team.regionId === conv.regionId ? "" : " · " + esc(team.regionId.toUpperCase())}${decision.allowed ? "" : " — not permitted"}
						</option>`;
					})
					.join("");

				return `<section class="card">
					<h2>Transfer <small>${esc(signedInAs().displayName)} · ${esc(signedInAs().role.replace(/_/g, " "))}</small></h2>
					<div class="actions" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
						<select id="transferTeam" class="ghost">${options}</select>
						<input id="transferReason" type="text" placeholder="Reason (required)" style="flex:1;min-width:200px" />
						<button class="ghost" type="button" id="transferBtn">Transfer</button>
					</div>
					<p class="muted" style="font-size:12px;margin:8px 0 0">
						Ownership moves; the WhatsApp number does not. Replies still leave
						from <span class="mono">${esc(regionOf(conv.regionId).displayNumber)}</span>,
						because that is the thread the customer has. The service clock is
						carried over rather than restarted — a transfer is not a way to
						clear a late queue.
					</p>
					<div id="transferResult">${
						recent.length
							? `<div class="tablewrap" style="margin-top:10px"><table>
								<thead><tr><th>When</th><th>From</th><th>To</th><th>Why</th></tr></thead>
								<tbody>${recent
									.map(
										(r) => `<tr>
										<td class="mono">${esc(ago(r.at))}</td>
										<td>${esc(r.fromTeamId ?? "unassigned")}</td>
										<td>${esc(r.toTeamId)} ${r.crossRegion ? `<span class="pill">${esc(r.toRegionId.toUpperCase())}</span>` : ""}</td>
										<td class="muted">${esc(r.reason)}</td>
									</tr>`,
									)
									.join("")}</tbody>
							</table></div>`
							: ""
					}</div>
				</section>`;
			}

			/** The signed-in person, as the Setup screen's people list holds them. */
			function signedInAs() {
				return (
					state.staff.find((u) => u.id === "usr_hakkeem") ?? {
						id: "usr_hakkeem",
						displayName: "Hakkeem M",
						role: "master_admin",
						status: "active",
					}
				);
			}

			/**
			 * The signed-in person as the platform's authorisation functions expect
			 * them: a Caller, with the regions their teams place them in.
			 *
			 * Built from the Setup screen's own records rather than hard-coded, so
			 * demoting yourself there changes what you may do here. That is the
			 * point of asking the platform instead of the screen.
			 */
			function currentCaller() {
				const me = signedInAs();
				const teamIds = state.teams
					.filter(
						(team) => me.role !== "agent" || team.regionId === state.regionId,
					)
					.map((team) => team.id);
				const regionIds =
					me.role === "master_admin"
						? REGIONS.map((r) => r.id)
						: [
								...new Set(
									state.teams
										.filter((t) => teamIds.includes(t.id))
										.map((t) => t.regionId),
								),
							];
				return {
					kind: "user",
					id: me.id,
					email: me.email ?? "",
					displayName: me.displayName,
					role: me.role,
					status: me.status,
					regionIds,
					teamIds,
				};
			}

			/**
			 * The customer simulator. It is rendered both under an open thread
			 * and on a number with no conversations at all — otherwise the empty
			 * state would tell an agent to use a control that is not on screen.
			 */
			function simPanel(conv) {
				const trace =
					lastTrace && conv && lastTrace.conversationId === conv.id
						? traceCard(lastTrace)
						: !conv && lastTrace
							? traceCard(lastTrace)
							: "";
				const customers = state.customers.filter(
					(c) => c.regionId === state.regionId,
				);
				const chosen = conv ? conv.customerId : "";
				const picker = customers.length
					? `<label class="simwho">Sending as
							<select id="simCustomer" class="ghost">
								${customers.map((c) => `<option value="${esc(c.id)}" ${c.id === chosen ? "selected" : ""}>${esc(c.displayName)} · ${esc(c.phone)}</option>`).join("")}
							</select>
						</label>`
					: `<div class="muted" style="font-size:12.5px">No customer on file for this number.</div>`;

				return `<div class="sim">
					<h4>Simulate a customer message</h4>
					${picker}
					<div class="inputrow">
						<input id="simBox" placeholder="Type what a customer would write…" />
						<button class="primary" type="button" id="simBtn">Send as customer</button>
					</div>
					<div class="chips">
						${SAMPLES.map((s) => `<button class="chip" type="button" data-sample="${esc(s)}">${esc(s.length > 42 ? s.slice(0, 41) + "…" : s)}</button>`).join("")}
					</div>
					${trace}
				</div>`;
			}

			function bubble(m) {

				return `<div class="bubble ${m.dir === "in" ? "in" : "out"}">${

				}<span class="text">${esc(m.text)}</span><div class="meta">${esc(localTime(m.at, state.regionId))}${m.dir === "out" ? " ✓✓" : ""}</div></div>`;

			function traceCard(t) {
				const lines = [];
				lines.push(
					`<li><b>Intent:</b> ${esc(t.intent.intent)} (confidence ${esc(t.intent.confidence)})${t.intent.matched ? `, on the words “${esc(t.intent.matched)}”` : ", on no keyword"}</li>`,
				);
				if (t.intent.references.length) {
					lines.push(
						// Once a shipment is matched, show its reference as the office
						// prints it. The normalised form is a lookup key, and reads
						// like a typo to anyone watching.
						t.booking
							? `<li><b>Shipment matched:</b> ${esc(t.booking.ref)}, currently ${esc(t.booking.milestone)}</li>`
							: `<li><b>Reference found:</b> ${t.intent.references.map(esc).join(", ")} — no shipment with that reference</li>`,
					);
				}
				if (t.outcome === null) {
					lines.push(
						"<li><b>Created nothing.</b> This intent is handled in the conversation. Not creating work is as important as creating it.</li>",
					);
				}
				if (t.lead) {
					lines.push(
						t.reusedExisting
							? `<li><b>Reused the open lead ${esc(t.lead.ref)}</b> rather than opening a second one for the same customer.</li>`
							: `<li><b>Opened sales lead ${esc(t.lead.ref)}</b> at stage “${esc(t.lead.stage)}”.</li>`,
					);
				}
				if (t.ticket) {
					lines.push(
						t.reusedExisting
							? `<li><b>Reused the open ticket ${esc(t.ticket.ref)}</b> rather than opening a second one.</li>`
							: `<li><b>Opened ticket ${esc(t.ticket.ref)}</b> · ${esc(t.ticket.type)}, priority ${esc(t.ticket.priority)}. First reply due ${esc(localDateTime(t.ticket.firstResponseDueAt, t.ticket.regionId))}, resolution due ${esc(localDateTime(t.ticket.resolutionDueAt, t.ticket.regionId))} (${esc(regionOf(t.ticket.regionId).timezone)}).</li>`,
					);
				}
				if (t.autoReason) {
					lines.push(
						`<li><b>Sent the automated reply</b> because the reason was “${esc(t.autoReason)}”. An agent owning the conversation would have suppressed it.</li>`,
					);
				} else {
					lines.push(
						"<li><b>No automated reply.</b> The region is open with an agent available, so the customer waits for a person.</li>",
					);
				}
				return `<div class="trace">
					<h5>What the platform did, and why</h5>
					<ul>${lines.join("")}</ul>
				</div>`;
			}

			/* --------------------------------- helpers for the newer screens */

			/** The last thing the customer said, whichever way it was recorded. */
			function lastInboundAt(c) {
				if (c.lastInboundAt) return c.lastInboundAt;
				const last = [...c.messages].reverse().find((m) => m.dir === "in");
				return last ? last.at : null;
			}

			/** The customer has spoken since we last did. */
			function isUnanswered(c) {
				if (c.status === "resolved") return false;
				const msgs = [...c.messages].reverse();
				const lastIn = msgs.find((m) => m.dir === "in");
				if (!lastIn) return false;
				const lastOut = msgs.find((m) => m.dir === "out");
				return !lastOut || Date.parse(lastOut.at) < Date.parse(lastIn.at);
			}

			function customerFor(conversation) {
				return customerById(conversation.customerId);
			}

			/*
			 * The lifecycle stage is derived by the platform from what the customer
			 * has actually done, not stored on a record somebody has to remember to
			 * update. This gathers the facts and hands them to ENGINE.lifecycleFor.
			 */
			function lifecycleOf(customer) {
				const theirConversation = state.conversations.find(
					(c) => c.customerId === customer.id,
				);
				return ENGINE.lifecycleFor(
					{
						leads: state.leads
							.filter((l) => l.customerId === customer.id)
							.map((l) => ({ stage: l.stage, updatedAt: l.updatedAt })),
						quotations: state.quotations
							.filter((q) => q.customerId === customer.id)
							.map((q) => ({ status: q.status, updatedAt: q.updatedAt })),
						bookings: state.bookings
							.filter((b) => b.customerId === customer.id)
							.map((b) => ({ milestone: b.milestone, createdAt: b.createdAt })),
						lastInboundAt: theirConversation
							? lastInboundAt(theirConversation)
							: null,
					},
					now(),
				);
			}

			/* ----------------------------------------------------- view: dashboard */

			/*
			 * Everything on this screen that says "open", "closes in" or "today"
			 * comes from ENGINE.officeState and ENGINE.regionalDay, which is the
			 * same code the real dashboard route runs. The three regions are read
			 * in their own hours, which is why they do not agree.
			 */
			function viewDashboard() {
				const me = "Hakkeem M";
				const greet = ENGINE.greeting({
					displayName: me,
					now: now(),
					timezone: currentRegion().timezone,
				});

				const strip = REGIONS.map((r) => {
					const o = ENGINE.officeState(r, now());
					const day = ENGINE.regionalDay(now(), r.timezone);
					const convs = state.conversations.filter((c) => c.regionId === r.id);
					const unanswered = convs.filter((c) => isUnanswered(c));
					const todayIn = convs.reduce(
						(n, c) =>
							n +
							c.messages.filter(
								(m) => m.dir === "in" && m.at >= day.from && m.at < day.to,
							).length,
						0,
					);
					const openTickets = state.tickets.filter(
						(t) =>
							t.regionId === r.id &&
							(t.status === "open" || t.status === "pending"),
					);
					const breaching = openTickets.filter(
						(t) =>
							(!t.firstResponseAt && isBreached(t.firstResponseDueAt, now())) ||
							isBreached(t.resolutionDueAt, now()),
					);
					return `<section class="card">
						<h2>${esc(r.label)} <span class="mono muted" style="font-size:11.5px">${esc(r.displayNumber)}</span></h2>
						<div style="display:flex;align-items:center;gap:8px;margin:2px 0 10px">
							<span class="pill ${o.open ? "pill-open" : "pill-closed"}">${o.open ? "Open" : "Closed"}</span>
							<span class="mono" style="font-size:13px">${esc(o.localTime)}</span>
							<span class="muted" style="font-size:12px">${esc(o.nextChange ?? "")} in ${esc(ENGINE.describeMinutes(o.changesInMinutes))}</span>
						</div>
						<div class="stats" style="grid-template-columns:repeat(2,1fr)">
							<div class="stat"><div class="n">${unanswered.length}</div><div class="l">Waiting on us</div><div class="h">${convs.length} open in total</div></div>
							<div class="stat"><div class="n">${todayIn}</div><div class="l">Inbound today</div><div class="h">${esc(r.timezone)} day</div></div>

				const attention = state.conversations
					.filter((c) => isUnanswered(c))

						c,
						mins: Math.floor(
							(now().getTime() - Date.parse(lastInboundAt(c))) / 60000,

				return `<div style="display:grid;gap:14px">

			/* ----------------------------------------------------------- view: bot */

			/*

			function viewBot() {
				const region = currentRegion();
				const starter = ENGINE.buildStarterFlow({

				const warnings = check.problems.filter((p) => p.severity === "warning");

				const script = state.botScript ?? DEFAULT_BOT_SCRIPT;
				const messages = script
					.split("\n")
					.map((line) => line.trim())
					.filter(Boolean)
					.map((text) => ({
						text,
						facts: {
							contactName: "Rashid",
							references: ENGINE.extractTrackingNumbers(text),
							booking: /088210/.test(text.replace(/[^0-9]/g, ""))
								? { ref: "ABC-UAE-088210", milestone: "In transit" }

						},

				let result = null;
				try {
					result = ENGINE.previewFlow({ flow, messages });

				const turns = (result?.turns ?? [])

				const bc = {

				return `<div style="display:grid;gap:14px">

							<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
